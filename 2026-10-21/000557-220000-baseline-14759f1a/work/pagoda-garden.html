<body>
<canvas id="c"></canvas>
<div class="hud" id="title"><h1>暮れ庭 &mdash; TWILIGHT PAGODA GARDEN</h1><p>a floating voxel island &middot; five-storied pagoda &middot; koi pond &middot; sakura at dusk</p></div>
<div class="hud" id="stats"></div>
<div class="hud" id="hint">drag&nbsp;orbit &middot; scroll&nbsp;zoom &middot; double-click&nbsp;reset</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= seeded random ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261021);
const R=(a,b)=>a+(b-a)*rnd();
const RI=(a,b)=>Math.floor(R(a,b+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const PAL=a=>a[Math.floor(rnd()*a.length)];
const C=(r,g,b)=>[r/255,g/255,b/255];

/* ================= static voxel store ================= */
const V={x:[],y:[],z:[],r:[],g:[],b:[]};
function add(x,y,z,c,m=1){
  x=Math.round(x);y=Math.round(y);z=Math.round(z);
  const j=0.93+0.14*rnd();
  V.x.push(x);V.y.push(y);V.z.push(z);
  V.r.push(c[0]*m*j);V.g.push(c[1]*m*j);V.b.push(c[2]*m*j);
}
function box(x1,x2,y1,y2,z1,z2,c,m=1){for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++)add(x,y,z,c,m)}
function plateXZ(x1,x2,y,z1,z2,c,m=1){for(let x=x1;x<=x2;x++)for(let z=z1;z<=z2;z++)add(x,y,z,c,m)}
function boxRingXZ(x1,x2,y,z1,z2,c,m=1){for(let x=x1;x<=x2;x++){add(x,y,z1,c,m);add(x,y,z2,c,m)}for(let z=z1+1;z<=z2-1;z++){add(x1,y,z,c,m);add(x2,y,z,c,m)}}
function wallRingXZ(x1,x2,y1,y2,z1,z2,c,m=1){for(let y=y1;y<=y2;y++)boxRingXZ(x1,x2,y,z1,z2,c,m)}
function emitter(cx,cz,rot){const co=Math.cos(rot),si=Math.sin(rot);
  return(x,y,z,c,m=1)=>add(cx+x*co+z*si,y,cz-x*si+z*co,c,m)}

/* ================= palettes (0..1) ================= */
const GRASS =[C(96,156,80),C(112,172,90),C(84,138,70),C(128,180,96)];
const MOSS  =[C(58,96,52),C(70,112,58)];
const DIRT  =[C(110,82,58),C(96,70,50),C(124,94,64)];
const STONE =[C(128,124,132),C(112,108,118),C(142,138,146),C(96,92,104)];
const ROCK  =[C(86,82,94),C(72,70,82),C(102,96,108)];
const GRAVEL=[C(212,204,190),C(224,216,200),C(198,190,178)];
const RAKE  =[C(184,174,162),C(170,160,150)];
const SAND  =[C(214,200,164),C(226,214,182)];
const MULCH =[C(86,64,46),C(74,56,40)];
const PINKS =[C(255,183,197),C(255,158,184),C(255,214,224),C(243,140,172),C(255,240,245)];
const WPINKS=[C(252,222,235),C(246,196,220),C(255,244,250)];
const REDS  =[C(214,74,42),C(238,126,52),C(178,50,44),C(248,168,74)];
const PINEG =[C(38,82,56),C(48,98,64),C(30,68,48)];
const LEAFG =[C(64,124,66),C(82,142,72),C(52,106,58)];
const BAMBOO=[C(122,168,96),C(104,150,84),C(142,182,110)];
const BAMBUD=[C(168,196,132),C(150,182,114)];
const BAMBN =[C(96,128,74)];
const WOODD =[C(96,58,44),C(84,50,40),C(110,68,48)];
const WOODL =[C(168,124,84),C(184,142,96),C(150,110,76)];
const VERM  =[C(196,54,42),C(178,44,36),C(210,66,48)];
const REDW  =[C(150,48,44),C(134,40,38)];
const PLASTER=[C(238,232,218),C(228,220,206)];
const ROOFD =[C(42,62,74),C(52,76,88),C(36,54,66)];
const GOLD  =[C(226,180,74),C(244,204,110),C(204,156,58)];
const THATCH=[C(172,146,88),C(150,126,76),C(188,162,102)];
const WATERD=[C(48,116,132),C(38,98,118)];
const WATERS=[C(64,140,158),C(92,170,182),C(38,104,124)];
const FALLC =[C(208,236,244),C(178,220,236),C(232,246,250)];
const FLOWER=[C(238,88,98),C(250,224,96),C(238,120,204),C(148,120,238),C(255,255,240)];
const AZPINK=[C(232,120,176),C(214,96,158)];
const AZPUR =[C(176,130,226),C(158,110,208)];
const DARK  =[C(58,40,34),C(46,32,30)];
const BARKM =[C(92,52,44),C(80,44,40)];
const INDIGO=[C(52,64,128),C(44,54,112)];
const SHOJI =[C(250,240,214)];
const KAMON =[C(214,206,190)];
const CRESTW=C(236,232,220);
const CLOVER=C(92,148,84);
const SHROOM_ST=C(236,226,206), SHROOM_CAP=C(214,64,52);
const CAT_TAIL=C(132,90,64);
const BLACKL=[C(38,34,40),C(50,44,52)];

/* emissive (unlit) store */
const G={x:[],y:[],z:[],r:[],g:[],b:[]};
function gadd(x,y,z,c){G.x.push(Math.round(x));G.y.push(Math.round(y));G.z.push(Math.round(z));G.r.push(c[0]);G.g.push(c[1]);G.b.push(c[2])}
const WARM1=[1.0,0.74,0.40], WARM2=[1.0,0.86,0.60];

/* ================= terrain ================= */
const GEND=43, GW=88;
const gi=(x,z)=>(x+GEND)+(z+GEND)*GW;
const inB=(x,z)=>x>=-GEND&&x<=GEND&&z>=-GEND&&z<=GEND;
const H=new Int16Array(GW*GW);
const SRF=new Uint8Array(GW*GW);        //0 grass 1 stone 2 gravel 3 sand 4 soil 5 mulch
const pondQ=(x,z)=>{const dx=(x-10)/13,dz=(z+4)/9;return dx*dx+dz*dz};
const gauss=(x,z,cx,cz,s)=>{const dx=(x-cx)/s,dz=(z-cz)/s;return Math.exp(-(dx*dx+dz*dz))};
const clamp01=v=>Math.max(0,Math.min(1,v));
function baseH(x,z){
  let h=2+1.1*Math.sin(x*0.17)*Math.cos(z*0.15)+0.7*Math.sin((x+z)*0.11);
  const q=pondQ(x,z);
  h+=13*gauss(x,z,28,-2,7)*clamp01((q-1.02)/0.33);   // waterfall cliff/hill, only outside pond
  h-=4.6*gauss(x,z,28,-2,3.2);                       // crater pool
  h+=3.4*gauss(x,z,-16,28,10);
  h+=2.2*gauss(x,z,-34,-32,8);
  if(q<1.02) h-=5.4*Math.pow(Math.max(0,1.06-q),0.55);   // pond basin
  else if(q<1.35) h-=(1.35-q)*1.4;
  const rim=Math.max(Math.abs(x),Math.abs(z));
  if(rim>36) h-=(rim-36)*0.42;
  return Math.round(Math.max(-4,h));
}
for(let x=-GEND;x<=GEND;x++)for(let z=-GEND;z<=GEND;z++)H[gi(x,z)]=baseH(x,z);
for(let x=-36;x<=-12;x++)for(let z=-26;z<=-2;z++)H[gi(x,z)]=2;       // pagoda plaza pad
const groundTop=(x,z)=>inB(x,z)?H[gi(x,z)]:-7;

function paint(cx,cz,r,kind){
  for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++)for(let z=Math.floor(cz-r);z<=Math.ceil(cz+r);z++){
    if(!inB(x,z))continue;const dx=x-cx,dz=z-cz;
    if(dx*dx+dz*dz<=r*r*(0.8+0.35*rnd()))SRF[gi(x,z)]=kind;
  }
}
function paintRect(x1,x2,z1,z2,kind){for(let x=x1;x<=x2;x++)for(let z=z1;z<=z2;z++)if(inB(x,z))SRF[gi(x,z)]=kind}
function paintPath(pts,kind=1){
  for(let i=0;i<pts.length-1;i++){
    const[x1,z1]=pts[i],[x2,z2]=pts[i+1];
    const n=Math.ceil(Math.hypot(x2-x1,z2-z1)*2);
    for(let s=0;s<=n;s++){const t=s/n;
      paint(x1+(x2-x1)*t+(rnd()-0.5)*1.2, z1+(z2-z1)*t+(rnd()-0.5)*1.2, R(1.0,1.7), kind);}
  }
}
/* -------- layout -------- */
paintPath([[30,29],[24,25],[17,19],[10,16],[2,13],[-6,9],[-11,2],[-13,-6]]);      // torii -> pagoda
paintPath([[17,19],[22,16],[26,12],[29,7],[31,1],[32,-5],[34,-9]]);               // shrine loop
paintPath([[-16,-8],[-19,-2],[-21,6],[-20,14],[-16,20],[-10,22]]);                // pagoda -> teahouse
paintPath([[-16,20],[-22,18],[-26,15]]);                                          // -> zen garden
paintPath([[2,13],[-2,18],[-6,22]]);                                               // pondside stroll
paintRect(-36,-12,-26,-2,1);                                                       // pagoda plaza stone
paint(-33,10,6.2,2); paint(-33,16.5,5.6,2);                                        // karesansui (raked gravel)
paint(23,0,3.2,3); paint(21,4,2.2,3);                                              // sandy east shore
paint(28,-2,4.4,4);                                                                // pool basin soil
paintRect(26,-21,38,-13,5); paintRect(30,-19,40,-14,5);                            // bamboo mulch
paint(30,29,6,1);                                                                  // torii apron
/* -------- columns -------- */
const reedZone=[];
for(let x=-GEND;x<=GEND;x++)for(let z=-GEND;z<=GEND;z++){
  const h=H[gi(x,z)],s=SRF[gi(x,z)],q=pondQ(x,z);
  let top;
  if(s===1)top=PAL(STONE);
  else if(s===2){
    const d1=Math.hypot(x+33,z-10),d2=Math.hypot(x+33,z-16.5);
    const ring=(d1<5.4&&Math.abs((d1%2.2)-1.1)<0.55)||(d2<4.6&&Math.abs((d2%2.0)-1.0)<0.5);
    top=((z%3===0)||ring)?PAL(RAKE):PAL(GRAVEL);
  }
  else if(s===3)top=PAL(SAND);
  else if(s===4)top=PAL(MULCH);
  else if(s===5)top=PAL(MULCH);
  else if(q<1.02)top=q<0.72?PAL(WATERD):PAL([C(64,120,120),C(96,132,116),C(150,142,112)]);
  else top=q<1.5?PAL([C(92,120,96),C(104,132,100)]):PAL(GRASS);
  add(x,h,z,top);
  const mn=Math.min(groundTop(x+1,z),groundTop(x-1,z),groundTop(x,z+1),groundTop(x,z-1));
  for(let y=h-1;y>=mn;y--){
    let c,m=1;
    if(q<1.15&&y<1)c=PAL(WATERD);
    else if(Math.max(Math.abs(x),Math.abs(z))>=GEND-1){c=PAL(ROCK);m=0.88}
    else c=(h-y>2||rnd()<0.5)?PAL(STONE):PAL(DIRT);
    add(x,y,z,c,m);
  }
  if(s===0&&q<1.05)reedZone.push([x,z,h]);
}

/* ================= flora ================= */
const canopyTrees=[];
function blob(cx,cy,cz,r,pal,density=0.82){
  for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
    const d2=(dx*dx+dy*dy*1.5+dz*dz)/(r*r);
    if(d2<=1.18&&rnd()>density*0.5+d2*0.3)add(cx+dx,cy+Math.round(dy*0.7),cz+dz,PAL(pal));
  }
}
function trunk(x,z,y0,up,leanX,leanZ,cols){
  let px=x,pz=z;
  for(let i=0;i<up;i++){
    add(px,y0+i,pz,PAL(cols));
    if(rnd()<0.6)add(px+1,y0+i,pz,PAL(cols));
    if(rnd()<0.5)add(px,y0+i,pz+1,PAL(cols));
    if(leanX&&rnd()<0.3)px+=Math.sign(leanX);
    if(leanZ&&rnd()<0.3)pz+=Math.sign(leanZ);
  }
  return[px,y0+up,pz];
}
function cherryTree(x,z,s=1,white=false){
  const h=groundTop(x,z),pal=white?WPINKS:PINKS,th=Math.round(R(4,6)*s);
  const[tx,ty,tz]=trunk(x,z,h+1,th,R(-1,1),R(-1,1),WOODD);
  for(let b=0;b<4;b++){
    const a=b/4*Math.PI*2+R(-0.5,0.5),L=RI(2,4);
    let bx=tx,bz=tz,by=ty-1;
    for(let i=0;i<L;i++){bx+=Math.round(Math.cos(a));bz+=Math.round(Math.sin(a));by+=1;add(bx,by,bz,PAL(WOODD))}
    blob(bx,by+1,bz,Math.round(R(2,3)*s),pal);
  }
  blob(tx,ty+2,tz,Math.round(3.4*s),pal);
  canopyTrees.push({x:tx,y:ty+4,z:tz,r:4.6*s,pal});
}
function pineTree(x,z,sc=1){
  const h=groundTop(x,z);
  let px=x,pz=z;
  for(let i=0;i<Math.round(7*sc);i++){add(px,h+1+i,pz,PAL(WOODD));if(i%3===0)px+=1}
  const layers=[[px+1,pz,4],[px-1,pz+1,3.4],[px+1,pz-1,2.8],[px,pz+1,2.2]];
  layers.forEach((L,i)=>{
    const y=h+4+Math.round(i*2.6*sc),r=Math.max(1,Math.round(L[2]*sc));
    for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++){
      const d=Math.hypot(dx,dz);
      if(d<=r+0.3){add(L[0]+dx,y+Math.round((r-d)*0.35),L[1]+dz,PAL(PINEG));
        if(d<r*0.6)add(L[0]+dx,y+Math.round((r-d)*0.35)+1,L[1]+dz,PAL(PINEG),1.18)}
    }
  });
}
function mapleTree(x,z){
  const h=groundTop(x,z);
  const[tx,ty,tz]=trunk(x,z,h+1,4,R(-1,1),R(-1,1),BARKM);
  blob(tx,ty+1,tz,3,REDS,0.9);blob(tx+2,ty,tz-1,2.4,REDS,0.9);blob(tx-2,ty-1,tz+2,2.4,REDS,0.9);
  canopyTrees.push({x:tx,y:ty+2,z:tz,r:3,pal:REDS});
}
function bamboo(x,z){
  const h=groundTop(x,z),hh=RI(10,16);
  for(let y=1;y<=hh;y++)add(x,h+y,z,y%3===0?PAL(BAMBN):PAL(BAMBOO));
  for(let y=hh-4;y<=hh;y+=2)for(let k=0;k<3;k++)add(x+RI(-2,2),h+y+RI(0,2),z+RI(-2,2),PAL(BAMBUD));
  add(x+RI(-1,1),h+hh+1,z+RI(-1,1),PAL(BAMBUD));
}
function bush(x,z,r,pal){blob(x,groundTop(x,z)+r,z,r,pal,0.7)}
function rockClump(x,z,r,mossy=true,baseY=null){
  const h=(baseY===null?groundTop(x,z):baseY);
  for(let dx=-r;dx<=r;dx++)for(let dy=0;dy<=r;dy++)for(let dz=-r;dz<=r;dz++){
    if(Math.hypot(dx,dy*1.3,dz)<=r*(0.75+0.3*rnd()))add(x+dx,h+1+dy,z+dz,PAL(ROCK));
  }
  if(mossy)for(let k=0;k<6;k++)add(x+RI(-r,r),h+RI(1,Math.max(1,r)),z+RI(-r,r),PAL(MOSS));
}
/* place */
cherryTree(-2,-15,1.25);   // grand sakura over the pond's south bank
cherryTree(20,-14,1.0);
cherryTree(-12,6,0.9);
cherryTree(-27,24,1.15);
cherryTree(31,22,0.95);
cherryTree(13,26,1.05);
cherryTree(-36,25,0.8,true);
cherryTree(38,6,0.75,true);
mapleTree(17,7);
mapleTree(-16,2);
mapleTree(-32,-30);
pineTree(-28,2,1.0);
pineTree(-31,18.5,0.7);    // pruned pine inside the karesansui
pineTree(-40,-14,1.0);
pineTree(4,30,0.9);
pineTree(40,17,0.8);
bush(-10,-8,2,AZPINK);
bush(2,14,1.6,AZPUR);
bush(-18,-5,1.8,[C(236,140,150)]);
bush(19,16,1.5,LEAFG);
bush(-8,18,1.3,[C(196,140,196)]);
bush(27,19,1.6,PINEG);
bush(29,24,1.3,LEAFG);
bush(-14,12,1.5,LEAFG);
bush(-22,29,1.7,PINEG);
for(let k=0;k<48;k++)bamboo(RI(26,39),RI(-21,-13));
for(let k=0;k<10;k++)bamboo(RI(24,27),RI(-19,-15));
rockClump(14,4,2.2);
rockClump(5,-10,1.8,true,1);      // islet in the pond
rockClump(6,-9,1);
rockClump(-4,-4,1.9,true,1);      // another islet
rockClump(-4,25,1.5);rockClump(34,-6,2.4);rockClump(31,3,1.8);rockClump(-16,-24,1.7);
rockClump(-28,-4,2.0);rockClump(-35,12,2.1);rockClump(-30,17,1.5);rockClump(22,23,1.6);
for(let k=0;k<2400;k++){          // ground cover
  const x=RI(-GEND+2,GEND-2),z=RI(-GEND+2,GEND-2);
  if(pondQ(x,z)<1.5||SRF[gi(x,z)]!==0||H[gi(x,z)]<2)continue;
  const h=groundTop(x,z),t=rnd();
  if(t<0.7){add(x,h+1,z,PAL(GRASS),1.04);if(rnd()<0.4)add(x,h+2,z,PAL(GRASS),1.12)}
  else if(t<0.84){add(x,h+1,z,PAL(FLOWER));if(rnd()<0.5)add(x,h+2,z,[C(255,244,150)])}
  else if(t<0.93)add(x,h+1,z,CRESTW);
  else{add(x,h+1,z,CLOVER);add(x+1,h+1,z,CLOVER)}
}
[[-28,4],[-40,-12],[-29,20],[4,32]].forEach(m=>{        // mushrooms
  for(let k=0;k<3;k++){const x=m[0]+RI(-2,2),z=m[1]+RI(-2,2),h=groundTop(x,z);
    add(x,h+1,z,SHROOM_ST);add(x,h+2,z,SHROOM_CAP);if(rnd()<0.5)add(x+1,h+2,z,SHROOM_CAP)}
});
reedZone.forEach(([x,z,h])=>{                            // reeds & cattails
  if(rnd()<0.32){const g=[C(96,132,84),C(82,118,74)];
    for(let y=1;y<=RI(1,3);y++)add(x,h+y,z,PAL(g));
    if(rnd()<0.4){add(x,h+4,z,CAT_TAIL);add(x,h+5,z,CAT_TAIL)}
  }
});

/* ================= props ================= */
const LANTERNS=[];
function stoneLantern(x,z,lit=false){
  const h=groundTop(x,z),D=STONE.map(c=>c.map(v=>v*0.78));
  for(const[ox,oz]of[[0,0],[1,0],[-1,0],[0,1],[0,-1]])add(x+ox,h+1,z+oz,PAL(STONE));
  add(x,h+2,z,PAL(D));
  add(x,h+3,z,PAL(STONE));add(x,h+4,z,PAL(STONE));add(x,h+5,z,PAL(STONE));
  const yf=h+7;
  if(lit){
    add(x-1,yf,z,PAL(STONE));add(x+1,yf,z,PAL(STONE));add(x,yf,z-1,PAL(STONE));add(x,yf,z+1,PAL(STONE));
    gadd(x,yf,z,WARM1);
  }else add(x,yf,z,PAL(STONE));
  add(x,yf-1,z,PAL(D));add(x,yf+1,z,PAL(D));
  boxRingXZ(x-1,x+1,yf+2,x-1,z+1,PAL(STONE));
  for(const[ox,oz]of[[2,2],[-2,2],[2,-2],[-2,-2]])add(x+ox,yf+2,z+oz,PAL(STONE));
  add(x,yf+3,z,PAL([C(150,140,120)]));
  add(x,yf+4,z,PAL([C(176,166,146)]));

/* static meshes */
function buildInstanced(xa,ya,za,ra,ga,ba,material,shadow=true){
  const n=xa.length;
  const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),material,n);
  const d=new THREE.Object3D(),c=new THREE.Color();
  for(let i=0;i<n;i++){d.position.set(xa[i],ya[i],za[i]);d.rotation.set(0,0,0);d.scale.set(1,1,1);d.updateMatrix();mesh.setMatrixAt(i,d.matrix);
    c.setRGB(ra[i],ga[i],ba[i]);mesh.setColorAt(i,c)}
  mesh.castShadow=shadow;mesh.receiveShadow=shadow;
  mesh.instanceMatrix.needsUpdate=true;
  if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  return mesh;
}
const staticMesh=buildInstanced(V.x,V.y,V.z,V.r,V.g,V.b,new THREE.MeshStandardMaterial({roughness:0.92,metalness:0.0}));

function petalSpawn(p,seeded){
  const t=pick(canopyTrees);
  p.x=t.x+R(-t.r,t.r);p.z=t.z+R(-t.r,t.r);
  p.y=seeded?R(2,22):t.y+R(-1,2.5);
  p.vy=R(0.5,1.2);p.ph=rnd()*6.283;p.sw=R(0.5,1.6);p.drift=R(-0.4,0.9);
  tcol.setRGB(...pick(t.pal));p.c=tcol.clone();
}

document.getElementById('stats').innerHTML=
  `static&nbsp;voxels <b>${totalStatic.toLocaleString()}</b> &nbsp;·&nbsp; animated&nbsp;voxels <b>${totalDyn.toLocaleString()}</b><br>`+
  `5-storied pagoda &middot; ${canopyTrees.length} flowering trees &middot; ${LANTERNS.length} lit tōrō &middot; ${NK} koi &middot; 5 cranes &middot; ${NP} drifting petals`;

/* ================= animation ================= */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta()),t=clock.elapsedTime;
  controls.update();
  starsMat.uniforms.uT.value=t;

  /* water */
  for(let i=0;i<waterCells.length;i++){
    const[x,z,yb]=waterCells[i];
    const w=Math.sin(t*1.5+x*0.52+z*0.41)*0.13+Math.sin(t*0.9+(x-z)*0.33)*0.09;
    dummy.position.set(x,yb+w,z);dummy.rotation.set(0,0,0);dummy.scale.set(1,1,1);dummy.updateMatrix();
    water.setMatrixAt(i,dummy.matrix);
  }
  water.instanceMatrix.needsUpdate=true;
  if(Math.floor(t*10)%2===0){
    for(let i=0;i<waterCells.length;i++){
      const[x,z,yb]=waterCells[i],q=pondQ(x,z);
      const base=yb===12?[0.20,0.52,0.60]:q<0.45?[0.06,0.28,0.36]:q<0.75?[0.10,0.42,0.48]:[0.18,0.55,0.60];
      const sh=0.5+0.5*Math.sin(t*2.4+x*1.3+z*0.8);
      tcol.setRGB(base[0]+sh*0.14,base[1]+sh*0.16,base[2]+sh*0.14);
      water.setColorAt(i,tcol);
    }
    water.instanceColor.needsUpdate=true;
  }

  /* waterfall */
  for(let i=0;i<NWF;i++){
    const span=9.6;
    const yy=10.4-((t*wfs[i]+wfp[i]*span)%span);
    const splash=yy<2.6;
    dummy.position.set(
      wfx[i]+(splash?Math.sin(t*13+i)*0.9:0),
      Math.max(1.7,yy)+(splash?Math.abs(Math.sin(t*9+i))*0.6:0),
      wfz[i]+(splash?Math.cos(t*11+i)*0.9:0));
    dummy.scale.setScalar(splash?0.62:1);dummy.rotation.set(0,0,0);dummy.updateMatrix();
    wf.setMatrixAt(i,dummy.matrix);
  }
  wf.instanceMatrix.needsUpdate=true;

  /* koi — pond center (10,-4), axes 8.4 x 6.0 */
  for(let k=0;k<NK;k++){
    const f=kois[k];f.a+=dt*f.sp;
    for(let i=0;i<KSEG;i++){
      const a=f.a-i*0.2*f.wf;
      const rr=0.55+f.r*0.45+Math.sin(t*0.3+f.ph)*0.12;
      const x=10+Math.cos(a)*8.4*rr,z=-4+Math.sin(a)*6.0*rr;
      const wob=Math.sin(t*7-i*0.9+f.ph)*0.08;
      dummy.position.set(x,1.05+wob,z);
      dummy.rotation.set(0,-a+Math.PI/2,Math.sin(t*6-i+f.ph)*0.14);
      dummy.scale.set(1-i*0.06,1-i*0.07,0.8);dummy.updateMatrix();
      koi.setMatrixAt(k*KSEG+i,dummy.matrix);
    }
  }
  koi.instanceMatrix.needsUpdate=true;

  /* petals */
  for(let i=0;i<NP;i++){
    const p=petals[i];
    p.y-=dt*p.vy;
    p.x+=Math.sin(t*p.sw+p.ph)*dt*1.6+dt*p.drift;
    p.z+=Math.cos(t*p.sw*0.83+p.ph)*dt*1.3+dt*0.35;
    if(p.y<0.8||Math.abs(p.x)>44||Math.abs(p.z)>44)petalSpawn(p,false);
    dummy.position.set(p.x,p.y,p.z);
    dummy.rotation.set(t*1.3+p.ph,t*0.9+p.ph*2,t*0.7+p.ph);
    dummy.scale.set(1,1,1);dummy.updateMatrix();
    petal.setMatrixAt(i,dummy.matrix);
  }
  petal.instanceMatrix.needsUpdate=true;

  /* fireflies */
  for(let i=0;i<NF;i++){
    const f=flies[i];
    dummy.position.set(f.x+Math.sin(t*0.5+f.ph)*2.2,f.y+Math.sin(t*f.sp+f.ph*3)*1.3,f.z+Math.cos(t*0.42+f.ph)*2.2);
    const bl=Math.max(0,Math.sin(t*3.2+f.ph*5))*Math.min(1,Math.sin(t*0.9+f.ph)+0.6);
    dummy.scale.setScalar(0.18+bl*1.2);dummy.rotation.set(0,0,0);dummy.updateMatrix();
    firefly.setMatrixAt(i,dummy.matrix);
  }
  firefly.instanceMatrix.needsUpdate=true;

  /* cranes */
  for(const c of cranes){
    c.a+=dt*c.sp;
    const x=-24+Math.cos(c.a)*c.r,z=-14+Math.sin(c.a)*c.r,y=c.y+Math.sin(t*0.7+c.ph)*2.2;
    c.g.position.set(x,y,z);
    c.g.rotation.y=-c.a-Math.PI/2;
    const flap=Math.sin(t*7+c.ph)*0.7;
    c.g.userData.wings[0].rotation.x=flap;
    c.g.userData.wings[1].rotation.x=-flap;
  }

  /* clouds */
  for(const cl of cloudGroups){
    cl.position.x+=dt*cl.userData.sp;
    if(cl.position.x>175)cl.position.x=-175;
    if(cl.position.x<-175)cl.position.x=175;
  }

  /* shishi-oshi cycle: fill, tip, knock, settle */
  {
    const cyc=(t*0.45)%1;
    let ang=0;
    if(cyc>=0.7&&cyc<0.78)ang=-((cyc-0.7)/0.08)*0.85;
    else if(cyc>=0.78&&cyc<0.86)ang=-0.85+((cyc-0.78)/0.08)*1.05;
    else if(cyc>=0.86)ang=0.2*Math.exp(-(cyc-0.86)*30)*Math.sin((cyc-0.86)*60);
    shishiArm.rotation.z=ang;
  }

  renderer.render(scene,camera);
}
animate();
