<script type="importmap">
{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================================================
   桜庭 — a floating-island Japanese garden at golden dusk:
   five-story pagoda, koi pond, red bridge, torii, cherry
   blossoms, maples, pines, bamboo, willows, stone lanterns,
   paper lanterns, fireflies and drifting petals.
   Everything is 1x1x1 voxels, one instanced draw call.
   ============================================================ */

/* ---------- deterministic RNG + value noise ---------- */
let _s = 0x9e3779b9;
function rng(){ _s |= 0; _s = _s + 0x6D2B79F5 | 0;
  let t = Math.imul(_s ^ _s >>> 15, 1 | _s);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function hash2(x,y){ const n = Math.sin(x*127.1 + y*311.7)*43758.5453; return n - Math.floor(n); }
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function fbm(x,y){ let s=0,a=.5,f=1; for(let i=0;i<4;i++){ s+=a*vnoise(x*f,y*f); f*=2; a*=.5; } return s; }
const pick = arr => arr[(rng()*arr.length)|0];

/* ---------- voxel stores ---------- */
const solid = new Map();   // opaque voxels   key -> hex
const glow  = new Map();   // emissive voxels key -> hex
const K = (x,y,z)=> x+','+y+','+z;
function setV(x,y,z,c){ x=Math.round(x); y=Math.round(y); z=Math.round(z);
  if(y<-14||y>120||x*x+z*z>64*64) return; solid.set(K(x,y,z), c); }
function setG(x,y,z,c){ glow.set(K(Math.round(x),Math.round(y),Math.round(z)), c); }
function jit(c,amt=.07){ const col=new THREE.Color(c); col.multiplyScalar(1+(rng()-.5)*2*amt); return col.getHex(); }
function fillBox(x0,x1,y0,y1,z0,z1,c,j){ for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++) setV(x,y,z, j?jit(c,j):c); }
function cyl(cx,cz,y0,y1,r,c,j){ for(let y=y0;y<=y1;y++)for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++)
  if(dx*dx+dz*dz<=r*r+.4) setV(cx+dx,y,cz+dz, j?jit(c,j):c); }
function ellipsoid(cx,cy,cz,rx,ry,rz,fn){
  for(let x=Math.floor(cx-rx);x<=cx+rx;x++)for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let z=Math.floor(cz-rz);z<=cz+rz;z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
    if(d<=1.05){ const c=fn(x,y,z,d); if(c!==null) setV(x,y,z,c); } } }
function line3(x0,y0,z0,x1,y1,z1,c){
  const a=new THREE.Vector3(x0,y0,z0), b=new THREE.Vector3(x1,y1,z1);
  const n=Math.ceil(a.distanceTo(b))+1, p=new THREE.Vector3();
  for(let i=0;i<=n;i++){ p.lerpVectors(a,b,i/n); setV(p.x,p.y,p.z, jit(c,.08)); } }

/* ---------- palettes ---------- */
const GRASS  = ['#5da24a','#66ad52','#55984a','#6db85c','#4e9244'];
const DIRT   = ['#6b4a32','#5d4029','#75543a'];
const ROCK   = ['#8b8d96','#7d7f88','#969aa2','#71737c'];
const MOSS   = ['#5c8f4a','#6aa055'];
const GRAVEL = ['#c8b79c','#bda88c','#d2c2a8','#c2ad90'];
const WOOD   = ['#7a4a2b','#6d4126','#875432'];
const WPINK  = ['#ffd7e6','#ffc2d8','#ffa6c6','#f8b0c8','#ffe4ef'];
const RED    = ['#c8402e','#b53626','#d34a35'];
const SLATE  = ['#4a5268','#414a5e','#545d74'];
const GOLD   = ['#e8b64a','#d9a53c','#f2c766'];
const WPLASTER='#f2e8d5';
const BAMBOO = ['#7fae4e','#8fbc5c','#6f9c42'];

/* ---------- terrain fields ---------- */
const IR = 58;                       // island radius
const WL = 1.35;                     // water level
function pondField(x,z){
  const a=((x+24)/14.2)**2+((z-14)/10.2)**2;          // main pond
  const b=((x+7)/7.6)**2+((z-25)/5.6)**2;             // NE inlet
  return Math.min(a,b);
}
const inPond=(x,z)=>pondField(x,z)<1;
const nearPond=(x,z)=>pondField(x,z)<1.55;

const PATH=[ [0,57],[0,44],[-2,36],[-4,30],[-4,25],[-6,31],[-12,34],[-22,35],[-31,31],[-37,24],
             [-40,14],[-38,5],[-31,-2],[-20,-4],[-8,-5],[4,-6],[11,-8],[16,-12],[16,-15] ];
function distPath(x,z){
  let best=1e9;
  for(let i=0;i<PATH.length-1;i++){
    const [ax,az]=PATH[i],[bx,bz]=PATH[i+1];
    const dx=bx-ax,dz=bz-az,L=dx*dx+dz*dz;
    let t=((x-ax)*dx+(z-az)*dz)/L; t=Math.max(0,Math.min(1,t));
    const px=ax+dx*t-x, pz=az+dz*t-z;
    best=Math.min(best,px*px+pz*pz);
  }
  return Math.sqrt(best);
}
const PLAT={cx:16,cz:-24,half:13,top:5};
const onPlat=(x,z)=>Math.abs(x-PLAT.cx)<=PLAT.half&&Math.abs(z-PLAT.cz)<=PLAT.half;

function terrainH(x,z){
  let h = 2 + 2.6*(fbm(x*.045+7.3, z*.045+3.1)-.5)*2;
  h += 1.6*Math.max(0, fbm(x*.02+40, z*.02+9)-.55)*2;          // hills
  if(x>26||z<-26) h += Math.min(6, (Math.max(0,x-26)+Math.max(0,-26-z))*.14); // rise behind pagoda
  if(nearPond(x,z)) h = Math.max(h, 2.4);
  if(distPath(x,z)<3.2) h = Math.round(h*.6 + (Math.round(h))*.4);
  return Math.max(1, Math.min(8, Math.round(h)));
}

/* ---------- terrain ---------- */
const waterCols=[];
for(let x=-IR;x<=IR;x++)for(let z=-IR;z<=IR;z++){
  const r2=x*x+z*z; if(r2>IR*IR) continue;
  const edge = IR - Math.sqrt(r2);
  const h=terrainH(x,z);
  const pond=inPond(x,z);
  if(pond){
    for(let y=-2;y<=0;y++) setV(x,y,z, y===0? jit('#8a7a5e',.1) : jit('#4c4438',.1)); // pond bed
    waterCols.push([x,z]);
  } else {
    const onPath = distPath(x,z)<1.9;
    const plat = onPlat(x,z);
    for(let y=h;y>=h-2;y--){
      let c;
      if(y===h){
        if(plat) c=jit('#9a9aa4',.08);
        else if(onPath) c=jit(pick(GRAVEL),.09);
        else {
          c=jit(pick(GRASS),.09);
          const f=vnoise(x*.9+50,z*.9+50);
          if(!onPath&&f>.86) c=jit(pick(['#e8e0f0','#f2e6b0','#f0b8cc','#e87f7f']),0);   // flowers
          else if(!onPath&&f<.06) c=jit('#4a7c3e',.08);                                   // dark tufts
        }
      } else c=jit(pick(DIRT),.09);
      setV(x,y,z,c);
    }
    if(!onPath&&!plat&&rng()<.05){ const t=h+1; if(t<WL+1&&!inPond(x,z)) setV(x,t,z,jit('#4f8a3f',.12)); } // grass blade
  }
  // island skirt / cliffs
  if(edge<6){
    const depth=Math.round((6-edge)*1.6)+2;
    for(let y=-1;y>=-depth;y--){
      if(pond&&y>-2) continue;
      const c = (x*3+z*7+y)%5===0 ? jit('#6e6a72',.1) : jit('#5a4a44',.1);
      setV(x,y,z,c);
    }
    if(edge<3&&rng()<.5) setV(x,-depth-1,z,jit('#4a3d3a',.1));
  }
}
/* hanging vines & roots under the island */
for(let i=0;i<70;i++){
  const a=rng()*Math.PI*2, r=IR*(.55+rng()*.42);
  const x=Math.round(Math.cos(a)*r), z=Math.round(Math.sin(a)*r);
  if(inPond(x,z)) continue;
  const len=2+((rng()*7)|0);
  for(let y=-2;y>-2-len;y--) if(rng()<.7) setV(x,y,z,jit(rng()<.3?'#4a6e3a':'#4a3d3a',.12));
}

/* ---------- pond rim stones ---------- */
for(let x=-IR;x<=IR;x++)for(let z=-IR;z<=IR;z++){
  if(inPond(x,z)) continue;
  const f=pondField(x,z);
  if(f<1.16 && rng()<.5){
    const h=terrainH(x,z);
    setV(x,h,z, rng()<.25? jit(pick(MOSS),.1): jit(pick(ROCK),.1));
  }
}

/* ============================================================
   PAGODA  五重塔
   ============================================================ */
function buildPagoda(cx,cz,baseY){
  const HW=[6,5,4,3,2], BH=5;
  let y=baseY;
  for(let i=0;i<5;i++){
    const hw=HW[i], o=hw>=5?3:2;
    /* body */
    for(let yy=y; yy<y+BH; yy++){
      const beam = (yy===y)||(yy===y+BH-1);
      for(let dx=-hw;dx<=hw;dx++)for(let dz=-hw;dz<=hw;dz++){
        const edge = Math.abs(dx)===hw||Math.abs(dz)===hw;
        if(!edge) continue;
        const corner = Math.abs(dx)===hw&&Math.abs(dz)===hw;
        let c;
        if(corner) c=jit('#7a2e22',.06);                       // corner pillars
        else if(beam) c=jit('#6b3a24',.06);                    // wood beams
        else{
          c=jit(WPLASTER,.05);
          const m = (dx+dz+hw*2)%3;
          const midH = yy>y&&yy<y+BH-1;
          if(midH && m===0 && Math.abs(dx)!==hw-0) c=jit('#2a2f45',.05);  // windows
          if(i===0 && dz===hw && Math.abs(dx)<=1 && yy<y+4) c=jit('#4a2a18',.05); // door
          if(i===0 && dz===hw && Math.abs(dx)<=1 && yy<y+4 && (dx+yy)%2===0) c=jit('#c8a24a',0); // door studs
        }
        setV(cx+dx,yy,cz+dz,c);
      }
    }
    /* door frame glow lanterns flanking entrance */
    if(i===0){ setG(cx-2,y+2,cz+hw+1,'#ffb45e'); setG(cx+2,y+2,cz+hw+1,'#ffb45e'); }
    /* bracket layer */
    const by=y+BH;
    for(let dx=-hw-o;dx<=hw+o;dx++)for(let dz=-hw-o;dz<=hw+o;dz++){
      if(Math.max(Math.abs(dx),Math.abs(dz))>=hw+o-1) setV(cx+dx,by,cz+dz, jit('#8c2f2f',.07));
    }
    /* roof, stepped pyramid with upturned gold tips */
    const ry=by+1;
    for(let t=0;t<4;t++){
      const e=hw+o-t, yy=ry+t;
      for(let dx=-e;dx<=e;dx++)for(let dz=-e;dz<=e;dz++){
        if(Math.max(Math.abs(dx),Math.abs(dz))!==e) continue;
        const corner=Math.abs(dx)===e&&Math.abs(dz)===e;
        if(corner&&t<2){ setV(cx+dx,yy+1,cz+dz, jit(GOLD[t%3],.06)); }        // lifted tip
        else setV(cx+dx,yy,cz+dz, jit(SLATE[t%3],.07));
      }
      if(t===0){ // corner tips reach one voxel further out
        setV(cx+e+1,ry+1,cz+e+1,jit('#f2c766',0)); setV(cx-e-1,ry+1,cz+e+1,jit('#f2c766',0));
        setV(cx+e+1,ry+1,cz-e-1,jit('#f2c766',0)); setV(cx-e-1,ry+1,cz-e-1,jit('#f2c766',0));
      }
    }
    fillBox(cx+hw-1,cx-hw+1,ry+4,cz+hw-1,cz-hw+1,0,0); // (no-op guard)
    for(let dx=-hw+1;dx<=hw-1;dx++)for(let dz=-hw+1;dz<=hw-1;dz++) setV(cx+dx,ry+4,cz+dz, jit('#2b3040',.06));
    /* gold railing on the roof walkway */
    for(let dx=-hw;dx<=hw;dx+=2)for(let dz=-hw;dz<=hw;dz+=2){
      if(Math.max(Math.abs(dx),Math.abs(dz))===hw) setV(cx+dx,ry+5,cz+dz, jit('#caa24a',.08));
    }
    /* hanging paper lanterns under first roof */
    if(i===0){
      for(const [lx,lz] of [[hw+o,hw+o],[-hw-o,hw+o],[hw+o,-hw-o],[-hw-o,-hw-o]]){
        const X=cx+lx, Z=cz+lz, Y=by-1;
        line3(X,Y,Z,X,Y-1,Z,'#3a3a44');
        for(let yy=Y-2; yy>=Y-4; yy--) for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)
          if(dx*dx+dz*dz<3) setG(X,yy,Z, yy===Y-3?'#ff7a4a':'#ff9a5e');
        setV(X,Y-5,Z,'#3a3a44');
      }
    }
    y = ry+5;
  }
  /* finial 相輪 */
  const fy=y;
  for(let t=0;t<9;t++) setV(cx,fy+t,cz, jit('#e8b64a',.05));
  for(const t of [2,4,6]){ setV(cx-1,fy+t,cz,'#d9a53c'); setV(cx+1,fy+t,cz,'#d9a53c');
    setV(cx,fy+t,cz-1,'#d9a53c'); setV(cx,fy+t,cz+1,'#d9a53c'); }
  setG(cx,fy+9,cz,'#ffe9a0');
}
/* stone platform + steps + parapet */
for(let x=PLAT.cx-PLAT.half;x<=PLAT.cx+PLAT.half;x++)for(let z=PLAT.cz-PLAT.half;z<=PLAT.cz+PLAT.half;z++){
  const h=terrainH(x,z);
  for(let y=h;y<=PLAT.top-1;y++) setV(x,y,z, jit('#7f7f8a',.08));
  setV(x,PLAT.top,z, jit((x+z)%2? '#9a9aa4':'#8e8e98',.06));
  const e=Math.max(Math.abs(x-PLAT.cx),Math.abs(z-PLAT.cz))>=PLAT.half-1;
  if(e && !(z>PLAT.cz+PLAT.half-2 && Math.abs(x-PLAT.cx)<=3)){
    if((x+z)%2===0) setV(x,PLAT.top+1,z, jit('#b8b0a0',.06));   // parapet posts
  }
}
for(const [dz,yy] of [[1,4],[2,3],[3,2]]) for(let x=PLAT.cx-3;x<=PLAT.cx+3;x++)
  for(let zz=PLAT.cz+PLAT.half+dz; zz<=PLAT.cz+PLAT.half+dz; zz++) setV(x,yy,zz, jit('#8e8e98',.07));
buildPagoda(PLAT.cx,PLAT.cz,PLAT.top+1);

/* ============================================================
   TREES
   ============================================================ */
const canopyTops=[];   // petal spawn points
function trunk(x,y,z,h,lean,cbark){
  let px=x,py=y,pz=z;
  for(let i=0;i<h;i++){
    const r = i<h*.3?1:0;
    for(let dx=-r;dx<=r;dx++)for(let dz=-r;dz<=r;dz++)
      if(dx*dx+dz*dz<=r+.3) setV(px+dx,py+i,pz+dz, jit(cbark,.09));
    px+=lean[0]; pz+=lean[1];
    if(i===h-1) break;
    if(rng()<.35){ px+=rng()<.5?1:0; }
  }
  return [px,py+h-1,pz];
}
function cherryTree(x,z,scale=1,white=false){
  const h=terrainH(x,z);
  const pal = white? ['#f4ecf2','#ffffff','#f8dce8','#efe4ee'] : WPINK;
  const [tx,ty,tz]=trunk(x,h+1,z, (7*scale)|0, [rng()<.5?.2:-.2, rng()<.5?.2:-.2], '#5a3a28');
  const tips=[[tx,ty,tz]];
  const nb=4+((rng()*3)|0);
  for(let b=0;b<nb;b++){
    const a=rng()*Math.PI*2, len=(3+rng()*3)*scale;
    let bx=tx,by=ty,bz=tz;
    const ex=tx+Math.cos(a)*len, ey=ty+2+rng()*2, ez=tz+Math.sin(a)*len;
    line3(bx,by,bz,ex,ey,ez,'#5a3a28');
    tips.push([ex,ey,ez]);
    if(rng()<.6){ const a2=a+1.5; line3(ex,ey,ez, ex+Math.cos(a2)*2, ey+1, ez+Math.sin(a2)*2,'#5a3a28');
      tips.push([ex+Math.cos(a2)*2,ey+1,ez+Math.sin(a2)*2]); }
  }
  for(const [bx,by,bz] of tips){
    const r=(2.6+rng()*1.8)*scale;
    ellipsoid(bx,by+1.5,bz,r,r*.72,r,(px,py,pz,d)=>{
      const n=vnoise(px*.55+bx,py*.55+bz*1.3+pz*.55);
      if(d>.55 && n<.42) return null;                       // airy edges
      if(n>.75) return pick(pal);
      if(n>.55) return pick(pal);
      return pick(white?['#f0e2ec','#e8d0e0']:['#f0a8c0','#e890ae']);
    });
  }
  canopyTops.push({x:tx,y:ty+5,z:tz,r:5.5*scale});
}
function pineTree(x,z,scale=1){
  const h=terrainH(x,z);
  const [tx,ty,tz]=trunk(x,h+1,z,(6*scale)|0,[0,0],'#4e3623');
  const layers=3+((rng()*2)|0);
  for(let i=0;i<layers;i++){
    const yy=ty+1+i*2, r=(4.5-i*.9)*scale;
    ellipsoid(tx,yy,tz,r,1.1,r,(px,py,pz,d)=>{
      if(d>.8&&vnoise(px*.7,pz*.7)<.4) return null;
      return jit(pick(['#2e5d34','#356a3c','#27512e','#3d7546']),.08);
    });
  }
  ellipsoid(tx,ty+1+layers*2,tz,1.6*scale,1,1.6*scale,()=>jit('#356a3c',.08));
}
function mapleTree(x,z){
  const h=terrainH(x,z);
  const [tx,ty,tz]=trunk(x,h+1,z,6,[rng()<.5?.2:-.2,.2],'#54382a');
  for(let b=0;b<3;b++){
    const a=rng()*Math.PI*2;
    line3(tx,ty,tz, tx+Math.cos(a)*3, ty+2, tz+Math.sin(a)*3,'#54382a');
    ellipsoid(tx+Math.cos(a)*3,ty+3.5,tz+Math.sin(a)*3, 2.8,2,2.8,(px,py,pz,d)=>{
      if(d>.7&&vnoise(px*.6,pz*.6)<.35) return null;
      const n=vnoise(px*.4+py*.3,pz*.4);
      return jit(n>.66?'#e8683a': n>.4?'#d94f2e': n>.2?'#f0904a':'#b83a26',.1);
    });
  }
}
function willowTree(x,z){
  const h=terrainH(x,z);
  const [tx,ty,tz]=trunk(x,h+1,z,7,[0,0],'#5a4630');
  ellipsoid(tx,ty+2,tz,3.4,1.6,3.4,(px,py,pz,d)=>{
    if(d>.8) return null; return jit(pick(['#7fae4e','#8fbc5c','#6f9c42']),.08);
  });
  for(let i=0;i<26;i++){

function bambooGrove(cx,cz,n){
  for(let i=0;i<n;i++){
    const x=Math.round(cx+(rng()-.5)*12), z=Math.round(cz+(rng()-.5)*12);
    if(inPond(x,z)||onPlat(x,z)) continue;
    const h=terrainH(x,z), H=11+((rng()*8)|0);
    for(let y=0;y<H;y++){
      const node=y%3===0;
      setV(x,h+1+y,z, node? jit('#5d8a3a',.08): jit(pick(BAMBOO),.07));
    }
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++)for(let dy=0;dy<3;dy++)
      if(rng()<.5) setV(x+dx,h+H+dy,z+dz, jit('#93c25e',.1));
  }
}
function rockCluster(cx,cz,n,s=1){
  for(let i=0;i<n;i++){
    const x=Math.round(cx+(rng()-.5)*4*s), z=Math.round(cz+(rng()-.5)*4*s);
    if(inPond(x,z)&&s>1) continue;
    const h=inPond(x,z)?0:terrainH(x,z);
    const r=1+((rng()*2)|0)*s;
    ellipsoid(x,h+r*.6,z,r,r*.8,r,(px,py,pz,d)=>{
      if(d>.75&&rng()<.5) return null;
      return py>h+r*.9&&rng()<.3? jit(pick(MOSS),.1): jit(pick(ROCK),.1);

function stoneLantern(x,z,scale=1,glowC='#ffcf8a'){

function torii(x,z){

function bridge(cx,cz,len,axis){
  /* red arched bridge along +axis */
  for(let t=0;t<=len;t++){
    const f=t/len, arch=Math.round(Math.sin(f*Math.PI)*2.4);
    const y=2+arch;
    for(let w=-1;w<=1;w++){
      const x = axis==='z'? cx+w : cx+t-len/2;
      const z = axis==='z'? cz+t-len/2 : cz+w;
      setV(x,y,z, jit('#b53626',.06));
      setV(x,y-1,z, jit('#7a2e22',.06));
      if(Math.abs(w)===1){
        setV(x,y+1,z, jit('#c8402e',.06));
        if(t%2===0) setV(x,y+2,z, jit('#c8402e',.06));
      }
    }
    if(t%4===0){ const x2=axis==='z'?cx:cx+t-len/2, z2=axis==='z'?cz+t-len/2:cz;
      setV(x2,y+2,z2,'#e8d8c0'); }                                        // rail caps
  }
  const mx = axis==='z'?cx:cx, mz = cz;
  for(const s of [-len/2+1,len/2-1]){
    const x2=axis==='z'?cx:cx+s, z2=axis==='z'?cz+s:cz;
    for(let y=-1;y<=2;y++){ setV(x2,y,z2,jit('#6e6e78',.08)); setV(x2+1,y,z2,jit('#6e6e78',.08)); }
  }
  /* lanterns at bridge head */
  const hx = axis==='z'?cx+2:cx-len/2-1, hz = axis==='z'?cz-len/2-1:cz;
  stoneLantern(Math.round(hx),Math.round(hz));
}

const clock=new THREE.Clock();
const camFrom=new THREE.Vector3(105,62,118), camTo=new THREE.Vector3(74,40,86);
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;

  /* cinematic glide-in until user grabs the camera */
  if(!introDone){
    const k=Math.min(1,(t)/6), e=1-Math.pow(1-k,3);
    camera.position.lerpVectors(camFrom,camTo,e);
  }

  /* water shimmer */
  for(let i=0;i<waterCols.length;i++){
    const [x,z]=waterCols[i];
    dummy.position.set(x, WL+Math.sin(t*1.8+x*.55+z*.75)*.09+Math.sin(t*2.7+x*1.3)*.04, z);
    dummy.rotation.set(0,0,0); dummy.scale.set(1,1,1); dummy.updateMatrix();
    water.setMatrixAt(i,dummy.matrix);
  }
  water.instanceMatrix.needsUpdate=true;

  /* koi */
  for(const k of kois){
    const a=t*k.sp+k.ph;
    const x=k.cx+Math.cos(a)*k.rx, z=k.cz+Math.sin(a)*k.rz;
    const hx=k.cx+Math.cos(a+.1)*k.rx, hz=k.cz+Math.sin(a+.1)*k.rz;
    k.g.position.set(x,k.y+Math.sin(t*2+k.ph)*.05,z);
    k.g.rotation.y=Math.atan2(hx-x,hz-z);
    k.tail.rotation.y=Math.sin(t*6+k.ph)*.5;
    k.body.rotation.y=Math.sin(t*6+k.ph+1)*.15;
  }
  /* ducks */
  for(const d of ducks){
    const a=t*.12+d.ph;
    d.g.position.set(d.cx+Math.cos(a)*d.r, WL+.42+Math.sin(t*2.2+d.ph)*.07, d.cz+Math.sin(a)*d.r);
    d.g.rotation.y=Math.atan2(-Math.sin(a),Math.cos(a))+Math.PI/2;
  }
  /* petals */
  for(const p of petals){
    p.y-=dt*p.sp;
    p.x+=Math.sin(t*1.3+p.ph)*dt*p.sw;
    p.z+=Math.cos(t*.9+p.ph*1.7)*dt*p.sw*.7;
    if(p.y<.4) spawnPetal(p,false);
    dummy.position.set(p.x,p.y,p.z);
    dummy.rotation.set(t*1.5+p.ph, p.ph+t*.8, Math.sin(t+p.ph)*.8);
    dummy.scale.set(1,1,1); dummy.updateMatrix();
    petalMesh.setMatrixAt(p.id,dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;
  /* fireflies */
  for(let i=0;i<FN;i++){
    const f=ffs[i];
    const blink=Math.max(0,Math.sin(t*f.f1*2+f.ph));
    const s=.15+blink*1.1;
    dummy.position.set(f.x+Math.sin(t*f.f1+f.ph)*3, f.y+Math.sin(t*f.f2+f.ph*2)*2, f.z+Math.cos(t*f.f2*1.3+f.ph)*3);
    dummy.scale.setScalar(s); dummy.rotation.set(0,0,0); dummy.updateMatrix();
    ffMesh.setMatrixAt(i,dummy.matrix);
  }
  ffMesh.instanceMatrix.needsUpdate=true;

  /* lantern flicker via bloom pulse */
  bloom.strength=.42+Math.sin(t*7)*.012+Math.sin(t*13.7)*.008;

  controls.update();
  composer.render();
}

/* hide loader after first frame */
requestAnimationFrame(()=>{ tick();
  const l=document.getElementById('loader');
  l.style.opacity=0; setTimeout(()=>l.remove(),950);
});
</script>
