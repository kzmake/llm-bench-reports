<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五重塔 庭園 — Voxel Garden</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Songti SC",Georgia,serif;color:#f4eee2}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.drag{cursor:grabbing}
  #ui{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .9s ease .3s}
  body.ready #ui{opacity:1}
  body.hideui #ui>div{opacity:0!important;transform:translateY(6px)}
  .card{position:absolute;pointer-events:auto;background:rgba(12,14,20,.5);
    border:1px solid rgba(244,238,226,.16);border-radius:3px;
    -webkit-backdrop-filter:blur(9px) saturate(1.2);backdrop-filter:blur(9px) saturate(1.2);
    box-shadow:0 10px 40px -12px rgba(0,0,0,.7);transition:opacity .5s,transform .5s}
  #title{top:22px;left:24px;padding:15px 20px 14px}
  #title h1{font-size:25px;font-weight:600;letter-spacing:.16em;line-height:1.05}
  #title .jp{font-size:11px;letter-spacing:.42em;color:#e8b93c;margin-top:7px}
  #title .en{font-size:9.5px;letter-spacing:.2em;color:rgba(244,238,226,.5);margin-top:6px;
    text-transform:uppercase;font-family:ui-sans-serif,system-ui,sans-serif}
  #panel{left:24px;bottom:22px;padding:14px 16px;width:262px;
    font-family:ui-sans-serif,system-ui,sans-serif}
  .row{display:flex;align-items:center;gap:8px;margin:9px 0}
  .lab{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:rgba(244,238,226,.62);
    width:66px;flex:none;font-weight:600}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:2px;border-radius:2px;
    background:rgba(244,238,226,.28);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#e8b93c;cursor:pointer;box-shadow:0 0 0 3px rgba(232,185,60,.18)}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#e8b93c;cursor:pointer}
  .val{font-size:10px;width:44px;text-align:right;color:#e8b93c;font-variant-numeric:tabular-nums;flex:none}
  .btns{display:flex;flex-wrap:wrap;gap:5px}
  button{font:inherit;font-family:ui-sans-serif,system-ui,sans-serif;font-size:10px;letter-spacing:.06em;
    color:#f4eee2;background:rgba(244,238,226,.07);border:1px solid rgba(244,238,226,.2);
    border-radius:2px;padding:5px 8px;cursor:pointer;transition:.18s}
  button:hover{background:rgba(232,185,60,.2);border-color:rgba(232,185,60,.55)}
  button.on{background:rgba(232,185,60,.3);border-color:#e8b93c;color:#fff8e6}
  #stats{position:absolute;right:22px;bottom:20px;text-align:right;font-size:10px;
    letter-spacing:.1em;color:rgba(244,238,226,.5);font-family:ui-monospace,monospace;line-height:1.7}
  #stats b{color:#e8b93c;font-weight:600}
  #hint{position:absolute;right:22px;top:24px;text-align:right;font-size:9.5px;line-height:1.9;
    letter-spacing:.1em;color:rgba(244,238,226,.42);font-family:ui-sans-serif,system-ui,sans-serif}
  #loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:#05070c;z-index:9;transition:opacity .7s}
  #loader.gone{opacity:0;pointer-events:none}
  #loader .ring{width:44px;height:44px;border:1px solid rgba(232,185,60,.25);border-top-color:#e8b93c;
    border-radius:50%;animation:spin 1.1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .t{font-size:12px;letter-spacing:.4em;color:rgba(244,238,226,.7)}
  #loader .s{font-size:9px;letter-spacing:.2em;color:rgba(244,238,226,.35);font-family:ui-monospace,monospace}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="loader"><div class="ring"></div><div class="t">五重塔 庭園</div><div class="s" id="ls">building voxels…</div></div>

<div id="ui">
  <div class="card" id="title">
    <h1>Voxel Garden</h1>
    <div class="jp">五重塔・桜庭園</div>
    <div class="en">Pagoda · Sakura · Koi Pond</div>
  </div>

  <div class="card" id="panel">
    <div class="row"><span class="lab">Time</span><input id="time" type="range" min="0" max="1000" value="665"><span class="val" id="timev">15:58</span></div>
    <div class="row"><span class="lab">Orbit</span><input id="dist" type="range" min="34" max="190" value="80"><span class="val" id="distv">80</span></div>
    <div class="row"><span class="lab">Height</span><input id="elev" type="range" min="2" max="80" value="14"><span class="val" id="elevv">14</span></div>
    <div class="row"><span class="lab">Petals</span><input id="petals" type="range" min="0" max="2600" value="1500"><span class="val" id="petalsv">1500</span></div>
    <div class="row btns" id="views"></div>
    <div class="row btns" id="toggles"></div>
  </div>

  <div id="hint">drag&nbsp;·&nbsp;orbit&nbsp;&nbsp;&nbsp;wheel&nbsp;·&nbsp;zoom&nbsp;&nbsp;&nbsp;shift+drag&nbsp;·&nbsp;pan<br>1–8&nbsp;·&nbsp;views&nbsp;&nbsp;&nbsp;T&nbsp;·&nbsp;time&nbsp;&nbsp;&nbsp;space&nbsp;·&nbsp;spin&nbsp;&nbsp;&nbsp;S&nbsp;·&nbsp;png&nbsp;&nbsp;&nbsp;H&nbsp;·&nbsp;hide</div>
  <div id="stats"></div>
</div>

<script>
'use strict';
/* ============================================================================
   五重塔 庭園 / PAGODA GARDEN — self-contained WebGL2 voxel renderer
   No external libraries. Everything below is one file.
   ========================================================================== */

/* ---------------------------------------------------------------- math ---- */
const M4 = () => new Float32Array(16);
function m4persp(o, fovy, asp, near, far){
  const f = 1/Math.tan(fovy/2), nf = 1/(near-far);
  o[0]=f/asp;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=f;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=(far+near)*nf;o[11]=-1; o[12]=0;o[13]=0;o[14]=2*far*near*nf;o[15]=0; return o;
}
function m4ortho(o,l,r,b,t,n,f){
  const lr=1/(l-r), bt=1/(b-t), nf=1/(n-f);
  o[0]=-2*lr;o[1]=0;o[2]=0;o[3]=0; o[4]=0;o[5]=-2*bt;o[6]=0;o[7]=0;
  o[8]=0;o[9]=0;o[10]=2*nf;o[11]=0; o[12]=(l+r)*lr;o[13]=(t+b)*bt;o[14]=(f+n)*nf;o[15]=1; return o;
}
function m4look(o,ex,ey,ez,cx,cy,cz,ux,uy,uz){
  let zx=ex-cx, zy=ey-cy, zz=ez-cz;
  let l=Math.hypot(zx,zy,zz)||1; zx/=l; zy/=l; zz/=l;
  let xx=uy*zz-uz*zy, xy=uz*zx-ux*zz, xz=ux*zy-uy*zx;
  l=Math.hypot(xx,xy,xz)||1; xx/=l; xy/=l; xz/=l;
  const yx=zy*xz-zz*xy, yy=zz*xx-zx*xz, yz=zx*xy-zy*xx;
  o[0]=xx;o[1]=yx;o[2]=zx;o[3]=0;
  o[4]=xy;o[5]=yy;o[6]=zy;o[7]=0;
  o[8]=xz;o[9]=yz;o[10]=zz;o[11]=0;
  o[12]=-(xx*ex+xy*ey+xz*ez); o[13]=-(yx*ex+yy*ey+yz*ez); o[14]=-(zx*ex+zy*ey+zz*ez); o[15]=1; return o;
}
function m4mul(o,a,b){            /* o = a·b, column-major */
  for(let j=0;j<4;j++){
    const b0=b[j*4],b1=b[j*4+1],b2=b[j*4+2],b3=b[j*4+3];
    for(let i=0;i<4;i++)
      o[j*4+i]=b0*a[i]+b1*a[4+i]+b2*a[8+i]+b3*a[12+i];
  } return o;
}

/* --------------------------------------------------------------- noise ---- */
function mulberry(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)|0;
  let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t;
  return ((t^(t>>>14))>>>0)/4294967296; }; }
function hash2(x,y,s){ let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,974634211);
  h=(h^(h>>>13))|0; h=Math.imul(h,1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s), b=hash2(xi+1,yi,s), c=hash2(xi,yi+1,s), d=hash2(xi+1,yi+1,s);
  return (a*(1-u)+b*u)*(1-v)+(c*(1-u)+d*u)*v;
}
function fbm(x,y,s,oct=4){ let t=0,a=.5,f=1; for(let i=0;i<oct;i++){ t+=a*vnoise(x*f,y*f,s+i*131); f*=2; a*=.5; } return t; }

/* ------------------------------------------------------------- palette ---- */
/* material codes (must match GLSL) */
const M={MATTE:0, EMIT:1, LEAF:2, WATER:3, METAL:4, PAPER:5, FLOW:6, GLOW:7, BARK:8};
const hex = h => [((h>>16)&255)/255, ((h>>8)&255)/255, (h&255)/255];
const C = {
  // stone
  stone:0x8b8d93, stoneD:0x74777d, stoneL:0xa2a5ab, stoneBlue:0x7d8794, granite:0x9c9a92,
  mossStone:0x87927a, slate:0x5c646d,
  // wood
  woodD:0x5b3d29, wood:0x7a5236, woodL:0xa9764a, plank:0xb98a5c, timber:0x4a3524,
  vermilion:0xc4402c, vermD:0x9c2f20, lacquer:0x7d1f18,
  // roof / metal
  tile:0x2f3d5c, tileD:0x232e47, tileL:0x3d4d70, gold:0xe0ae3a, goldD:0xb98a24, goldL:0xf6dc8a,
  copper:0x4f8f7a, bronze:0x8a6b3f,
  // plaster / paper
  plaster:0xece2cf, plasterW:0xf6efe1, shoji:0xf3ead6, washi:0xf7e9c8,
  // ground
  grass:0x4f8a3d, grassD:0x3f7331, grassL:0x63a24a, dry:0x8a9a4e, moss:0x40702f,
  dirt:0x7a5c41, sand:0xd8c9a0, sandL:0xe6dbb9, gravel:0xbdb6a4, gravelD:0xa39c8b,
  // water
  water:0x2f7fa8, waterD:0x1a5279, waterS:0x63b8cf, foam:0xdff2f7,
  // flora
  sakura:0xf6b9cf, sakuraL:0xfce0ea, sakuraD:0xe88fb2, sakuraC:0xdd7ba4,
  maple:0xd4502a, mapleO:0xe8823a, mapleR:0xb5301c, mapleY:0xe3a838,
  pine:0x2f5d40, pineD:0x24492f, pineL:0x3d7350,
  bamboo:0x74a347, bambooL:0x8fbb5c, bambooD:0x5a8636,
  wisteria:0xa184d4, wisteriaD:0x8a68bd, wisteriaL:0xc3aee8,
  azalea:0xdd4f78, azaleaL:0xef7fa0, plum:0xfaf0f2, lotus:0xf3c3d2, lotusL:0xfbe9f0,
  leafL:0x6fae4a, leafD:0x356b2c, fern:0x4e8f45,
  // flowers
  flW:0xf7f4e8, flY:0xf3c93f, flO:0xef8a34, flR:0xe0443c, flP:0x9c6ccb, flB:0x5b8fd6,
  // props
  lanternRed:0xd8422f, lanternW:0xf1e6cf, glow:0xffd7a0, glowW:0xfff0c8,
  terracotta:0xbe6a45, straw:0xd8bd7a, cloth:0x3f5f8a, clothR:0xb8443c,
  iron:0x33373d, paper:0xf8f1de,
  // fauna
  koiW:0xf6f1e6, koiR:0xe8503a, koiO:0xf2a93c, koiB:0x2b2f36, craneW:0xf4f2ea, craneB:0x24262b,
  craneR:0xd83a2c, heron:0xa9b6c0,
  petalG:0xe9f0c8, shroom:0xc9483b, shroomS:0xf3e6cf,
};

/* ------------------------------------------------------- voxel storage ---- */
const GX0=-70, GY0=-12, GZ0=-70, GX=144, GY=132, GZ=144;
const occ = new Uint8Array(GX*GY*GZ);
const occIdx=(x,y,z)=> x + GX*(y + GY*z);
function markSolid(x0,y0,z0,x1,y1,z1){
  const ax=Math.max(0,Math.floor(x0)-GX0), bx=Math.min(GX-1,Math.ceil(x1)-GX0);
  const ay=Math.max(0,Math.floor(y0)-GY0), by=Math.min(GY-1,Math.ceil(y1)-GY0);
  const az=Math.max(0,Math.floor(z0)-GZ0), bz=Math.min(GZ-1,Math.ceil(z1)-GZ0);
  if(bx-ax>96||by-ay>96||bz-az>96) return;
  for(let z=az;z<=bz;z++)for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++) occ[occIdx(x,y,z)]=1;
}
function solidAt(x,y,z){
  const gx=Math.floor(x)-GX0, gy=Math.floor(y)-GY0, gz=Math.floor(z)-GZ0;
  if(gx<0||gy<0||gz<0||gx>=GX||gy>=GY||gz>=GZ) return 0;
  return occ[occIdx(gx,gy,gz)];
}
function buried(x0,y0,z0,x1,y1,z1){
  const ax=Math.floor(x0), bx=Math.ceil(x1)-1, ay=Math.floor(y0), by=Math.ceil(y1)-1,
        az=Math.floor(z0), bz=Math.ceil(z1)-1;
  for(let x=ax;x<=bx;x++)for(let z=az;z<=bz;z++)
    if(!solidAt(x+.5,y1+.5,z+.5)||!solidAt(x+.5,y0-.5,z+.5)) return false;
  for(let y=ay;y<=by;y++)for(let z=az;z<=bz;z++)
    if(!solidAt(x1+.5,y+.5,z+.5)||!solidAt(x0-.5,y+.5,z+.5)) return false;
  for(let x=ax;x<=bx;x++)for(let y=ay;y<=by;y++)
    if(!solidAt(x+.5,y+.5,z1+.5)||!solidAt(x+.5,y+.5,z0-.5)) return false;
  return true;
}

const opaque=[], water=[], glowPts=[];
let jitterAmt=0, rng=mulberry(1337), solidMark=true;
function jit(c){ if(!jitterAmt) return c; const j=(rng()-0.5)*2*jitterAmt;
  return [Math.min(1,Math.max(0,c[0]*(1+j))), Math.min(1,Math.max(0,c[1]*(1+j*0.9))), Math.min(1,Math.max(0,c[2]*(1+j*1.1)))]; }
function push(arr,x,y,z,sx,sy,sz,col,mat,rx,ry){
  arr.push(x+sx/2, y+sy/2, z+sz/2, rx||0, sx, sy, sz, ry||0, col[0],col[1],col[2], mat);
}
/* box with min-corner (x,y,z) and size (w,h,d) */
function box(x,y,z,w,h,d,color,mat=M.MATTE,opt){
  const c = jit(typeof color==='number'? hex(color): color);
  if(solidMark && w<=2.2&&h<=2.2&&d<=2.2 && buried(x,y,z,x+w,y+h,z+d)) return;
  if(solidMark && !(w*h*d>4096)) markSolid(x,y,z,x+w,y+h,z+d);
  push(opaque, x,y,z,w,h,d, c, mat, opt&&opt.rx, opt&&opt.ry);
}
function boxN(x,y,z,w,h,d,color,mat=M.MATTE,opt){ // no-cull / no-mark decorative
  const c = jit(typeof color==='number'? hex(color): color);
  push(opaque, x,y,z,w,h,d, c, mat, opt&&opt.rx, opt&&opt.ry);
}
function vox(x,y,z,color,mat,opt){ box(x,y,z,1,1,1,color,mat,opt); }
function line(x0,z0,x1,z1,fn){ const n=Math.ceil(Math.hypot(x1-x0,z1-z0)); for(let i=0;i<=n;i++){ const t=i/n; fn(Math.round(x0+(x1-x0)*t), Math.round(z0+(z1-z0)*t), t);} }
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

/* ------------------------------------------------------- terrain field ---- */
const WX0=-66, WX1=66, WZ0=-66, WZ1=66, WW=WX1-WX0+1, WD=WZ1-WZ0+1;
const GARDEN=52;
const hF=new Float32Array(WW*WD), sF=new Uint8Array(WW*WD), wet=new Float32Array(WW*WD);
const gi=(x,z)=> (x-WX0) + WW*(z-WZ0);
const inB=(x,z)=> x>=WX0&&x<=WX1&&z>=WZ0&&z<=WZ1;
const SURF={WATER:0,GRASS:1,MOSS:2,DIRT:3,SAND:4,GRAVEL:5,STONE:6,SANDL:7,BAMBOO:8,ZEN:9,GRAVELD:10,PLANK:11};
const WATER_Y=0.55;

/* feature anchors (shared by terrain + props) */
const PG={x:-3,z:-19};                 // pagoda terrace centre
const POND={x:25,z:7,rx:16,rz:12};     // koi pond
const ZEN={x:33,z:31,w:22,d:15};       // dry landscape
const GROVE={x0:-52,x1:-33,z0:-42,z1:-25}; // bamboo

function pondD(x,z){
  const dx=(x-POND.x)/(POND.rx+3), dz=(z-POND.z)/(POND.rz+3);
  let d=Math.hypot(dx,dz);
  d += (fbm(x*.11,z*.11,77,3)-.5)*.16;
  return d;
}
function streamD(x,z){ // meandering channel from waterfall down to pond + south
  const t=(z+22)/56;
  const cxp = 33 - 12*clamp(t,0,1.35) + Math.sin(t*5.1)*3.2;
  return Math.abs(x-cxp) - 1.9;
}
function heightRaw(x,z){
  let h = 3.1 + (fbm(x*.045,z*.045,11,4)-.5)*5.4;
  h += (fbm(x*.014+40,z*.014-20,5,3)-.5)*3.2;
  // north ridge rises
  h += clamp((-(z)-26)/26,0,1)*3.4;
  // pagoda plateau
  const dp=Math.hypot(x-PG.x,(z-PG.z)*1.05);
  h = lerp(h, 4.4, clamp(1-(dp-13)/12,0,1));
  // pond basin
  const pd=pondD(x,z);
  if(pd<1.25) h = Math.min(h, -3.5 + 7.4*Math.pow(pd,2.2));
  // escarpment north of the pond: the waterfall's cliff
  const cl=(-11-z);
  if(cl>0) h += clamp(cl*.95,0,6.0)*clamp(1-Math.abs(x-34)/14,0,1);
  // stream channel carved relative to the surface so it follows the cliff
  const sd=streamD(x,z);
  if(sd<1.9){ const t=clamp(1-sd/1.9,0,1); h -= 2.5*t*t; }
  // zen garden pad
  const zx=Math.abs(x-ZEN.x)-ZEN.w/2, zz=Math.abs(z-ZEN.z)-ZEN.d/2;
  const zc=Math.max(zx,zz);
  if(zc<6) h = lerp(h, 4.9, clamp(1-(zc-2.5)/3.5,0,1));
  // tea house pad
  const td=Math.max(Math.abs(x+35),Math.abs(z-32))-7;
  h = lerp(h, 4.2, clamp(1-(td)/4,0,1));
  // forested hills rise around the garden so it reads as a walled valley
  const e=Math.max(Math.abs(x),Math.abs(z));
  if(e>GARDEN+1){
    const t=clamp((e-(GARDEN+1))/14,0,1);
    h += Math.pow(t,1.25)*11 + t*fbm(x*.08,z*.08,66,3)*4.5;
  } else if(e>GARDEN-5){
    h += (e-(GARDEN-5))*0.35;
  }
  return h;
}
function buildHeight(){
  for(let z=WZ0;z<=WZ1;z++)for(let x=WX0;x<=WX1;x++){
    let h=heightRaw(x,z);
    h=h*.72 + (fbm(x*.2,z*.2,909,2)-.5)*.9;
    hF[gi(x,z)]=h;
    wet[gi(x,z)]=fbm(x*.06,z*.06,313,3);
  }
  // one smoothing pass keeps cliffs readable
  const tmp=hF.slice();
  for(let z=WZ0+1;z<WZ1;z++)for(let x=WX0+1;x<WX1;x++){
    const i=gi(x,z); let s=0;
    for(let k=-1;k<=1;k++)for(let j=-1;j<=1;j++) s+=tmp[i+k+WW*j];
    hF[i]=s/9;
  }
}
const hAt=(x,z)=>{ if(!inB(x,z)) return 3; const i=gi(Math.round(x),Math.round(z)); return hF[i]; };
const gH=(x,z)=> Math.round(hAt(x,z));
const gTop=(x,z)=> inB(x,z)? Math.round(hF[gi(Math.round(x),Math.round(z))]) : 3;

/* --------------------------------------------------------- GL plumbing ---- */
const cv=document.getElementById('cv');
const gl=cv.getContext('webgl2',{antialias:true,alpha:false,powerPreference:'high-performance'});
if(!gl){ document.getElementById('ls').textContent='WebGL2 not available'; throw new Error('no webgl2'); }
gl.getExtension('EXT_color_buffer_float');

function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+
    src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n').slice(-4000));
  return s; }
function prog(vs,fs){ const p=gl.createProgram();

const FLOATS_PER_INST=12;
function makeInstBuffer(list){

}

const FACES=[

  {n:[0,1,0], u:[1,0,0], v:[0,0,-1]},
  {n:[0,-1,0],u:[1,0,0], v:[0,0,1]},
  {n:[0,0,1], u:[1,0,0], v:[0,1,0]},
  {n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},

  gl.bindBuffer(gl.ARRAY_BUFFER,vertBuf);

  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,4,gl.FLOAT,false,S,16); gl.vertexAttribDivisor(3,1);

  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,8,0); gl.vertexAttribDivisor(0,0);

/* shadow map */
let SHADOW_RES=2048, shadow={};
function buildShadow(){
  if(shadow.fb) gl.deleteFramebuffer(shadow.fb);
  if(shadow.tex) gl.deleteTexture(shadow.tex);
  const tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texStorage2D(gl.TEXTURE_2D,1,gl.DEPTH_COMPONENT24,SHADOW_RES,SHADOW_RES);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_MODE,gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_COMPARE_FUNC,gl.LEQUAL);
  const fb=gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER,fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,tex,0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  shadow={tex,fb,res:SHADOW_RES};
}
/* occupancy 3D texture */
let occTex=null;
function buildOccTex(){
  occTex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_3D,occTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);
  gl.texStorage3D(gl.TEXTURE_3D,1,gl.R8,GX,GY,GZ);
  gl.texSubImage3D(gl.TEXTURE_3D,0,0,0,0,GX,GY,GZ,gl.RED,gl.UNSIGNED_BYTE,occ);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_3D,gl.TEXTURE_WRAP_R,gl.CLAMP_TO_EDGE);
}

let timeOfDay=.710, autoTime=false;
function skyFor(t){
  const ang=(t-.25)*Math.PI*2;
  const el=Math.sin(ang), az=Math.cos(ang);
  const d=[az*.72, Math.max(el,-1), -az*.32-.34];
  const l=Math.hypot(d[0],d[1],d[2]); d[0]/=l; d[1]/=l; d[2]/=l;
  const elev=d[1];
  const day=clamp(elev*3.2+.16,0,1);
  const dusk=clamp(1-Math.abs(elev)*3.1,0,1);
  const night=clamp(-elev*4.2,0,1);
  const sunC=[
    lerp(.05,.98,day),
    lerp(.06,.86,day),
    lerp(.12,.70,day)];
  sunC[0]=sunC[0]*lerp(1,1.32,dusk); sunC[1]*=lerp(1,.80,dusk); sunC[2]*=lerp(1,.56,dusk);
  // the key light follows the sun by day and the moon by night
  const up=elev>.015;
  let L= up? [d[0],d[1],d[2]] : [-d[0], Math.max(-d[1],.30), -d[2]];
  const ll=Math.hypot(L[0],L[1],L[2]); L=[L[0]/ll,L[1]/ll,L[2]/ll];
  const moonI=clamp(-elev*2.6,0,1);
  const inten=lerp(1,.42,night);
  const sunCol=[sunC[0]*inten, sunC[1]*inten, sunC[2]*inten];
  if(!up){ const m=.55+.45*moonI;
    sunCol[0]=lerp(sunCol[0],.30,m); sunCol[1]=lerp(sunCol[1],.38,m); sunCol[2]=lerp(sunCol[2],.62,m); }
  const out={
    sun:d, light:L, day, night, dusk,
    sunCol,
    zen: mixc(mixc([.10,.16,.36],[.28,.52,.90],day),[.012,.024,.062],night),
    hor: mixc(mixc([.30,.34,.46],[.84,.80,.70],day),[.045,.062,.14],night),
    tint: mixc(mixc([1,.55,.30],[1,.96,.86],clamp(elev*4,0,1)),[.55,.65,1.],night),
    ambT: mixc(mixc([.12,.15,.23],[.36,.40,.48],day),[.17,.205,.32],night),
    ambB: mixc(mixc([.07,.07,.08],[.19,.20,.17],day),[.07,.08,.13],night),
    fog: mixc(mixc([.42,.46,.56],[.80,.84,.86],day),[.055,.075,.15],night),
  };
  out.hor=mixc(out.hor,[1,.62,.36],dusk*.75);
  out.fog=mixc(out.fog,[1,.66,.42],dusk*.55);
  out.tint=mixc(out.tint,[1,.45,.22],dusk*.8);
  return out;
}

const eye=[0,0,0];
function updateCamera(dt){
  if(cam.auto&&!dragging){ cam.dYaw+=dt*.045; }
  const k=1-Math.pow(.0016,dt);
  cam.yaw+=(cam.dYaw-cam.yaw)*k; cam.pitch+=(cam.dPitch-cam.pitch)*k;
  cam.dist+=(cam.dDist-cam.dist)*k;
  cam.tx+=(cam.dTx-cam.tx)*k; cam.ty+=(cam.dTy-cam.ty)*k; cam.tz+=(cam.dTz-cam.tz)*k;
  const cp=Math.cos(cam.pitch);
  eye[0]=cam.tx+Math.cos(cam.yaw)*cp*cam.dist;
  eye[1]=cam.ty+Math.sin(cam.pitch)*cam.dist;
  eye[2]=cam.tz+Math.sin(cam.yaw)*cp*cam.dist;
  // never let the orbit camera sink into the hills at the edge of the valley
  const gh = inB(eye[0],eye[2]) ? gTop(eye[0],eye[2]) : 4;
  if(eye[1] < gh+4) eye[1] = gh+4;
  m4persp(proj,.86,aspect,.6,520);
  m4look(view,eye[0],eye[1],eye[2],cam.tx,cam.ty,cam.tz,0,1,0);
  m4mul(vp,proj,view);
}
function updateLight(S){
  const d=S.light;

  m4ortho(lightVP,-R,R,-R,R,-R*2.2,R*2.2);

  m4mul(lightVP,lightVP,lv);
}

/* ---------- surface painting ---------- */
function paintDisc(cx,cz,r,type,feather){
  const R2=Math.ceil(r+2);
  for(let z=Math.floor(cz-R2);z<=Math.ceil(cz+R2);z++)for(let x=Math.floor(cx-R2);x<=Math.ceil(cx+R2);x++){
    if(!inB(x,z))continue;
    const d=Math.hypot(x-cx,z-cz)-r;
    if(d>0) continue;
    const t=clamp(1+d/(feather||1.2),0,1);
    if(t>.5) sF[gi(x,z)]=type;
  }
}
function paintPath(pts,w,type){
  for(let k=0;k<pts.length-1;k++){
    line(pts[k][0],pts[k][1],pts[k+1][0],pts[k+1][1],(x,z)=>{
      for(let dz=-Math.ceil(w);dz<=Math.ceil(w);dz++)for(let dx=-Math.ceil(w);dx<=Math.ceil(w);dx++){
        const px=x+dx,pz=z+dz; if(!inB(px,pz))continue;
        if(Math.hypot(dx,dz)<=w) sF[gi(px,pz)]=type;
      }
    });
  }
}

/* ---------- ground colours ---------- */
function surfColor(t,x,z){
  const n=fbm(x*.19,z*.19,41,3), n2v=fbm(x*.045,z*.045,77,2);
  switch(t){
    case SURF.WATER:   return mixc(hex(C.sand),hex(C.gravelD),n);
    case SURF.SAND:    return mixc(hex(C.sand),hex(C.sandL),n);
    case SURF.GRAVEL:  return mixc(hex(C.gravel),hex(C.gravelD),n);
    case SURF.GRAVELD: return mixc(hex(C.gravelD),hex(C.stoneD),n);
    case SURF.STONE:   return mixc(hex(C.stoneL),hex(C.stone),n*.9);
    case SURF.DIRT:    return mixc(hex(C.dirt),hex(C.wood),n);
    case SURF.BAMBOO:  return mixc(hex(C.dirt),hex(C.bambooD),n*.7);
    case SURF.MOSS:    return mixc(hex(C.moss),hex(C.grassD),n*.8);
    case SURF.ZEN:     return mixc(hex(C.sandL),hex(C.sand),n*.5);
    default: {
      const g=mixc(hex(C.grass),hex(C.grassL),n2v);
      return mixc(g,hex(C.dry),clamp((n-.62)*2.4,0,.5));
    }
  }
}
const surfSide=t=> (t===SURF.STONE||t===SURF.GRAVEL||t===SURF.GRAVELD||t===SURF.ZEN)? C.stoneD
  : (t===SURF.WATER? C.sand : (t===SURF.MOSS? C.moss : C.dirt));

/* ---------- terrain ---------- */
const ZENROCKS=[[27,27],[38,34],[31,36],[41,26]];
function buildTerrain(){
  jitterAmt=.055;
  for(let z=WZ0;z<=WZ1;z++)for(let x=WX0;x<=WX1;x++){
    const h=Math.round(hF[gi(x,z)]), t=sF[gi(x,z)];
    const c=surfColor(t,x,z);
    // zen sand ridges: subtle height modulation
    vox(x,h-1,z,c,M.MATTE);
    if(t===SURF.ZEN){
      let ring=0;
      for(const rk of ZENROCKS){ const d=Math.hypot(x-rk[0],z-rk[1]); ring=Math.max(ring,Math.sin(d*2.1)); }
      const rake=Math.sin(x*.62+z*.18)*.5+.5;
      const v=Math.max(ring*.9,rake*.55);
      if(v>.52) box(x,h-.12,z,1,.14,1,mixc(hex(C.sandL),hex(C.sand),(v-.52)*1.9),M.MATTE);
    }
    // side walls where the ground drops
    const nb=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dz] of nb){
      const nx=x+dx, nz=z+dz;
      const hn = inB(nx,nz)? Math.round(hF[gi(nx,nz)]) : h-2;
      const ts = inB(nx,nz)? sF[gi(nx,nz)] : SURF.GRASS;
      if(hn<h){
        const dep=Math.min(h-hn,7);
        const sc=hex(surfSide(ts));
        for(let k=1;k<=dep;k++)
          box(x,h-k,z,1,1,1,mixc(sc,hex(C.stoneD),clamp(k*.16+ (ts===SURF.WATER?.4:0),0,.75)),M.MATTE);
      }
      if(hn>h+1 && ts!==SURF.WATER){ // guard against holes on the high side
        for(let k=1;k<=Math.min(hn-h,2);k++) box(x,h-k,z,1,1,1,hex(C.dirt),M.MATTE);
      }
    }
  }
  /* ---- coarse outer ring: hills + wild forest ---- */
  for(let z=WZ0;z<=WZ1;z+=2)for(let x=WX0;x<=WX1;x+=2){
    const e=Math.max(Math.abs(x),Math.abs(z));
    if(e<=GARDEN) continue;
    const h=Math.round(hF[gi(x,z)]);
    const wetv=fbm(x*.07,z*.07,313,3);
    const c=mixc(mixc(hex(C.grassD),hex(C.pineD),clamp((e-GARDEN)/14,0,1)),hex(C.moss),wetv*.5);
    box(x,h-2,z,2,2,2,mixc(hex(c),hex(C.dirt),.35),M.MATTE);
    box(x,h-.5,z,2,1.5,2,c,M.LEAF);
  }
  // water surfaces
  for(let z=WZ0;z<=WZ1;z++)for(let x=WX0;x<=WX1;x++){
    if(!inB(x,z))continue;

function fence(x0,z0,x1,z1,n=1,wood=C.woodL){
  line(x0,z0,x1,z1,(x,z,t)=>{

function bx(cx,cy,cz,w,h,d,c,m,opt){ box(cx-w/2,cy-h/2,cz-d/2,w,h,d,c,m,opt); }
function bxN(cx,cy,cz,w,h,d,c,m,opt){ boxN(cx-w/2,cy-h/2,cz-d/2,w,h,d,c,m,opt); }

/* ============================== 五重塔  FIVE-STORY PAGODA ================ */
function roof(cx,cz,yBase,R,rise,opt={}){
  const tile=hex(opt.tile??C.tile), tileD=hex(opt.tileD??C.tileD), tileL=hex(opt.tileL??C.tileL);
  const ridge=hex(opt.ridge??C.tileD), fascia=hex(opt.fascia??C.plasterW);
  const trim=hex(opt.trim??C.gold);
  for(let i=-R;i<=R;i++)for(let j=-R;j<=R;j++){
    const ai=Math.abs(i), aj=Math.abs(j);
    const d=Math.max(ai,aj);
    const t=(R-d)/R;
    const cnr=Math.min(ai,aj)/R;
    const lift=Math.pow(cnr,2.3)*Math.pow(d/R,3.4)*rise*.95;
    const yy=yBase+t*rise+lift;
    const hip=Math.abs(ai-aj)<.6 && ai>R*.25;
    const groove=(ai+aj)%2===0;
    let c=hip? ridge : (groove? mixc(tile,tileD,.45): tile);
    c=mixc(c,tileL,clamp(t*.35,0,.35));
    bx(cx+i,yy,cz+j,1,.6,1,c,M.MATTE);
    if(d>=R-1) bx(cx+i,yy-.62,cz+j,1,.5,1,fascia);
    if(d===R){ // eave tip
      bx(cx+i,yy+.34,cz+j,1,.16,1,mixc(trim,tileD,.25));
    }
  }
  // corner ornaments on the four upturned tips
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const ai=R, aj=R, t=0, cnr=1, lift=Math.pow(cnr,2.3)*Math.pow(1,3.4)*rise*.95;
    const yy=yBase+t*rise+lift;
    bx(cx+sx*ai, yy+.55, cz+sz*aj, .55,.55,.55, trim, M.METAL);
    bx(cx+sx*(ai-.5), yy+.95, cz+sz*(aj-.5), .3,.4,.3, trim, M.METAL);
  }
  // soffit ring under the eaves so the roof reads as a solid form
  for(let i=-R+1;i<=R-1;i++)for(let j=-R+1;j<=R-1;j++){
    const d=Math.max(Math.abs(i),Math.abs(j));
    if(d<R-1) continue;
    bx(cx+i,yBase-1.05,cz+j,1,.5,1,hex(C.timber));
  }
}

    for(const sx of[-1,1]) bx(cx+sx*(hw-.45),y+wallH/2,cz,.9,wallH,2*hw-.4,pl);
    bx(cx,y+wallH-.35,cz,2*hw+.6,.55,2*hw+.6,hex(C.woodD));

    bx(cx,y+wallH*.55,cz,2*hw+.5,.3,2*hw+.5,hex(C.wood));

      }

      bx(cx,y+.7,cz,2*hw-1.4,.6,2*hw-1.4,hex(C.woodD));
      for(const sx of[-1,1])for(const sz of[-1,1]) bx(cx+sx*(hw-2.2),y+2.6,cz+sz*(hw-2.2),.85,4.4,.85,hex(C.timber));
      buddha(cx,y+1.0,cz-1.2,1.0);
      for(const s of[-1,1]){ bx(cx+s*3.2,y+1.5,cz+3.2,.9,.9,.9,hex(C.lanternRed),M.EMIT);
        glowPts.push(cx+s*3.2,y+1.9,cz+3.2,3.2,1,.6,.35,1.6,1,s*.3,0,0); }
    } else {
      /* lattice windows on each face */
      for(const [dx,dz,w,d] of [[0,-hw+.02,3.0,.7],[0,hw-.02,3.0,.7],[-hw+.02,0,.7,3.0],[hw-.02,0,.7,3.0]]){
        bx(cx+dx,y+wallH*.55,cz+dz,w,2.2,d,hex(C.timber));
        for(let k=-1;k<=1;k++)
          bx(cx+dx+(w>d?k*.9:0),y+wallH*.55,cz+dz+(w>d?0:k*.9),w>d?.22:w-.3,2.0,w>d?w-.3:.22,hex(C.shoji),M.PAPER);
        bx(cx+dx,y+wallH*.55+1.15,cz+dz,w+.2,.22,d+.2,hex(C.woodD));

    /* roof */

    roof(cx,cz,rb,Rr,3.1-i*.12,{tile:C.tile,tileD:C.tileD,tileL:C.tileL,ridge:C.tileD,fascia:C.plasterW,trim:C.gold});

  for(let i=0;i<8;i++){ const a=i/8*6.283; bx(cx+Math.cos(a)*1.5,fy+1.0,cz+Math.sin(a)*1.5,.8,.6,.8,hex(C.sakuraD),M.METAL); }
  bx(cx,fy+1.5,cz,2.2,.6,2.2,hex(C.gold),M.METAL);
  for(let k=0;k<9;k++) bx(cx,fy+2.1+k*.62,cz,1.9-k*.13,.24,1.9-k*.13,hex(C.goldL),M.METAL);
  bx(cx,fy+2.4,cz,.55,6.4,.55,hex(C.gold),M.METAL);
  bx(cx,fy+8.1,cz,1.1,.9,1.1,hex(C.goldL),M.METAL);
  bx(cx,fy+8.9,cz,.7,.9,.7,hex(C.goldL),M.METAL);

  glowPts.push(cx,fy+9.4,cz,4.5,1,.85,.45,1.4,1,.2,0,0);

}

function komainu(x,z,ax=0){
  const y=gTop(x,z);
  const st=mixc(hex(C.stoneL),hex(C.stone),.4), sd=hex(C.stoneD), dk=mixc(hex(C.stoneD),hex(C.slate),.4);
  const D=(w,d)=> ax? [d,w] : [w,d];
  let [w,d]=D(1.7,2.6); bx(x,y+.4,z,w,.85,d,st);
  [w,d]=D(1.35,2.0);    bx(x,y+1.45,z-.1,w,1.3,d,st);
  [w,d]=D(1.2,1.1);     bx(x,y+2.45,z-.8,w,1.0,d,st);
  bx(x,y+2.85,z-1.2,.55,.5,.55,st);
  bx(x,y+3.1,z-1.35,.4,.22,.4,dk);
  for(const s of[-1,1]){
    bx(x+s*(ax?.8:.55),y+2.95,z-(ax?.8:.55),ax?.4:.34,.42,ax?.34:.42,st);
    bx(x+s*(ax?.75:.42),y+1.5,z-1.0,.42,.95,.42,st);
    boxN(x+s*.42+(ax?.55:0),y+2.35,z+(ax?-1.0:.55),.34,.34,.34,dk);
  }
  bx(x,y+2.2,z+1.0,.5,.85,.5,st);
  bx(x,y+2.75,z+1.15,.42,.42,.42,sd);
  for(let i=0;i<7;i++){ const a2=i/7*6.283;
    boxN(x+Math.cos(a2)*.72,y+2.6,z-.8+Math.sin(a2)*.55,.36,.36,.36,sd); }
  for(let i=0;i<4;i++) boxN(x-.6+i*.4,y+.88,z-.95,.3,.12,.3,dk);
}

/* ================================ TREES & PLANTS ======================== */
function canopyBlob(cx,cy,cz,rx,ry,rz,rnd,colorFn,mat=M.LEAF){
  const nx=Math.ceil(rx),ny=Math.ceil(ry),nz=Math.ceil(rz);
  for(let i=-nx;i<=nx;i++)for(let j=-ny;j<=ny;j++)for(let k=-nz;k<=nz;k++){
    const d2=(i/rx)**2+(j/ry)**2+(k/rz)**2;
    if(d2>1.05) continue;
    const d=Math.sqrt(d2);
    if(rnd()< .07+d*.30) continue;
    const s=.92+rnd()*.5;
    box(cx+i-s/2,cy+j-s/2,cz+k-s/2,s,s,s,colorFn(d,j/ry,rnd),mat);
  }
}
function limb(x0,y0,z0,x1,y1,z1,rnd,r0,mat){
  const n=Math.ceil(Math.hypot(x1-x0,y1-y0,z1-z0));
  for(let k=0;k<=n;k++){
    const t=k/n;
    const w=Math.max(.28,r0*(1-t*.75));
    bxN(lerp(x0,x1,t),lerp(y0,y1,t)+Math.sin(t*3.14)*.35,lerp(z0,z1,t),w,w,w,hex(C.woodD),mat??M.BARK);
  }
  return [x1,y1,z1];
}
function cherryColor(rnd){
  return (d,h)=>{
    let c = d<.42? hex(C.sakuraC) : d<.72? hex(C.sakura) : hex(C.sakuraL);
    const r=rnd();
    if(r<.16) c=hex(C.plum); else if(r<.26) c=hex(C.sakuraD); else if(r<.32&&h>.4) c=hex(C.sakuraL);
    return c;
  };
}
function treeCherry(x,z,s=1,seed=1){
  const rnd=mulberry(seed), y=gTop(x,z);
  const trunkH=5.2*s;
  /* roots */
  for(let i=0;i<6;i++){ const a=i/6*6.283+rnd();
    for(let k=0;k<3;k++) bxN(x+Math.cos(a)*(1.1+k*.35)*s,y+.35-k*.28,z+Math.sin(a)*(1.1+k*.35)*s,
      (1.0-k*.22)*s,(.8-k*.2)*s,(1.0-k*.22)*s,mixc(hex(C.woodD),hex(C.timber),.3),M.BARK); }
  /* trunk with cherry lenticels */
  let px=x,pz=z;
  for(let k=0;k<trunkH;k+=.85){
    const t=k/trunkH;
    px+=Math.sin(t*2.6+seed)*.16*s; pz+=Math.cos(t*2.1+seed*1.7)*.13*s;
    const w=Math.max(.7,(1.7-t*1.0)*s);
    const c=(Math.round(k/.85)%3===0)? mixc(hex(C.woodD),hex(C.plank),.42): hex(C.woodD);
    bx(px,y+k+.5,pz,w,1.0,w,c,M.BARK);
  }
  const crownY=y+trunkH+1.4*s;
  const nb=6+Math.floor(rnd()*3);
  for(let i=0;i<nb;i++){
    const a=i/nb*6.283+rnd()*.7;
    const rad=(2.4+rnd()*2.4)*s;
    const bx0=x+Math.cos(a)*rad, bz0=z+Math.sin(a)*rad;
    const by=crownY+(rnd()-.4)*2.4*s;
    limb(px,y+trunkH*.75,pz,bx0,by,bz0,rnd,1.05*s*(1-i/(nb*2)));
    canopyBlob(bx0,by+.9*s,bz0,(2.0+rnd()*1.5)*s,(1.35+rnd()*.8)*s,(2.0+rnd()*1.5)*s,rnd,cherryColor(rnd));
  }
  canopyBlob(px,crownY+2.0*s,pz,3.1*s,2.0*s,3.1*s,rnd,cherryColor(rnd));
  canopyBlob(px-.6*s,crownY+.4*s,pz+.4*s,2.2*s,1.5*s,2.2*s,rnd,cherryColor(rnd));
  for(let i=0;i<10;i++) petalSrc.push([x+(rnd()-.5)*9*s,crownY+2+rnd()*2.5,z+(rnd()-.5)*9*s,
    pick([hex(C.sakuraL),hex(C.sakura),hex(C.plum),hex(C.sakuraD)])]);
  flightAnchors.push([x,crownY+2,z]);
}
function treeMaple(x,z,s=1,seed=2){

}
function treePine(x,z,s=1,seed=3){

    bx(px,y+k+.5,pz,w,1.0,w,mixc(hex(C.timber),hex(C.woodD),rnd()*.4),M.BARK);
  }
  const pads=[[0,h*.55,0,2.6],[1.9,h*.78,1.1,2.2],[-2.1,h*.9,.6,2.0],[.6,h*1.06,-2.0,1.9],
              [-1.0,h*1.22,1.6,1.7],[.2,h*1.34,-.6,1.4]];

function grassDetail(){

/* ================================ WATER FEATURES ======================== */
function buildPond(){
  /* rim rocks follow the real waterline */
  const rnd=mulberry(555);
  for(let a=0;a<6.283;a+=.05){
    let wx=POND.x, wz=POND.z;
    for(let r=.30;r<1.3;r+=.02){
      wx=POND.x+Math.cos(a)*(POND.rx+3)*r; wz=POND.z+Math.sin(a)*(POND.rz+3)*r;
      if(hAt(wx,wz)>WATER_Y+.4) break;
    }
    if(!inB(Math.round(wx),Math.round(wz)))continue;
    if(rnd()<.42) continue;
    const y=gTop(wx,wz), s=.6+rnd()*1.0;
    bx(wx,y+s*.3,wz,s*1.5,s,s*1.5,mixc(hex(C.stone),hex(C.stoneD),rnd()*.6),M.MATTE,{ry:rnd()*3});
    if(rnd()<.35) boxN(wx-.3,y+s*.92,wz-.3,.75,.2,.75,hex(C.moss),M.LEAF);
    if(rnd()<.18) susuki(wx+(rnd()-.5)*2.4,wz+(rnd()-.5)*2.4,Math.floor(rnd()*9999));
    if(rnd()<.14) iris(wx+(rnd()-.5)*2,wz+(rnd()-.5)*2,Math.floor(rnd()*9999));
  }
  /* submerged boulders (visible through the clear water) */
  for(let i=0;i<26;i++){
    const a=rnd()*6.283, d=Math.sqrt(rnd());
    const x=POND.x+Math.cos(a)*POND.rx*.85*d, z=POND.z+Math.sin(a)*POND.rz*.85*d;
    const h=hAt(x,z); if(h>WATER_Y-.4) continue;
    const s=.9+rnd()*1.6;
    bx(x,h+s*.3,z,s,s*.8,s,mixc(hex(C.slate),hex(C.stoneD),rnd()*.5));
  }
  /* island: filled from the bed so it reads as a real islet */
  const ix=POND.x+4.5, iz=POND.z-3.5, itop=WATER_Y+1.8;
  for(let dz=-4;dz<=4;dz++)for(let dx=-4;dx<=4;dx++){
    const d=Math.hypot(dx/4.4,dz/3.6); if(d>1)continue;
    const x=Math.round(ix+dx), z=Math.round(iz+dz);
    if(!inB(x,z))continue;
    const bed=Math.round(hAt(x,z)), h=Math.max(itop,bed+1);
    for(let k=bed;k<h;k++){
      const cap=(k===h-1);
      box(x-.5,k,z-.5,1,1,1, cap? (d<.74? mixc(hex(C.grassD),hex(C.moss),rnd()*.6): surfColor(SURF.SAND,x,z))
                                : mixc(hex(C.stoneD),hex(C.dirt),rnd()*.5), cap&&d<.74?M.LEAF:M.MATTE);
    }
    sF[gi(x,z)]= d<.74?SURF.GRASS:SURF.SAND;
  }
  treePine(ix,iz,.62,71);
  stoneLantern(ix-1.5,iz+1.6,.72);
  /* lily pads + lotus */
  for(let i=0;i<44;i++){
    const a=rnd()*6.283, d=.35+rnd()*.62;
    const x=POND.x+Math.cos(a)*POND.rx*d, z=POND.z+Math.sin(a)*POND.rz*d;
    if(hAt(x,z)>WATER_Y-.2) continue;
    const s=.7+rnd()*.9;
    boxN(x-s/2,WATER_Y+.1,z-s/2,s,.12,s,hex(rnd()<.7?C.leafD:C.pine),M.LEAF,{ry:rnd()*3});
    if(rnd()<.22){
      boxN(x-.1,WATER_Y+.5,z-.1,.3,.4,.3,hex(C.pine),M.LEAF);
      boxN(x-.28,WATER_Y+.95,z-.28,.6,.5,.6,hex(rnd()<.6?C.lotus:C.lotusL),M.LEAF);
      boxN(x-.1,WATER_Y+1.3,z-.1,.3,.3,.3,hex(C.flY),M.LEAF);
    }
  }
  /* reeds & iris at the waterline */
  for(let a=0;a<6.283;a+=.09){
    const x=POND.x+Math.cos(a)*POND.rx*.99, z=POND.z+Math.sin(a)*POND.rz*.99;
    if(!inB(Math.round(x),Math.round(z)))continue;
    const h=hAt(x,z);
    if(h>WATER_Y+.2&&h<WATER_Y+1.6&&rnd()<.30){
      const y=Math.round(h);
      for(let k=0;k<5;k++){ const ang=rnd()*6.283;
        boxN(x+Math.cos(ang)*.3-.1,y+k*.8,z+Math.sin(ang)*.3-.1,.18,.9,.18,hex(rnd()<.5?C.pine:C.leafD),M.LEAF);
      }
      if(rnd()<.35) boxN(x-.2,y+4.2,z-.2,.42,1.0,.42,hex(0x6b5233),M.MATTE);
    }
  }
  koiPonds.push({x:POND.x,z:POND.z,rx:POND.rx*.8,rz:POND.rz*.8});
}
function buildStreamAndFalls(){
  const rnd=mulberry(777);
  const cxp=z=>33-12*clamp((z+22)/56,0,1.35)+Math.sin(((z+22)/56)*5.1)*3.2;
  /* rocky banks the whole length */
  for(let z=-23;z<=35;z++){
    const c=cxp(z);
    for(const s of[-1,1])for(let k=0;k<2;k++){
      const x=c+s*(2.0+k*1.15);
      if(!inB(Math.round(x),z)||pondD(x,z)<.92) continue;
      if(rnd()<.62){
        const y=gTop(x,z);
        bx(x,y+.3,z,1.0+rnd()*.9,.8+rnd()*.6,1.1+rnd()*.8,
          mixc(hex(C.stone),hex(C.stoneD),rnd()*.75),M.MATTE,{ry:rnd()*3});
        if(rnd()<.3) boxN(x-.32,y+1.05,z-.32,.7,.22,.7,hex(C.moss),M.LEAF);
      }
      if(rnd()<.14) susuki(c+s*4.0,z,Math.floor(rnd()*9999));
      if(rnd()<.10) iris(c+s*3.3,z,Math.floor(rnd()*9999));
      if(rnd()<.07) fern(c+s*3.6,z,Math.floor(rnd()*9999));
    }
  }
  /* source pool among the rocks */
  const sx0=cxp(-23);
  for(let dz=-2;dz<=2;dz++)for(let dx=-3;dx<=3;dx++){
    const x=sx0+dx, z=-23+dz;
    if(!inB(x,z))continue;
    if(Math.hypot(dx/3.2,dz/2.4)>1) continue;
    const y=gTop(x,z);
    box(x-.5,y-1,z-.5,1,1,1,hex(C.slate));
    push(water,x-.5,y+.14,z-.5,1,.16,1,mixc(hex(C.waterS),hex(C.waterD),.5),M.FLOW,0,0);
    if(Math.hypot(dx/3.2,dz/2.4)>.82&&rnd()<.6) bx(x,y+.5,z,1.3,1.0,1.3,mixc(hex(C.stoneD),hex(C.slate),rnd()*.5),M.MATTE,{ry:rnd()*3});
  }
  stoneLantern(sx0-4.5,-22,.85);
  /* the ribbon: follows the bed, breaks into stepped falls at the escarpment */
  let prevBed=null;
  for(let z=-22;z<=34;z++){
    const c=cxp(z);
    if(pondD(c,z)<.90){ prevBed=null; continue; }
    const bed=gTop(c,z);
    for(let dx=-1;dx<=1;dx++){
      const x=c+dx; if(!inB(Math.round(x),z))continue;
      const b=Math.max(gTop(x,z),WATER_Y);
      push(water,x-.45,b+.16,z-.45,.9,.16,.9,mixc(hex(C.waterS),hex(C.waterD),.2+Math.abs(dx)*.12),M.FLOW,0,0);
    }
    if(prevBed!==null && prevBed-bed>=1){
      /* cliff wall behind the fall */
      for(let dx=-3;dx<=3;dx++)for(let k=0;k<prevBed-bed+2;k++){
        const x=c+dx*1.25+(rnd()-.5)*.5;
        if(!inB(Math.round(x),z))continue;
        bx(x,bed+.7+k*1.0,z-1.0+(rnd()-.5)*.7,1.7+rnd()*1.1,1.15,1.7+rnd()*.8,
          mixc(hex(C.stoneD),hex(C.slate),rnd()*.55),M.MATTE,{ry:rnd()*3});
      }
      /* the sheets of water */
      for(let dx=-1;dx<=1;dx++){
        const x=c+dx;
        const b=Math.max(gTop(x,z),WATER_Y);
        for(let y=b+.3;y<prevBed+.35;y+=.8)
          push(water,x-.45,y,z+.12,.9,.9,.42,mixc(hex(C.waterS),hex(C.foam),.42),M.FLOW,0,0);

function updateFauna(t){
  dynCount=0;
  /* koi */
  for(const k of koi){
    const ang=k.ph+t*k.sp*k.dir;
    const segs=7;
    for(let i=0;i<segs;i++){
      const a=ang-i*.16*k.dir;
      const wob=Math.sin(t*3.4+i*.9)*k.wob*.16*i;
      const x=k.cx+Math.cos(a)*k.rx - Math.sin(a)*wob;
      const z=k.cz+Math.sin(a)*k.rz + Math.cos(a)*wob;
      const y=WATER_Y-k.depth-Math.sin(t*1.6+k.ph)*.08;
      const w=(i===0?.55:i>=segs-2?.3:.72)*k.len;

  if(shishi.set){

function buildPaths(){
  const rnd=mulberry(31415);
  /* flagstones on the main approach */
  for(const pts of [pathMain]){
    for(let k=0;k<pts.length-1;k++){
      const [x0,z0]=pts[k],[x1,z1]=pts[k+1];
      const n=Math.ceil(Math.hypot(x1-x0,z1-z0));
      for(let i=0;i<n;i++){
        const t=i/n, x=x0+(x1-x0)*t, z=z0+(z1-z0)*t;
        for(const s of[-1,1]){
          if(rnd()<.55){
            const px=x+(rnd()-.5)*1.2, pz=z+(rnd()-.5)*1.2;
            const y=gTop(px,pz);
            bx(px,y+.14,pz,1.5+rnd()*.6,.3,1.4+rnd()*.6,mixc(hex(C.stoneL),hex(C.stone),rnd()*.8),M.MATTE,{ry:rnd()*.5-.25});
          }

            boxN(px-.3,gTop(px,pz)+.05,pz-.3,.6,.2,.6,hex(C.gravelD),M.MATTE,{ry:rnd()*3}); }
        }
      }
    }
  }
  /* gravel edging along the plaza ring + radial flag pattern */
  for(let a=0;a<6.283;a+=.02){
    const r=18.6;
    const x=PG.x+Math.cos(a)*r, z=PG.z+Math.sin(a)*r;
    if(!inB(Math.round(x),Math.round(z)))continue;
    if(rnd()<.5){ const y=gTop(x,z);
      bx(x,y+.1,z,.9,.28,.9,mixc(hex(C.stoneD),hex(C.mossStone),rnd()*.5),M.MATTE,{ry:rnd()*3}); }
  }
  for(let a=0;a<6.283;a+=Math.PI/8){
    for(let r=13;r<18;r+=1.6){
      const x=PG.x+Math.cos(a)*r, z=PG.z+Math.sin(a)*r;

      bx(x,y+.12,z,1.1,.24,1.1,mixc(hex(C.stone),hex(C.stoneL),rnd()*.7),M.MATTE,{ry:a});
    }
  }
  /* moss between the plaza stones */
  for(let i=0;i<420;i++){
    const a=rnd()*6.283, r=13+rnd()*6;
    const x=PG.x+Math.cos(a)*r, z=PG.z+Math.sin(a)*r;

    boxN(x-.35,y+.02,z-.35,.7,.12,.7,hex(rnd()<.5?C.moss:C.grassD),M.LEAF,{ry:rnd()*3});
  }
}

    gl.uniform3f(P_PETAL.u.uAmbTop,S.ambT[0],S.ambT[1],S.ambT[2]);
    gl.uniform1f(P_PETAL.u.uNight,S.night); gl.uniform1f(P_PETAL.u.uTime,t);
    gl.bindVertexArray(pVAO); gl.drawArraysInstanced(gl.TRIANGLES,0,6,petalCount); drawCalls++;
  }
  /* additive glow: lanterns, fireflies, mist */
  if(state.glow&&billCount){
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE); gl.depthMask(false);
    gl.useProgram(P_BILL.p);
    gl.uniformMatrix4fv(P_BILL.u.uVP,false,vp);
    gl.uniform1f(P_BILL.u.uTime,t);
    gl.uniform3f(P_BILL.u.uRight,view[0],view[4],view[8]);
    gl.uniform3f(P_BILL.u.uUp,view[1],view[5],view[9]);
    gl.uniform1f(P_BILL.u.uNight,S.night);
    gl.bindVertexArray(billVAO); gl.drawArraysInstanced(gl.TRIANGLES,0,6,billCount); drawCalls++;
  }
  gl.depthMask(true); gl.disable(gl.BLEND);

  /* stats */
  frames++;
  if(t-fpsT>1){ fps=frames/(t-fpsT); frames=0; fpsT=t; showStats(); }
  if(shotReq) grabFrame();
}
const emptyVAO=gl.createVertexArray();
/* read back the framebuffer so S can save a PNG of the current view */
let shotReq=false, grabBuf=null;
function grabFrame(){
  if(!grabBuf) grabBuf=new Uint8Array(W*H*4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.readPixels(0,0,W,H,gl.RGBA,gl.UNSIGNED_BYTE,grabBuf);
  const b=grabBuf;
  if(shotReq){
    shotReq=false;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const ctx=c.getContext('2d'); const img=ctx.createImageData(W,H);
    for(let y=0;y<H;y++){ const s=(H-1-y)*W*4, d=y*W*4; img.data.set(b.subarray(s,s+W*4),d); }
    ctx.putImageData(img,0,0);
    const a=document.createElement('a'); a.download='voxel-garden.png'; a.href=c.toDataURL('image/png'); a.click();
  }
}

/* ================================================================= UI ===== */
const ui={};
['time','dist','elev','petals'].forEach(id=>ui[id]=document.getElementById(id));
const statsEl=document.getElementById('stats');
function hhmm(t){ const m=Math.floor(((t*24+24)%24)*60); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function syncTimeLabel(){ document.getElementById('timev').textContent=hhmm(timeOfDay); }
function showStats(){
  statsEl.innerHTML=`<b>${(batches?batches.oi.count:0).toLocaleString()}</b> voxels · <b>${(batches?batches.wi.count:0).toLocaleString()}</b> water<br>`+
    `<b>${dynCount}</b> animated · <b>${petalCount}</b> petals · <b>${billCount}</b> lights<br>`+
    `<b>${fps.toFixed(0)}</b> fps · ${drawCalls} draws · ${shadow.res}px shadows`;
}
ui.time.addEventListener('input',()=>{ timeOfDay=ui.time.value/1000; autoTime=false; setToggle('time',false); syncTimeLabel(); });
ui.dist.addEventListener('input',()=>{ cam.dDist=+ui.dist.value; document.getElementById('distv').textContent=ui.dist.value; });
ui.elev.addEventListener('input',()=>{ cam.dPitch=(+ui.elev.value)/100; document.getElementById('elevv').textContent=ui.elev.value; });
ui.petals.addEventListener('input',()=>{
  const n=+ui.petals.value; document.getElementById('petalsv').textContent=n;
  petalCount=n; if(petalList.length) buildPetalVAO(makePetalList(n));
});
function applyView(v){
  if(!v.tour){ cam.dYaw=v.yaw; cam.dPitch=v.pitch; cam.dDist=v.dist;
    cam.dTx=v.t[0]; cam.dTy=v.t[1]; cam.dTz=v.t[2];
    ui.dist.value=v.dist; document.getElementById('distv').textContent=v.dist;
    ui.elev.value=Math.round(v.pitch*100); document.getElementById('elevv').textContent=Math.round(v.pitch*100);
    tourMode=false; setToggle('tour',false);
  } else { tourMode=true; tourT=2; }
}
const viewsEl=document.getElementById('views');
VIEWS.forEach((v,i)=>{ const b=document.createElement('button'); b.textContent=v.n;
  b.onclick=()=>{ applyView(v); if(!v.tour){ tourMode=false; } setToggle('tour',!!v.tour); };
  viewsEl.appendChild(b); });
const TOGGLES=[
  {k:'shadow',n:'影 Shadow',on:true},
  {k:'ao',n:'AO',on:true},
  {k:'orbit',n:'自動 Orbit',on:true},
  {k:'time',n:'時刻 Flow',on:false},
  {k:'tour',n:'巡 Tour',on:false},
  {k:'glow',n:'灯 Glow',on:true},
  {k:'petals',n:'花 Petals',on:true},
  {k:'q',n:'画質 High',on:false},
];
const toggleEls={};
function setToggle(k,on){ if(toggleEls[k]) toggleEls[k].classList.toggle('on',on); }
const togEl=document.getElementById('toggles');
TOGGLES.forEach(t=>{
  const b=document.createElement('button'); b.textContent=t.n; b.classList.toggle('on',t.on); toggleEls[t.k]=b;
  b.onclick=()=>{
    const on=!b.classList.contains('on'); b.classList.toggle('on',on);
    if(t.k==='shadow') state.shadow=on;
    else if(t.k==='ao') state.ao=on;
    else if(t.k==='orbit') cam.auto=on;
    else if(t.k==='time') autoTime=on;
    else if(t.k==='tour'){ tourMode=on; tourT=1; if(on) tourIdx=(tourIdx+1)%VIEWS.length, applyView(VIEWS[tourIdx]), tourMode=true; }
    else if(t.k==='glow') state.glow=on;
    else if(t.k==='petals') state.petals=on;
    else if(t.k==='q'){ state.quality=on?2:1; SHADOW_RES=on?3072:2048; buildShadow(); resize(); }
  };
  togEl.appendChild(b);
});
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){ document.body.classList.toggle('hideui'); }
  else if(e.code==='Space'){ cam.auto=!cam.auto; setToggle('orbit',cam.auto); e.preventDefault(); }
  else if(e.key==='t'||e.key==='T'){ autoTime=!autoTime; setToggle('time',autoTime); }
  else if(e.key==='r'||e.key==='R'){ applyView(VIEWS[0]); }
  else if(/^[1-8]$/.test(e.key)){ const v=VIEWS[+e.key-1]; if(v) applyView(v); }
  else if(e.key==='s'||e.key==='S'){ shotReq=true; }
});

/* ================================================================= GO ===== */
resize();
gl.enable(gl.DEPTH_TEST);
gl.clearColor(0,0,0,1);
setTimeout(()=>{
  const t0=performance.now();
  buildWorld();
  const tBuild=performance.now()-t0;
  lsEl.textContent=`${(opaque.length/12).toLocaleString()} voxels · baking occlusion`;
  setTimeout(()=>{
    buildOccTex();
    batches=uploadWorld();
    buildShadow();
    petalList=makePetalList(+ui.petals.value);
    buildPetalVAO(petalList);
    buildBillboards(glowPts);
    syncTimeLabel();
    applyView(VIEWS[0]); cam.yaw=cam.dYaw+.9; cam.dist=cam.dDist+40;
    lsEl.textContent=`built in ${tBuild.toFixed(0)}ms`;
    document.body.classList.add('ready');
    loader.classList.add('gone');
    requestAnimationFrame(frame);
    console.log('voxels',batches.oi.count,'water',batches.wi.count,'glow',billCount,'build',tBuild.toFixed(0)+'ms');
  },40);
},40);
</script>
