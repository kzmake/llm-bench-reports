<body>

</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================ utils */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
function hash2(xi,yi,s){let h=Math.imul(xi|0,374761393)+Math.imul(yi|0,668265263)+Math.imul(s|0,1013904223);
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return hash2(xi,zi,s)*(1-u)*(1-v)+hash2(xi+1,zi,s)*u*(1-v)+hash2(xi,zi+1,s)*(1-u)*v+hash2(xi+1,zi+1,s)*u*v;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
const rng=mulberry32(19840412);
const pick=a=>a[(rng()*a.length)|0];
const TAU=Math.PI*2;

/* ============================================================ world layout */
const BOUND=88, WATER_Y=0;
const POND={x:34,z:22,rx:22,rz:15};
const PX=0, PZ=-34;                        // pagoda center
const streamZ=x=>24+2.2*Math.sin((x-50)*0.09);
const inPond=(x,z)=>Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz)<1.02;

/* ============================================================ terrain height field */
function bump(x,z,cx,cz,r,h){return h*smooth(1.25,0.45,Math.hypot(x-cx,z-cz)/r);}
function heightAt(x,z){
  let h=2.2+vnoise(x*0.05,z*0.05,7)*1.8+vnoise(x*0.14,z*0.14,13)*0.7;
  h+=bump(x,z,PX,PZ,30,4.2);               // pagoda hill
  h+=bump(x,z,-62,-14,22,3.0);             // bamboo hill
  h+=bump(x,z,-56,48,15,-1.1);             // shrine hollow
  h=lerp(h,6,smooth(19,13,Math.hypot(x-PX,z-PZ)));       // pagoda plateau (flat)
  h=lerp(h,3,smooth(9,5,Math.hypot(x-62,z-2)));          // teahouse pad
  h=lerp(h,3,smooth(7,4,Math.hypot(x+50,z-46)));         // shrine pad
  h=lerp(h,5,smooth(9,6,Math.hypot(x+56,z+44)));         // zen pad
  const pd=Math.hypot((x-POND.x)/POND.rx,(z-POND.z)/POND.rz);
  h=lerp(h,-2.4,smooth(0.96,0.5,pd));      // pond bowl
  if(x>50){const sd=Math.abs(z-streamZ(x)); h=Math.min(h,lerp(h,-1.5,smooth(4.6,2.0,sd)*smooth(50,57,x)));}
  h+=bump(x,z,26,16,6.4,4.8);              // island rises out of bowl
  if(x>BOUND-2||z>BOUND-2||x<-BOUND+2||z<-BOUND+2)
    h-=smooth(BOUND-3,BOUND-1,Math.max(Math.abs(x),Math.abs(z)))*6;
  return h;
}
const GS=181, GI=v=>v+90;
const HH=new Int16Array(GS*GS), COV=new Int32Array(GS*GS);
for(let x=-BOUND;x<=BOUND;x++)for(let z=-BOUND;z<=BOUND;z++)
  HH[GI(x)*GS+GI(z)]=clamp(Math.floor(heightAt(x,z)+0.5),-3,26);
const surfH=(x,z)=>{x=clamp(Math.round(x),-BOUND,BOUND);z=clamp(Math.round(z),-BOUND,BOUND);return HH[GI(x)*GS+GI(z)];};
const covTop=(x,z,c)=>{if(x<-BOUND||x>BOUND||z<-BOUND||z>BOUND)return;
  if(HH[GI(x)*GS+GI(z)]>=0)COV[GI(x)*GS+GI(z)]=c;};
const pad=(x,z)=>{const y=surfH(x,z);return y>=0?y+1:1;};

/* ============================================================ voxel builder */
const PV=[],PE=[];
function addP(x,y,z,c){PV.push(x,y,z,(c>>16&255)/255,(c>>8&255)/255,(c&255)/255);}
function addE(x,y,z,c){PE.push(x,y,z,(c>>16&255)/255,(c>>8&255)/255,(c&255)/255);}
function box(x0,y0,z0,x1,y1,z1,c){
  if(typeof c!=="number"||![x0,y0,z0,x1,y1,z1].every(Number.isFinite))throw new Error("bad box args: "+[x0,y0,z0,x1,y1,z1,c].join(","));
  for(let x=Math.min(x0,x1);x<=Math.max(x0,x1);x++)
  for(let y=Math.min(y0,y1);y<=Math.max(y0,y1);y++)
  for(let z=Math.min(z0,z1);z<=Math.max(z0,z1);z++)addP(x,y,z,c);}
function blob(cx,cy,cz,rx,ry,rz,colorFn,seed,dens=0.92){
  const x0=Math.ceil(cx-rx),x1=Math.floor(cx+rx),y0=Math.ceil(cy-ry),y1=Math.floor(cy+ry),z0=Math.ceil(cz-rz),z1=Math.floor(cz+rz);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
    const d=Math.hypot((x-cx)/rx,(y-cy)/ry,(z-cz)/rz);
    if(d>1+0.14*(hash2(x,y+z*31,seed)-0.5)*2)continue;
    if(hash2(x*3,y*5+z,seed+9)>dens)continue;
    addP(x,y,z,colorFn(x,y,z,d));}}

/* ============================================================ palettes */
const GRASS=[0x5d9143,0x539038,0x69a24e,0x5b9a48,0x63a955];
const MOSS=[0x4c7a37,0x557f3c];
const DIRT=[0x5a4632,0x4e3c2b,0x66503a];
const STONE=[0xb3ab9d,0xa89f90,0xbdb5a8];
const ROCK=[0x8d8f94,0x7b7d82,0x9aa0a6,0x6f7276];
const REDW=[0xb23a2c,0xa03426,0xc04433], REDD=[0x7c2a1f,0x6e251b];
const CREAM=[0xefe3cb,0xe7d9be];
const ROOF=[0x2f3a56,0x28324b], ROOFU=0x1f2740;
const GOLD=0xd7a83c;
const BARK=[0x6b4a2f,0x5d4029,0x7a5537];
const CHERRY=[0xffd9e8,0xffc2dc,0xff9ec9,0xf47bab,0xe56b9d];
const WPK=[0xfff5f9,0xffffff];
const PINE=[0x2f5d3a,0x376b42,0x2a5234];
const MAPLE=[0xc74a2b,0xe06a35,0xa33227,0xd9552e,0xe88a3a];
const BAMBOO=[0x7aa53c,0x8ab54a,0x6f9a38], NODE=0xb6cf6e, LEAF=[0x527f2e,0x5e9134];
const SAND=0xe6dcc3, SANDLINE=0xcfc3a4, SANDRIM=0xd8cbab;
const WOOD=[0x8a6a45,0x7c5c3c], STONEBLK=0x9d9689;

/* ============================================================ paths */
const mainPath=[[0,88],[0,74],[0,60],[-3,48],[-2,34],[2,24],[1,10],[0,-6],[0,-16],[0,-25]];
const shorePath=[[2,24],[10,30],[20,34],[32,38],[44,37],[54,33],[61,30],[63,29]];
const bridgePath=[[63,29],[63,20],[62,12],[62,8]];
const westPath=[[-2,34],[-12,36],[-24,40],[-36,44],[-45,46],[-50,47]];
function segDist(x,z,pts){let d=1e9;
  for(let i=0;i<pts.length-1;i++){const[a,b]=pts[i],[c,e]=pts[i+1];
    const dx=c-a,dz=e-b,l2=dx*dx+dz*dz;const t=l2?clamp(((x-a)*dx+(z-b)*dz)/l2,0,1):0;
    d=Math.min(d,Math.hypot(x-(a+dx*t),z-(b+dz*t)));}return d;}

/* ============================================================ garden furniture */
const petalSpawns=[],smokeSrc=[],flames=[];
function rock(cx,cy,cz,s,seed){
  blob(cx,cy+s*0.45,cz,s,s*0.75,s*0.9,(x,y,z)=>{
    let c=ROCK[(hash2(x,y,z,seed)*ROCK.length)|0];
    if(y>cy+s*0.6&&hash2(x,y,z,seed+3)>0.55)c=0x5b8a44;
    return c;},seed,0.95);}
function stoneLantern(x,z,tall=1,glow=true){
  let y=pad(x,z);
  box(x-1,y,z-1,x+1,y,z+1,STONEBLK);y++;
  for(let i=0;i<1+tall;i++)addP(x,y+i,z,0x8b8478);y+=1+tall;
  box(x-1,y,z-1,x+1,y,z+1,0xb0a898);y++;
  const fireY=y+1;
  for(let fy=0;fy<3;fy++){const yy=y+fy;
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
      if(Math.max(Math.abs(a),Math.abs(b))!==1)continue;
      const win=fy===1&&(a===0||b===0);
      if(win&&glow)addE(x+a,yy,z+b,0xffcf87);
      else addP(x+a,yy,z+b,0x8d8578);}}
  y+=3;box(x-1,y,z-1,x+1,y,z+1,0xa79f90);addP(x,y+1,z,0xb6ae9d);
  if(glow)flames.push([x,fireY,z,0.9]);
  return[x,fireY,z];}
function cherryTree(cx,cz,scale,seed){
  const rnd=mulberry32(seed);let n=0;const tips=[],blobs=[];
  const grow=(x,y,z,dx,dy,dz,th,len,depth)=>{
    let px=x,py=y,pz=z,ddx=dx,ddy=dy,ddz=dz;
    for(let i=0;i<len;i++){
      for(let a=-th;a<=th;a++)for(let b=-th;b<=th;b++)
        if(Math.abs(a)+Math.abs(b)<=th)addP(Math.round(px+a),Math.round(py),Math.round(pz+b),BARK[(rnd()*3)|0]);
      px+=ddx;py+=ddy;pz+=ddz;
      ddx=clamp(ddx+(rnd()-0.5)*0.34,-0.72,0.72);ddz=clamp(ddz+(rnd()-0.5)*0.34,-0.72,0.72);
      if(rnd()<0.28)ddy=clamp(ddy+(rnd()-0.42)*0.2,0.16,0.92);
      const nl=2+((rnd()*3)|0);
      if(depth<3&&th>0&&rnd()<0.3&&i>len*0.25&&n<7){n++;
        grow(px,py,pz,ddx+(rnd()-0.5)*0.9,ddy*0.92+0.16,ddz+(rnd()-0.5)*0.9,th-1,nl,depth+1);}
      if(rnd()<0.22&&depth>0)ddy=clamp(ddy-0.3,0.06,0.92);}
    tips.push([px,py,pz]);};
  grow(cx,pad(cx,cz),cz,0,1,0,Math.max(1,Math.round(scale)),Math.round(5+6*scale),0);
  for(const[tx,ty,tz]of tips){
    const r=2+scale*2+rnd()*1.8;
    const ox=tx+(rnd()-0.5)*2.4,oy=ty+0.9+rnd()*1.6,oz=tz+(rnd()-0.5)*2.4;
    blobs.push([ox,oy,oz,r]);
    blob(ox,oy,oz,r,r*0.78,r,()=>{
      let c=CHERRY[(rnd()*CHERRY.length)|0];
      if(rnd()>0.93)c=WPK[(rnd()*2)|0];
      return c;},(seed+((rnd()*999)|0))|0,0.8);}
  for(const[bx,by,bz,br]of blobs){
    for(let i=0;i<br*3;i++){const a=rnd()*TAU,d=rnd()*br;
      const gx=Math.round(bx+Math.cos(a)*d),gz=Math.round(bz+Math.sin(a)*d);
      if(hash2(gx,gz,77)>0.45)covTop(gx,gz,hash2(gx,gz,78)>0.5?0xf0b8ce:0xffd9e8);}
    petalSpawns.push({x:bx,y:by,z:bz,r:br});}}
function pineTree(cx,cz,seed){
  const rnd=mulberry32(seed);const y=pad(cx,cz),H=6+((rnd()*3)|0);
  for(let i=0;i<H;i++){
    const off=Math.round(Math.sin(i*0.6)*0.6);
    addP(cx+off,y+i,cz,BARK[(rnd()*3)|0]);
    if(i>H*0.45){const dir=rnd()*TAU,L=2+((rnd()*2)|0);
      for(let b=1;b<=L;b++)
        addP(Math.round(cx+off+Math.cos(dir)*b),y+i-Math.round(b*0.25),Math.round(cz+Math.sin(dir)*b),0x5d4029);}}
  const layers=[[y+H+0.6,3.6],[y+H-1.4,4.4],[y+H-3.4,3.1]];
  for(const[ly,lr]of layers)
    blob(cx+rnd()*1.4-0.7,ly,cz+rnd()*1.4-0.7,lr,1.1,lr,
      (x,zz)=>PINE[(hash2(x,zz|0,seed)*PINE.length)|0],seed+(ly|0),0.88);}
function mapleTree(cx,cz,seed){
  const rnd=mulberry32(seed);const y=pad(cx,cz);
  for(let i=0;i<7;i++)for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)
    if(Math.abs(a)+Math.abs(b)<2)addP(cx+a,y+i,cz+b,0x4a3626);
  blob(cx,y+9.5,cz,4.4,3.2,4.4,(x,yy,z)=>MAPLE[(hash2(x,yy,z,seed)*MAPLE.length)|0],seed,0.85);
  blob(cx+2.4,y+7.6,cz-2.2,2.6,2,2.6,(x,yy,z)=>MAPLE[(hash2(x,yy,z,seed+5)*MAPLE.length)|0],seed+1,0.85);}
function bush(cx,cz,r,seed,flowerC){
  blob(cx,pad(cx,cz)+r*0.7,cz,r,r*0.75,r,(x,y,z)=>{
    if(flowerC&&hash2(x,y,z,seed+7)>0.62)return flowerC[(hash2(x,y,z,seed)*flowerC.length)|0];
    return hash2(x,y,z,seed)>0.78?MOSS[0]:0x3f6d33;},seed,0.9);}
function bambooCulm(cx,cz,seed){
  const rnd=mulberry32(seed);const H=14+((rnd()*8)|0);
  let x=cx,z=cz;const y=pad(cx,cz),lean=(rnd()-0.5)*0.13;
  for(let i=0;i<H;i++){
    const node=i%4===0;
    addP(Math.round(x),y+i,Math.round(z),node?NODE:BAMBOO[(rnd()*3)|0]);
    x+=lean;z+=lean*0.6;
    if(i>H*0.5&&rnd()<0.55){const dir=rnd()*TAU;
      for(let l=1;l<=3;l++)
        addP(Math.round(x+Math.cos(dir)*l*0.9),y+i+((l*0.4)|0),Math.round(z+Math.sin(dir)*l*0.9),LEAF[(rnd()*2)|0]);}}
  for(let l=0;l<8;l++){const a=rnd()*TAU,d=rnd()*1.7;
    addP(Math.round(x+Math.cos(a)*d),y+H+((rnd()*2)|0),Math.round(z+Math.sin(a)*d),LEAF[(rnd()*2)|0]);}}

/* ============================================================ five-story pagoda */
function buildPagoda(){
  const px=x=>x+PX,pz=z=>z+PZ,P=6;
  box(px(-8),P,pz(-8),px(8),P,pz(8),0xa9a190);
  box(px(-7),P+1,pz(-7),px(7),P+1,pz(7),0xb8b0a0);
  for(const sx of[-7,7])for(const sz of[-7,7])addP(px(sx),P+1,pz(sz),0xc9c1b1);
  // front steps + flanking stones & lanterns
  box(px(-2),P,pz(9),px(2),P,pz(10),0xbfb7a6);
  box(px(-2),P,pz(10),px(2),P,pz(11),0xb0a898);
  for(const sx of[-4,4])box(px(sx-1),P,pz(9),px(sx+1),P+1,pz(11),STONEBLK);
  stoneLantern(px(-5),pz(11));stoneLantern(px(5),pz(11));
  const half=[5,4,4,3,3],bh=[6,4,4,4,4];
  let y=P+2;
  for(let i=0;i<5;i++){
    const hw=half[i],front=i===0;
    // interior fill (visible through windows/door)
    box(px(-hw+1),y,pz(-hw+1),px(hw-1),y+bh[i]-1,pz(hw-1),0x241a12);
    for(let ly=0;ly<bh[i];ly++){
      const yy=y+ly;
      for(let a=-hw;a<=hw;a++)for(let b=-hw;b<=hw;b++){
        if(Math.max(Math.abs(a),Math.abs(b))!==hw)continue;
        if(front&&b===hw&&Math.abs(a)<=1&&ly>=1&&ly<=3)continue;   // doorway
        if(front&&b===hw&&Math.abs(a)<=1&&ly===4)continue;          // plaque slot
        const onA=Math.abs(a)===hw,t=onA?b:a;
        const pillar=Math.abs(t)===hw||((t+hw)%2===0&&ly>0&&ly<bh[i]-1);
        let c;
        if(ly===0)c=REDD[1];
        else if(ly===bh[i]-1)c=REDD[0];
        else if(pillar)c=Math.abs(t)===hw?REDD[0]:REDW[((a+b)&7)%3];
        else if(ly>1&&ly<bh[i]-2&&((t*5+ly*3+(onA?0:11))%4===0))c=0x394054;   // lattice window
        else c=CREAM[(a*b)&1];
        addP(px(a),yy,pz(b),c);}
    }
    if(front){
      addE(px(0),y+2,pz(-hw+1),0xffb45e);addE(px(0),y+1,pz(-hw+1),0xff9a45);
      addP(px(-1),y+4,pz(hw),0x243050);addP(px(0),y+4,pz(hw),0x243050);addP(px(1),y+4,pz(hw),0x243050);
      addE(px(0),y+4,pz(hw+1),0xd7a83c);
      for(const sx of[-2,2]){addP(px(sx),y+2,pz(hw+1),0xd9552e);addP(px(sx),y+3,pz(hw+1),0xe05a3a);}
    }
    const roofY=y+bh[i]+1;
    box(px(-hw-1),roofY-1,pz(-hw-1),px(hw+1),roofY-1,pz(hw+1),REDD[0]);      // eave beam slab
    for(const a of[-hw-1,hw+1])for(const b of[-hw-1,hw+1])addP(px(a),roofY-1,pz(b),0xc9973a);
    if(i>0){ // balcony deck, posts, continuous rail
      const r=hw+2;

  {t:0.88,top:0x0b1230,bot:0x1d2748,sun:0x39406a,si:0.15,hi:0.25,fog:0x161d38,amb:0x2a3350},
  {t:1.00,top:0x0b1230,bot:0x1d2748,sun:0x39406a,si:0.15,hi:0.25,fog:0x161d38,amb:0x2a3350}];
const kc=SKY_KEYS.map(k=>({...k,topC:new THREE.Color(k.top),botC:new THREE.Color(k.bot),
  sunC:new THREE.Color(k.sun),fogC:new THREE.Color(k.fog),ambC:new THREE.Color(k.amb)}));
const tmpC1=new THREE.Color(),tmpC2=new THREE.Color(),tmpC3=new THREE.Color();
let T=0.34,autoT=true,nightF=0,perfNow=0,petalBurst=0,cine=true,lastInput=-1e9;
function applyTime(){
  const ang=(T-0.25)*TAU,dn=Math.sin(ang);
  nightF=clamp(smooth(0.06,-0.22,dn),0,1);
  let a=kc[0],b=kc[1];
  for(let i=0;i<kc.length-1;i++)if(T>=kc[i].t&&T<=kc[i+1].t){a=kc[i];b=kc[i+1];break;}
  const f=smooth(0,1,(T-a.t)/Math.max(1e-4,b.t-a.t));
  skyU.top.value.copy(tmpC1.copy(a.topC).lerp(b.topC,f));
  skyU.bottom.value.copy(tmpC2.copy(a.botC).lerp(b.botC,f));
  scene.fog.color.copy(tmpC3.copy(a.fogC).lerp(b.fogC,f));
  scene.fog.density=lerp(0.0030,0.0040,nightF);
  hemi.intensity=lerp(a.hi,b.hi,f);
  sun.intensity=lerp(a.si,b.si,f);
  sun.color.copy(a.sunC).lerp(b.sunC,f);
  amb.intensity=lerp(0.45,0.62,nightF);amb.color.copy(a.ambC).lerp(b.ambC,f);
  sun.position.set(Math.cos(ang)*260,Math.sin(ang)*300+40,120);
  sun.target.position.set(0,6,0);
  sunDisc.position.set(Math.cos(ang)*460,Math.sin(ang)*500+60,200);
  sunDisc.material.opacity=clamp(dn*3,0,1);
  moonDisc.position.set(-Math.cos(ang)*460,-Math.sin(ang)*500+60,-200);
  moonDisc.material.opacity=clamp(-dn*2.6,0,1);
  starPts.material.opacity=clamp((nightF-0.25)*1.4,0,1);
  fireflies.material.opacity=clamp((nightF-0.35)*1.6,0,1)*0.95;
  smoke.material.opacity=smokeSrc.length?lerp(0.5,0.28,nightF):0;
  doorLight.intensity=nightF*300;bigLanternLight.intensity=nightF*160;
  for(const h of halos)h.material.opacity=nightF*(0.55+0.3*Math.sin(perfNow*0.004+h.position.x));
  const lbl=((T-0.25)*24+6+24)%24,hh=Math.floor(lbl),mm=Math.floor((lbl%1)*60);
  document.getElementById('clockLbl').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
  document.getElementById('clock').value=T;}

/* ============================================================ main loop */
const dum=new THREE.Object3D(),wcol=new THREE.Color();
function tick(now){
  requestAnimationFrame(tick);
  const dt=Math.min(0.05,(now-perfNow)/1000||0.016);perfNow=now;
  const t=now/1000;
  if(autoT)T=(T+dt/150)%1;
  applyTime();
  // water ripple + sparkle
  for(let i=0;i<waterN;i++){
    const x=waterCells[i*2],z=waterCells[i*2+1];
    const w=Math.sin(t*1.7+x*0.45+z*0.32)+0.5*Math.sin(t*2.6-x*0.6+z*0.5);
    dum.position.set(x,WATER_Y+w*0.10,z);dum.updateMatrix();water.setMatrixAt(i,dum.matrix);
    const s=w>(nightF>0.5?0.55:1.2)?(nightF>0.5?0.5:0.4):0;
    wcol.setRGB(0.16*(1-nightF*0.6)+s*0.8,0.38*(1-nightF*0.5)+s*0.9,0.60*(1-nightF*0.4)+s*0.85);water.setColorAt(i,wcol);}
  water.instanceMatrix.needsUpdate=true;if(water.instanceColor)water.instanceColor.needsUpdate=true;
  // petals
  if(petalBurst>0)petalBurst-=dt;
  const gust=petalBurst>0?2.4:1;
  const windX=(Math.sin(t*0.13)*1.4+0.7)*gust,windZ=(Math.cos(t*0.11)*1.1+0.4)*gust;
  for(let i=0;i<PET_N;i++){const p=pp[i];
    p[3]+=dt*(1.5+p[6]*18)*gust;
    p[0]+=(windX+Math.sin(p[5]+t*1.4)*0.9)*dt*p[4];
    p[2]+=(windZ+Math.cos(p[5]+t*1.1)*0.8)*dt*p[4];
    p[1]-=dt*p[4]*1.7*gust;
    if(p[1]<surfH(clamp(p[0]|0,-BOUND,BOUND),clamp(p[2]|0,-BOUND,BOUND))||
       Math.abs(p[0])>BOUND||Math.abs(p[2])>BOUND)spawnPetal(p,petalBurst>0);
    dum.position.set(p[0],p[1],p[2]);
    dum.rotation.set(p[3],p[3]*0.7+p[5],p[3]*0.4);
    dum.scale.set(0.34,0.06,0.24);dum.updateMatrix();petals.setMatrixAt(i,dum.matrix);}
  petals.instanceMatrix.needsUpdate=true;
  // koi
  for(const d of koiDefs){
    const a=d.ph+t*d.spd*TAU/6;
    d.mesh.position.set(d.cx+Math.cos(a)*d.rx,WATER_Y-0.32+Math.sin(t*2+a)*0.10,d.cy+Math.sin(a)*d.rx*0.72);
    d.mesh.rotation.y=-a+Math.PI/2+Math.sin(t*4)*0.08;
    d.mesh.rotation.z=Math.sin(t*5+a)*0.12;}
  // clouds drift
  for(const c of clouds){c.m.position.x+=dt*c.spd;if(c.m.position.x>170)c.m.position.x=-170;}
  // birds
  for(const b of birds){b.ang+=dt*b.spd;
    b.m.position.set(Math.cos(b.ang)*b.r,b.y+Math.sin(t*0.7+b.ph)*3,Math.sin(b.ang)*b.r*0.8);
    b.m.rotation.y=-b.ang;}
  // fireflies
  if(fireflies.material.opacity>0.01){
    for(let i=0;i<FFN;i++){const b=ffBase[i];
      ffPos[i*3]=b[0]+Math.sin(t*0.5+b[3])*2.2;
      ffPos[i*3+1]=b[1]+Math.sin(t*0.9+b[4])*1.1;
      ffPos[i*3+2]=b[2]+Math.cos(t*0.6+b[5])*2.2;}
    ffGeo.attributes.position.needsUpdate=true;}
  // smoke
  if(smoke.material.opacity>0.01&&smokeSrc.length){
    for(let i=0;i<SMN;i++){const p=smState[i];p.life+=dt*0.32;if(p.life>1)p.life=0;
      const s=smokeSrc[p.src];
      smPos[i*3]=s[0]+Math.sin(p.life*6+p.seed)*0.7*p.life;
      smPos[i*3+1]=s[1]+p.life*6;
      smPos[i*3+2]=s[2]+Math.cos(p.life*5+p.seed*2)*0.6*p.life;}
    smokeGeo.attributes.position.needsUpdate=true;}
  // shishi-odoso tipping cycle
  const ph=(t%5.2)/5.2;
  shishi.rotation.z=ph<0.55?-ph*ph*1.6:ph<0.62?-(0.55*0.55*1.6)+(ph-0.55)*14:-0.3+((1-ph)/0.38)*0.3;
  controls.autoRotate=cine&&(now-lastInput>2500);controls.autoRotateSpeed=0.6;
  controls.update();
  renderer.render(scene,camera);}

document.getElementById('autoBtn').addEventListener('click',e=>{autoT=!autoT;e.target.classList.toggle('on',autoT);});
document.getElementById('gustBtn').addEventListener('click',()=>{petalBurst=4.5;});
document.getElementById('cineBtn').addEventListener('click',e=>{cine=!cine;e.target.classList.toggle('on',cine);});
const views=[[98,62,122,0,14,0],[-42,30,66,4,12,24],[63,16,46,2,10,24],[8,52,20,0,26,-34],[-70,26,60,-50,8,44]];
addEventListener('keydown',e=>{
  if(e.key==='h'||e.key==='H'){document.getElementById('panel').classList.toggle('hidden');document.getElementById('title').classList.toggle('hidden');}
  if(e.key==='c'||e.key==='C'){cine=!cine;document.getElementById('cineBtn').classList.toggle('on',cine);}
  if(e.key==='g'||e.key==='G')petalBurst=4.5;
  if(e.key==='r'||e.key==='R'){camera.position.set(98,62,122);controls.target.set(0,14,0);}
  const n=parseInt(e.key);if(n>=1&&n<=views.length){const v=views[n-1];
    camera.position.set(v[0],v[1],v[2]);controls.target.set(v[3],v[4],v[5]);}
  if(e.key==='t'||e.key==='T'){autoT=!autoT;document.getElementById('autoBtn').classList.toggle('on',autoT);}
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

const totalVox=PV.length/6+PE.length/6+waterN+PET_N;
document.getElementById('stats').textContent=
  `${(totalVox/1000).toFixed(1)}k voxels · ${petalSpawns.length} blossom canopies · three.js`;
window.__voxelCount=totalVox;
requestAnimationFrame(tick);
</script>
</body>
</html>
