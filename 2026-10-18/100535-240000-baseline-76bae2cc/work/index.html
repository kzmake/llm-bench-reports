<!DOCTYPE html>
<html lang="en">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0e1a;font-family:'Hiragino Sans','Yu Gothic UI','Segoe UI',system-ui,sans-serif;}
  #app{position:fixed;inset:0;}
  .panel{position:fixed;top:16px;left:16px;z-index:10;color:#f4efe6;
    background:rgba(18,20,32,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 16px;width:236px;
    box-shadow:0 8px 32px rgba(0,0,0,.45);transition:opacity .3s;}
  .panel h1{margin:0 0 2px;font-size:15px;font-weight:700;letter-spacing:.5px;}
  .panel .sub{margin:0 0 10px;font-size:10.5px;opacity:.65;letter-spacing:.4px;}
  .row{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px;}
  .row label{flex:1;opacity:.9;}
  .row .val{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;opacity:.8;font-size:11px;}
  input[type=range]{width:120px;accent-color:#f2a0c0;cursor:pointer;}
  input[type=checkbox]{accent-color:#f2a0c0;cursor:pointer;transform:scale(1.1);}
  .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .btns button{flex:1 1 44%;font-size:11px;padding:6px 4px;border-radius:8px;cursor:pointer;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#f4efe6;
    transition:background .15s;letter-spacing:.3px;}
  .btns button:hover{background:rgba(255,255,255,.2);}
  .btns button.wide{flex-basis:100%;}
  .hint{margin-top:10px;font-size:10px;opacity:.5;line-height:1.5;}
  .credit{position:fixed;bottom:10px;right:14px;z-index:10;color:rgba(255,255,255,.5);font-size:10px;letter-spacing:.5px;}
  #loader{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#0a0e1a;color:#f4efe6;font-size:14px;letter-spacing:2px;flex-direction:column;gap:12px;transition:opacity .6s;}

</style>

<body>
<div id="app"></div>

<div class="panel" id="panel">
  <h1>桜の庭 · Pagoda Garden</h1>
  <p class="sub">a voxel meditation — five-storied pagoda, koi pond &amp; sakura</p>
  <div class="row"><label>時刻 · Time of day</label><span class="val" id="tval">10.2h</span></div>
  <div class="row"><input type="range" id="time" min="0" max="24" step="0.05" value="10.2" style="width:100%"></div>
  <div class="row"><label>昼夜 Cycle day↔night</label><input type="checkbox" id="cycle"></div>
  <div class="row"><label>桜吹雪 Petal storm</label><input type="checkbox" id="petals" checked></div>
  <div class="row"><label>回転 Auto-orbit</label><input type="checkbox" id="orbit" checked></div>
  <div class="btns">
    <button data-preset="hero">全景 Overview</button>
    <button data-preset="pagoda">五重塔 Pagoda</button>
    <button data-preset="pond">池 Pond &amp; Koi</button>
    <button data-preset="sakura">桜 Sakura</button>
    <button data-preset="torii">鳥居 Torii</button>
    <button data-preset="aerial">俯瞰 Aerial</button>
    <button class="wide" id="shot">📷 撮影 Save PNG</button>
  </div>
  <div class="hint">drag orbit · scroll zoom · right-drag pan<br>keys: H hide UI · C cycle · R rotate · P petals</div>
</div>
<div class="credit">built with three.js · ~35k instanced voxels · no textures, all light</div>
<div id="loader"><div class="pet">🌸</div><div id="loadmsg">planting voxels…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. UTILITIES — deterministic RNG, color math
   ============================================================ */
let _s = 0xC0FFEE ^ 0x9E3779B9;
function R(){ _s |= 0; _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s>>>15), 1|_s);
  t = (t + Math.imul(t ^ (t>>>7), 61|t)) ^ t; return ((t ^ (t>>>14)) >>> 0) / 4294967296; }
const rr = (a,b)=> a + R()*(b-a);
const ri = (a,b)=> Math.floor(rr(a,b+1));
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));
const smooth = (e0,e1,x)=>{ const t = clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
function hash2(x,z){ const n = Math.sin(x*127.1 + z*311.7) * 43758.5453; return n - Math.floor(n); }
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function mix(a,b,t){ return _c1.setHex(a).lerp(_c2.setHex(b),t).getHex(); }
function shade(a,f){ return _c1.setHex(a).multiplyScalar(f).getHex(); }
function jit(hex,amt){ return shade(hex, 1 + (R()-0.5)*amt); }

/* palette */
const C = {
  grass:[0x77ab50,0x83b75a,0x6f9f4a,0x7db054,0x669646],
  dirt:0x6b4f35, dirtD:0x5a4128,
  stone:[0xb0aca0,0xa8a496,0xbab6aa,0x9c988c],
  stoneL:0xc9c5b8, stoneD:0x8e8a7e, curb:0xa49f92,
  slabA:0xb7b3a6, slabB:0x9a968a,
  sand:0xe6e0cc, sandDark:0xcfc6a8, moss:0x4f7a35, mossL:0x5f8a3c,
  plaster:0xefe6d3, plasterD:0xd9cfba,
  woodD:0x4a3222, woodM:0x6f4b2e, woodR:0x8a4a2c,
  lacquer:0xb5432f, lacquerD:0x7e2f27, vermilion:0xc4382b, vermD:0x8f2f20,
  roof:0x3d4759, roofD:0x2b3243, roofL:0x4d5a70,
  gold:0xd9a63f, goldD:0xa8781f, bronze:0x9c7a3c,
  ink:0x23293a, inkD:0x161a26,
  trunk:0x5a3d2e, trunkD:0x46301f, bark:0x6e4a33,
  sakura:[0xf2a8c4,0xef93b4,0xf7c1d4,0xfbd0df,0xe885aa,0xf9b7cd],
  leaf:[0x4e8f3a,0x5da246,0x3f7d31,0x69ad52],
  pine:[0x2f5d33,0x3d7240,0x4c8549,0x35683a],
  maple:[0xd1452c,0xe06a2f,0xc23a2a,0xe8903a,0xb8332b],
  wLeaf:0x86b04a, wLeafD:0x6e9640,
  bamboo:[0x5f9e3f,0x74b44c,0x4e8a36], bambooN:0x3f7030, bambooShoot:0xd8cfa8,
  water:0x2f86c2, waterD:0x2a6ea0, mud:0x2f4a3a, deep:0x1d3a52,
  lily:0x4f9e4a, lilyL:0x63b25a,
  glow:0xffd9a0, glowW:0xfff3d0, jewel:0xffe9b0,
  iris:[0x5a6fd0,0x7a5fc8,0x4a86d8],
  flower:[0xd94141,0xe8c33a,0xf2f2f2,0x8e6bc6,0xef7fa8,0xffa63f],
  koi:[0xe2571f,0xf2f2f2,0x22262a,0xe8b23a],
  petalGround:[0xf6c6d8,0xf9d8e6,0xf2aec8],
  shoji:0xf4ead0, shadowWin:0x2a2118,
};

/* ============================================================
   1. WORLD DATA — voxel lists + terrain grids
   ============================================================ */
const S = [];   // static voxels {x,y,z,c}
const W = [];   // water cells {x,z,phase}
const G = [];   // glow voxels {x,y,z,c}
const lanternPts = [];  // {x,y,z} halo positions
const petalSpots = [];  // cherry tree centers for petal/butterfly spawn

function add(a,x,y,z,c){ a.push({x,y,z,c}); }
function box(a,x1,y1,z1,x2,y2,z2,c){
  for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)
  for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)
  for(let z=Math.min(z1,z2);z<=Math.max(z1,z2);z++) add(a,x,y,z,c);
}
function sphere(a,cx,cy,cz,r,fn){
  const R2=r*r;
  for(let x=Math.floor(cx-r);x<=Math.ceil(cx+r);x++)
  for(let y=Math.floor(cy-r);y<=Math.ceil(cy+r);y++)
  for(let z=Math.floor(cz-r);z<=Math.ceil(cz+r);z++){
    const d=(x-cx)**2+(y-cy)**2+(z-cz)**2;
    if(d<=R2){ const c=fn(x,y,z,Math.sqrt(d)/r); if(c) add(a,x,y,z,c); }
  }
}

/* --- terrain: features stamped into a grid, then heights, then emitted --- */
const GS = 128, OFF = GS>>1;          // coords x,z in [-64,63]
const F = { NONE:0, WATER:1, PATH:2, ZEN:3, PLATEAU:4, SAND:5 };
const feat = [], hm = [];
for(let i=0;i<GS;i++){ feat.push(new Uint8Array(GS)); hm.push(new Uint8Array(GS)); }
const fx = x => x + OFF, fz = z => z + OFF;
const inB = (xi,zi)=> xi>=0 && zi>=0 && xi<GS && zi<GS;
const featAt = (x,z)=> inB(fx(x),fz(z)) ? feat[fx(x)][fz(z)] : F.NONE;
const isWater = (x,z)=> featAt(x,z)===F.WATER;
function stamp(xi,zi,f,h){ if(inB(xi,zi)){ feat[xi][zi]=f; if(h!==undefined) hm[xi][zi]=h; } }

function distSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, L=dx*dx+dz*dz;
  let t = L ? ((px-ax)*dx+(pz-az)*dz)/L : 0; t = clamp(t,0,1);
  const qx=ax+dx*t-px, qz=az+dz*t-pz; return Math.hypot(qx,qz);
}

/* pond: main blob + west inlet (the red bridge spans the inlet) */
const POND = {x:28,z:2};
function pondR(th){ return 8.6 + 2.7*Math.sin(3*th+1.7) + 1.4*Math.sin(5*th+0.5) + 1.0*Math.sin(2*th-1.1); }
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  const th = Math.atan2(z-POND.z, x-POND.x), d = Math.hypot(x-POND.x, z-POND.z);
  const inBlob = d < pondR(th);
  const inInlet = distSeg(x,z, 21,3, 11,7) < 2.7 || distSeg(x,z, 21,3, 24,2) < 3.4;
  if(inBlob || inInlet) stamp(fx(x),fz(z), F.WATER);
}
/* island in the pond */
for(let x=25;x<=31;x++) for(let z=6;z<=11;z++)
  if(Math.hypot(x-28,z-8.5) < 2.6) stamp(fx(x),fz(z), F.NONE);

/* winding stone path: torii (0,44) → pagoda steps (-14,-5) */
const PATH = [[0,47],[1,40],[3,33],[-1,27],[-7,21],[-10,13],[-12,4],[-13,-3],[-13,-5]];
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  let dmin = 1e9;
  for(let i=0;i<PATH.length-1;i++) dmin = Math.min(dmin, distSeg(x,z, ...PATH[i], ...PATH[i+1]));
  if(dmin < 2.0 && featAt(x,z)===F.NONE) stamp(fx(x),fz(z), F.PATH);
}
/* spur path: main path → zen garden → across to pond bridge west end */
const SPUR = [[-8,15],[-14,17],[-22,19],[-30,20],[-36,21]];
const SPUR2 = [[-2,26],[4,27],[10,27],[15,27],[16,20],[16,10],[16,8]];
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  if(featAt(x,z)!==F.NONE) continue;
  let d1=1e9,d2=1e9;
  for(let i=0;i<SPUR.length-1;i++) d1=Math.min(d1,distSeg(x,z,...SPUR[i],...SPUR[i+1]));
  for(let i=0;i<SPUR2.length-1;i++) d2=Math.min(d2,distSeg(x,z,...SPUR2[i],...SPUR2[i+1]));
  if(d1<1.6 || d2<1.5) stamp(fx(x),fz(z), F.PATH);
}
/* pagoda plateau (2 voxels high) */
for(let x=-26;x<=-6;x++) for(let z=-26;z<=-6;z++){
  if(Math.abs(x+16)<=10 && Math.abs(z+16)<=10) stamp(fx(x),fz(z), F.PLATEAU, 2);
}
/* zen rock garden */
for(let x=-56;x<=-38;x++) for(let z=14;z<=32;z++)
  if(featAt(x,z)===F.NONE) stamp(fx(x),fz(z), F.ZEN);
/* sand ring around pond shore for soft transition */
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  if(featAt(x,z)!==F.NONE) continue;
  let near=false;
  for(let dx=-1;dx<=1&&!near;dx++) for(let dz=-1;dz<=1;dz++){
    if(featAt(x+dx,z+dz)===F.WATER){ near=true; break; }
  }
  if(near && R()<0.5) stamp(fx(x),fz(z), F.SAND);
}

/* gentle hills near the map edges (never on built features) */
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  const f = featAt(x,z);
  if(f===F.PLATEAU || f===F.PATH || f===F.WATER || f===F.ZEN) continue;
  const edge = smooth(44,62, Math.max(Math.abs(x),Math.abs(z)));
  const n = 0.5+0.5*Math.sin(x*0.11)*Math.cos(z*0.083+1.3);
  hm[fx(x)][fz(z)] = edge>0.4 ? (n>0.66?2:(n>0.4?1:0)) : (n>0.85?1:0);
}
const groundY = (x,z)=>{ const f=featAt(x,z); if(f===F.PLATEAU) return 2; if(f===F.WATER) return 0; return hm[fx(x)]?.[fz(z)] ?? 0; };

/* ---- emit ground ---- */
const ZEN_ROCKS = [[-50,21],[-43,26],[-49,30]];
function topColor(x,z,f){
  if(f===F.PATH){ const v=(x+z); return v%3===0 ? C.slabB : C.stone[(Math.abs(hash2(x*7,z*3)*4)|0)%4]; }
  if(f===F.WATER) return C.mud;
  if(f===F.PLATEAU){ const v=((x+z)&1)? C.stoneL : C.stone[0]; return (Math.abs(x+16)===10||Math.abs(z+16)===10)? C.curb : v; }
  if(f===F.ZEN){ let c=C.sand, dmin=1e9;
    for(const [rx,rz] of ZEN_ROCKS) dmin=Math.min(dmin, Math.hypot(x-rx,z-rz));
    const fr = (dmin/1.7)%1;
    if(fr<0.4) c=C.sandDark;
    if(x===-56||x===-38||z===14||z===32) c=C.moss;
    return c; }
  if(f===F.SAND) return jit(0xd9cfae,0.1);
  const h = hm[fx(x)][fz(z)];
  return C.grass[(hash2(x*3.7,z*9.1)*5)|0 % 5] ?? C.grass[0];
}
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  const f = featAt(x,z);
  if(f===F.WATER){ add(S,x,-1.4,z, mix(C.mud,C.deep, hash2(x,z))); continue; }
  const h = groundY(x,z);
  const top = topColor(x,z,f);
  add(S,x,h-0.5,z, f===F.NONE? jit(top,0.08) : top);
  for(let k=h;k>=1;k--) add(S,x,k-0.5-1,z, k===1&&h>0? jit(C.dirt,0.1): shade(C.dirt,0.92));
}
/* water voxels */
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++)
  if(featAt(x,z)===F.WATER) W.push({x,z,phase: hash2(x*1.3,z*2.1)*Math.PI*2});
for(let x=-64;x<64;x++) for(let z=-64;z<64;z++){
  if(featAt(x,z)!==F.WATER) continue;
  let rim=false;
  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nf=featAt(x+dx,z+dz);
    if(nf!==F.WATER && nf!==F.SAND) rim=true;
  }
  if(rim) add(S,x,-0.35+0.65,z, C.stone[(hash2(x*11,z*5)*4)|0%4]);
}

/* ============================================================
   2. BUILDERS — architecture & props
   ============================================================ */
function roof(cx,cz,y,halfW,o={}){
  const {tile=C.roof, trim=C.gold, layers=3, tip=true} = o;
  for(let l=0;l<layers;l++){
    const H=halfW-l;
    if(H<0) break;
    for(let dx=-H;dx<=H;dx++) for(let dz=-H;dz<=H;dz++){
      if(Math.max(Math.abs(dx),Math.abs(dz))!==H) continue;
      const corner = Math.abs(dx)===H && Math.abs(dz)===H;
      const onEdge = (dz===-H)||(dz===H&&l===0);
      const c = corner||(onEdge&&l===0) ? trim : (l===layers-1 ? (dx===0&&dz===0?trim:jit(C.roofD,0.12)) : jit(tile,0.12));
      add(S,cx+dx,y+l,cz+dz,c);
    }
    if(tip && l===0){ // upturned eave tips
      for(const sx of [-1,1]) for(const sz of [-1,1]){
        add(S,cx+sx*(halfW+1),y+1,cz+sz*(halfW+1),trim);
        add(S,cx+sx*(halfW),y+1,cz+sz*(halfW),shade(tile,1.1));
      }
    }
  }
  const top = halfW-(layers-1);
  if(top<=1) for(let dx=-top;dx<=top;dx++) for(let dz=-top;dz<=top;dz++) add(S,cx+dx,y+layers-1+1,cz+dz,trim);
  // eave underside brackets
  for(let dx=-halfW+1;dx<=halfW-1;dx++){
    add(S,cx+dx,y-1,cz-halfW+1,C.woodR); add(S,cx+dx,y-1,cz+halfW-1,C.woodR);
  }
  for(let dz=-halfW+1;dz<=halfW-1;dz++){
    add(S,cx-halfW+1,y-1,dz+cz,C.woodR); add(S,cx+halfW-1,y-1,dz+cz,C.woodR);
  }
}

function pagoda(cx,cz){
  const B=2; // plateau surface y
  // balustrade around plateau (gap at south entrance)
  for(let i=-10;i<=10;i+=2){
    for(const [bx,bz] of [[cx+i,cz-10],[cx+i,cz+10],[cx-10,cz+i],[cx+10,cz+i]]){
      if(Math.abs(bx-cx)<=3 && bz===cz+10) continue;   // stair gap
      add(S,bx,B+0.5,bz, i%4===0? C.stoneL : C.stoneD);
      if(i%4===0) add(S,bx,B+1.5,bz,C.gold);
    }
  }
  // stone plinth
  box(S,cx-7,2.5,cz-7,cx+7,2.5,cz+7,C.stoneL);
  // steps down to garden, south side
  for(let s=0;s<2;s++){ box(S,cx-3,B-1-s,cz+11+s*2,cx+3,B-1-s,cz+12+s*2, C.stoneL); }
  box(S,cx-4,0.5,cz+10,cx+4,B-0.6,cz+10,C.stone[0]); // stair cheek
  // side lanterns at stair foot
  stoneLantern(cx-6, 0, cz+12); stoneLantern(cx+6, 0, cz+12);

  let y = B+1;
  const stories=[[13,5],[11,4],[9,4],[7,3],[5,3]];
  stories.forEach(([w,h],idx)=>{
    const hw=(w-1)/2;
    // walls (hollow shell)
    for(let dx=-hw;dx<=hw;dx++) for(let dz=-hw;dz<=hw;dz++){
      const edge = Math.abs(dx)===hw || Math.abs(dz)===hw;
      if(!edge) continue;
      for(let k=0;k<h;k++){
        const yy=y+k;
        let c = idx===0 && k<1 ? C.woodM : C.plaster;
        if(k===h-1 || k===0) c = C.woodD;                         // beams top & bottom
        if(Math.abs(dx)===hw && Math.abs(dz)===hw) c = C.woodD;   // corner posts
        if((dx+idx)%4===0 && (dz+idx)%4===0 && k>0 && k<h-1) c = mix(c,C.woodM,0.35);
        add(S,cx+dx,yy,cz+dz, jit(c,0.05));
      }
    }
    // corner timber mid-posts
    for(let s=-1;s<=1;s+=2) for(let t=-1;t<=1;t+=2)
      for(let dx of [0]) { add(S,cx+s*hw,y+1,cz+t*hw,C.woodD); add(S,cx+s*hw,y+2,cz+t*hw,C.woodD); }
    // entrance door (story 0, +z face) + bronze bell frame
    if(idx===0){
      box(S,cx-1,y,cz+hw+0.001,cx+1,y+2,cz+hw,C.lacquerD);
      for(let k=0;k<=2;k+=2) for(let d=-1;d<=1;d+=2) add(S,cx+d,y+k,cz+hw+0.51,C.gold);
      add(G,cx,y+3,cz+hw+0.001,C.shadowWin);
      box(S,cx-2,y,cz+hw+2,cx-2,y+3,cz+hw+2,C.woodD); box(S,cx+2,y,cz+hw+2,cx+2,y+3,cz+hw+2,C.woodD);
      box(S,cx-2,y+4,cz+hw+2,cx+2,y+4,cz+hw+2,C.woodD);
      add(S,cx,y+3,cz+hw+2,C.bronze); add(S,cx,y+2,cz+hw+2,shade(C.bronze,0.85)); // hanging bell
    }
    // windows: timber frame + shoji glow, per story per face
    for(let f=0;f<4;f++) for(let d=-hw+2; d<=hw-2; d+=3){
      if(idx===0 && f===2 && Math.abs(d)<=1) continue; // door gap
      const X = f===0? cx+d : f===1? cx+hw : f===2? cx+d : cx-hw;

        if(Math.max(Math.abs(dx),Math.abs(dz))!==hw+1) continue;

      }
    }

    for(let dx=-bw;dx<=bw;dx++){ add(S,cx+dx,y+h,cz-bw,(dx%2===0)?C.lacquer:C.goldD); add(S,cx+dx,y+h,cz+bw,(dx%2===0)?C.lacquer:C.goldD); }
    for(let dz=-bw;dz<=bw;dz++){ add(S,cx-bw,y+h,cz+dz,(dz%2===0)?C.lacquer:C.goldD); add(S,cx+bw,y+h,cz+dz,(dz%2===0)?C.lacquer:C.goldD); }
    // roof

    // lanterns under eaves at roof tips

  });

function bridge(x,z0,z1,hMax){ // runs along z
  const len=z1-z0;
  for(let i=0;i<=len;i++){
    const t=i/len, yb = groundY(x,Math.round(z0+i)) ;
    const ay = Math.round(-0.2 + hMax*Math.sin(Math.PI*t));
    for(const dx of [-1,0,1]) for(const dz of [0])
      add(S,x+dx,ay+0.15,z0+i, dx===0? jit(C.lacquer,0.1): C.lacquer);
    add(S,x,ay-0.85,z0+i,C.woodD);
    if(i%2===0){ for(const s of [-1,1]){ add(S,x+s*1,ay+1.2,z0+i,C.vermD); add(S,x+s*1,ay+2.2,z0+i,C.vermD);} }
    for(const s of [-1,1]) add(S,x+s*1,ay+2.7+Math.round(0.5*Math.sin(Math.PI*t)),z0+i,C.vermD);
    if(i===0||i===len){ add(S,x-1,ay+2.5,z0+i,C.gold); add(S,x+1,ay+2.5,z0+i,C.gold); }
  }
  // supports at ends
  add(S,x-1,-0.5,z0,C.stoneD); add(S,x+1,-0.5,z0,C.stoneD);
  add(S,x-1,-0.5,z1,C.stoneD); add(S,x+1,-0.5,z1,C.stoneD);
}

function cherry(x,z,sc=1){
  const y0=groundY(x,z);
  petalSpots.push({x,y:y0,z, r: 9*sc});
  const tips=[];
  function branch(px,py,pz,dx,dy,dz,len,rad,depth){
    for(let i=0;i<len;i++){
      dx+=(R()-0.5)*0.34; dz+=(R()-0.5)*0.34; dy=Math.max(0.16,dy+(R()-0.5)*0.12);
      const l=Math.hypot(dx,dy,dz); dx/=l;dy/=l;dz/=l;
      px+=dx;py+=dy;pz+=dz;
      const r2=Math.max(0.4,rad*(1-i/len));
      const c = R()<0.5? C.trunk : C.bark;
      if(r2>0.75) box(S,Math.round(px-r2*0.5),Math.round(py),Math.round(pz-r2*0.5),Math.round(px+r2*0.5),Math.round(py),Math.round(pz+r2*0.5),c);
      else add(S,Math.round(px),Math.round(py),Math.round(pz),c);
      if(depth>0 && i>len*0.5 && R()<0.3){
        const s=R()<0.5?1:-1;
        branch(px,py,pz, s*rr(0.6,1), rr(0.8,1.3), s*rr(0.2,0.9), Math.max(3,len*0.5), rad*0.62, depth-1);
      }
    }
    if(depth===0) tips.push([px,py,pz]); else tips.push([px,py,pz]);
  }
  branch(x,y0+0.5,z, rr(-0.3,0.3),1.25,rr(-0.3,0.3), Math.round(6*sc), Math.round(2.2*sc), 2);
  for(const [tx,ty,tz] of tips){
    const n=ri(1,2);
    for(let i=0;i<n;i++)
      blobSakura(tx+rr(-2,2), ty+rr(0.5,2.6), tz+rr(-2,2), rr(2.1,3.4)*sc*0.8);
  }
}
function blobSakura(x,y,z,r){
  for(let dx=Math.floor(-r);dx<=r;dx++) for(let dy=Math.floor(-r*0.7);dy<=r*0.8;dy++) for(let dz=Math.floor(-r);dz<=r;dz++){
    const d=Math.sqrt(dx*dx+dy*dy*1.8+dz*dz);
    if(d>r || (d>r*0.55 && R()<d/(r*1.7))) continue;
    const c = C.sakura[(hash2((x+dx)*5.1,(z+dz)*3.7+(y+dy)*2)*6)|0 % 6];
    add(S,Math.round(x)+dx,Math.round(y)+dy,Math.round(z)+dz, c);
  }
}

function pine(x,z,sc=1){
  const y0=groundY(x,z), h=Math.round(7*sc);
  let px=x,pz=z;
  for(let k=0;k<=h;k++){ if(R()<0.25){px+=R()<0.5?-1:1;} if(R()<0.2){pz+=R()<0.5?-1:1;}
    add(S,px,y0+k,pz, R()<0.5?C.trunk:C.trunkD); add(S,x,y0+k,z,R()<0.3?C.trunk:C.trunkD); }
  const clouds=[[3,3.4],[5,3],[6.6,2.3],[h,1.8]];
  for(const [cy,cr] of clouds){
    const yy=y0+Math.round(cy*sc);
    for(let dx=-cr;dx<=cr;dx++) for(let dz=-cr;dz<=cr;dz++){
      const d=Math.hypot(dx,dz); if(d>cr*sc) continue;
      if(d>cr*sc*0.6 && R()<0.4) continue;
      add(S,px+dx,yy,pz+dz, C.pine[(hash2((px+dx)*2,(pz+dz)*5+yy)*4)|0]);
      if(R()<0.16) add(S,px+dx,yy+1,pz+dz, C.pine[2]);
    }
  }
}

function maple(x,z,sc=1){

function blobMaple(x,y,z,r){

function willow(x,z){

function bambooGrove(x0,z0,n){
  const y0=groundY(x0,z0);
  for(let i=0;i<n;i++){
    const x=x0+ri(-6,8), z=z0+ri(-6,8);
    if(featAt(x,z)===F.WATER||featAt(x,z)===F.PATH||featAt(x,z)===F.PLATEAU) continue;
    const gy=groundY(x,z);
    const h=ri(7,12);
    let px=x,pz=z;
    for(let k=0;k<h;k++){
      if(k%3===2){ px+=R()<0.5?0:1; }
      add(S,px,gy+0.5+k,pz, k%4===3? C.bambooN : C.bamboo[(k+px)%3]);
      if(k>h*0.55 && R()<0.3) add(S,px+1,gy+0.5+k,pz,C.bamboo[1]);
    }
    // leaf spray at crown
    for(let dx=-2;dx<=2;dx++) for(let dy=0;dy<=2;dy++) for(let dz=-2;dz<=2;dz++)
      if(R()<0.42) add(S,px+dx,gy+h-1+dy,pz+dz, R()<0.3? C.bamboo[0]:C.bamboo[1]);
    if(R()<0.25){ // shoot
      add(S,x+ri(-1,1),gy+0.5,z+ri(-1,1),C.bambooShoot);
      add(S,x,gy+0.5,z,C.bambooShoot);
    }
  }
}

function bush(x,z,cols){
  const y0=groundY(x,z);
  for(let i=0;i<3;i++){
    const bx=x+ri(-1,1), bz=z+ri(-1,1);
    sphere(S,bx,y0+1,bz,rr(1.1,1.8),(px,py,pz,d)=>{
      if(d>0.6&&R()<0.4) return 0;
      const r2=R(); return cols? (r2<0.75? cols[(hash2(px,bz)*cols.length)|0] : C.mossL) : C.leaf[(hash2(px*3,pz*5)*4)|0];
    });
  }
}

function flowers(x,z,n,cols,tall=false){
  const y0=groundY(x,z);
  for(let i=0;i<n;i++){
    const fx0=x+ri(-2,2), fz0=z+ri(-2,2);
    if(featAt(fx0,fz0)!==F.NONE||isWater(fx0,fz0)) continue;
    const gy=groundY(fx0,fz0);
    const h=tall?2:1;
    for(let k=1;k<=h;k++) add(S,fx0,gy+k-0.5,fz0,C.leaf[0]);
    add(S,fx0,gy+h+0.5,fz0,cols[(R()*cols.length)|0]);
    if(tall&&R()<0.5) add(S,fx0+1,gy+h-0.5,fz0,C.leaf[2]);
  }
}

    if((x+z)%2===0){ add(S,x,gy+0.5,z,C.woodM); add(S,x,gy+1.5,z,C.woodD);} }

/* ============================================================
   5. TIME OF DAY
   ============================================================ */
const PAL = {
  nightTop:0x050a20, nightBot:0x141d3a,
  dayTop:0x53a4e4,  dayBot:0xcfe8fb,
  warm:0xff9e5e,    warmHigh:0xffd9a8,
  duskTop:0x2c3e66, duskBot:0xff8a5c,
};
let dayT = 10.2;
function setDayTime(t){
  const ang = ((t-6)/12)*Math.PI;                 // 6h → sunrise east, 18h → sunset west
  const sy = Math.sin(ang), sxc = Math.cos(ang);
  const dir = new THREE.Vector3(-sxc*0.8, Math.max(sy,-0.25), -sxc*0.35+0.25).normalize();
  const e = clamp(sy,0,1);                        // sun elevation
  const g = Math.max(0, 1-Math.abs(sy)*3.2);      // horizon glow
  const night = clamp(1-e*3.2,0,1);

  const top = mix(PAL.nightTop, PAL.dayTop, smooth(0,0.5,e));
  let bot = mix(PAL.nightBot, PAL.dayBot, smooth(0,0.45,e));
  bot = mix(bot, PAL.warm, g*smooth(0.05,0.3,e+0.35)*0.9);
  skyU.top.value.setHex(mix(top, PAL.duskTop, g*0.5));
  skyU.bot.value.setHex(bot);
  scene.fog.color.copy(skyU.bot.value).lerp(_c2.setHex(0x0a0e1a), night*0.55);
  scene.fog.density = 0.0030 + 0.0026*night;

  sun.position.set(dir.x*140, Math.max(dir.y,0.06)*140, dir.z*140);
  sun.color.setHex(mix(0xffb46a, 0xfff6e8, smooth(0,0.6,e)));
  sun.intensity = 0.12 + 2.35*Math.max(e,0)*smooth(0,0.12,e);
  hemi.intensity = 0.10 + 0.5*e;
  hemi.color.setHex(mix(0x25305a, 0xbfd9ff, e));
  hemi.groundColor.setHex(mix(0x1c2417, 0x6a5a44, e));
  amb.intensity = 0.10 + 0.12*e;

  const gf = clamp(0.10 + night*1.25, 0, 1);       // glow factor
  matGlow.color.setScalar(gf);
  matStatic.color.setHex(mix(0x93a3ce, 0xffffff, smooth(0.02,0.38,e)));
  matWater.color.setHex(mix(0x4a6f9e, 0xaee2ff, smooth(0,0.5,e)));
  for(const h of halos) h.material.opacity = gf*0.75 + 0.05*Math.sin(performance.now()*0.003+h.position.x);
  stMat.opacity = night*0.95;
  ffMat.opacity = night;
  moonHalo.material.opacity = night*0.8;
  renderer.toneMappingExposure = 0.98 + 0.1*e;

  const d=new THREE.Vector3(dir.x,Math.max(dir.y,0.05),dir.z);
  sunMesh.position.copy(d).multiplyScalar(200); sunMesh.material.color.setHex(mix(0xff8a4a,0xfff0c8,smooth(0,0.5,e)));
  sunMesh.visible = e>-0.15;
  moonMesh.position.copy(d).multiplyScalar(-200); moonMesh.position.y=Math.abs(moonMesh.position.y);
  moonMesh.visible = night>0.15;
}

  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05); lapsed+=dt;

  if(cycleEl.checked){ dayT=(dayT+dt*0.4)%24; timeEl.value=dayT.toFixed(2); }
  tvalEl.textContent=dayT.toFixed(1)+'h';
  setDayTime(dayT);

  const wind = Math.sin(lapsed*0.23)*1.4 + 0.7;
  if(petalsEl.checked) petalsUpdate(dt,lapsed,wind);
  else if(petalMesh.visible){ petalMesh.visible=false; } 
  if(petalsEl.checked && !petalMesh.visible) petalMesh.visible=true;

  waterUpdate(lapsed);
  koiUpdate(lapsed);
  bflyUpdate(lapsed);

  // fireflies wander
  const arr=ffGeo.attributes.position.array;
  for(let i=0;i<NFF;i++){ const f=ffPos[i];
    arr[i*3]  =f.x+Math.sin(lapsed*f.sp+f.ph)*1.4;
    arr[i*3+1]=f.y+Math.sin(lapsed*0.7+f.ph*2)*0.8;
    arr[i*3+2]=f.z+Math.cos(lapsed*f.sp*0.8+f.ph)*1.4;
  }
  ffGeo.attributes.position.needsUpdate=true;

  if(tween){
    const k=clamp((performance.now()-tween.s)/tween.d,0,1);
    const e=k<0.5? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(k>=1) tween=null;
  }
  controls.update();
  renderer.render(scene,camera);
}
loop();

</script>
