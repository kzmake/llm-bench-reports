<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagoda in Bloom — a voxel garden</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0e1a;font-family:"Avenir Next",Segoe UI,Helvetica,Arial,sans-serif;color:#f4efe6;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .panel{position:fixed;z-index:10;backdrop-filter:blur(6px);background:rgba(16,14,22,.52);border:1px solid rgba(244,224,190,.18);border-radius:12px;}
  #title{top:16px;left:18px;padding:12px 18px;}
  #title h1{margin:0;font-size:19px;letter-spacing:.06em;font-weight:600;color:#f6d9e4;}
  #title p{margin:4px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#c8b8a4;}
  #hint{bottom:14px;right:16px;padding:8px 12px;font-size:11px;color:#cfc4b2;background:rgba(16,14,22,.38);}
  #controls{bottom:14px;left:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:min(92vw,680px);}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#b7a98f;margin-right:2px;min-width:44px;}
  button{cursor:pointer;border:1px solid rgba(244,224,190,.25);background:rgba(60,44,52,.55);color:#f1e7d8;font:600 11px/1 inherit;letter-spacing:.05em;padding:8px 11px;border-radius:8px;transition:all .18s;}
  button:hover{background:rgba(160,90,110,.55);transform:translateY(-1px);}
  button.on{background:#c8506f;border-color:#f0b7c8;color:#fff;box-shadow:0 0 12px rgba(230,120,160,.45);}
  #loading{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0b0e1a;color:#e8d9c8;font-size:13px;letter-spacing:.2em;text-transform:uppercase;}
  #loading .pet{width:14px;height:14px;background:#f2a7c3;border-radius:3px;animation:spin 1.1s ease-in-out infinite;}
  @keyframes spin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.5)}100%{transform:rotate(360deg) scale(1)}}
</style>
</head>
<body>
<div id="app"></div>
<div class="panel" id="title"><h1>Pagoda in Bloom</h1><p>five-storied tower &middot; koi pond &middot; ten thousand petals</p></div>
<div class="panel" id="hint">drag orbit &middot; scroll zoom &middot; right-drag pan &middot; keys 1-7 views</div>
<div class="panel" id="controls">
  <div class="row"><span class="lbl">view</span>
    <button data-view="all" class="on">Whole Garden</button>
    <button data-view="pagoda">Pagoda</button>
    <button data-view="pond">Pond &amp; Bridge</button>
    <button data-view="falls">Waterfall</button>
    <button data-view="tea">Tea House</button>
    <button data-view="zen">Zen Garden</button>
    <button data-view="bamboo">Bamboo Grove</button>
  </div>
  <div class="row"><span class="lbl">time</span>
    <button data-time="0.27">Morning</button>
    <button data-time="0.70" class="on">Golden Hour</button>
    <button data-time="0.86">Night</button>
    <button id="cycleBtn">Cycle Day/Night</button>
    <button id="petalBtn" class="on">Petal Rain</button>
    <button id="orbitBtn">Auto-Orbit</button>
  </div>
</div>
<div id="loading"><div class="pet"></div><div id="loadMsg">planting the garden…</div></div>

<script type="module">
/* ============================================================
   PAGODA IN BLOOM — a voxel Japanese garden in one HTML file.
   Three.js from CDN (mirrors). Everything else is hand-built
   from tiny cubes: five-storied pagoda, torii, arched bridge,
   koi pond with waterfall, tea house, zen garden, bamboo grove,
   cherry blossoms with petal rain, shishi-odoshi, stone
   lanterns, komainu, fireflies and a full day/night cycle.
   ============================================================ */
const CDNS=[
  'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',
  'https://unpkg.com/three@0.160.0/build/three.module.js',
  'https://esm.sh/three@0.160.0',
];
let THREE=null;
for(const url of CDNS){ try{ THREE=await import(url); break; }catch(e){} }
if(!THREE){
  document.getElementById('loadMsg').textContent='Could not load Three.js from any CDN — check your connection and reload.';
  throw new Error('three.js unavailable');
}

/* ---------------- utils ---------------- */
let seed=20261026;
const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
const rr=(a,b)=>a+rnd()*(b-a);
const ri=(a,b)=>Math.floor(rr(a,b+1));
const ch=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{const t=clamp((x-e0)/(e1-e0),0,1);return t*t*(3-2*t);};
const h2=(x,z)=>{const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s);};
const vnoise=(x,z)=>{const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(h2(xi,zi),h2(xi+1,zi),u),lerp(h2(xi,zi+1),h2(xi+1,zi+1),u),v);};
const shade=(hex,f)=>{const c=new THREE.Color(hex);c.multiplyScalar(f);return c.getHex();};
const jitc=(hex,amt)=>shade(hex,1-rnd()*amt*2+amt);
const TAU=Math.PI*2;

/* ---------------- palette ---------------- */
const C={
  grass:[0x679a4d,0x5f9146,0x71a355,0x64974b], grassDry:0x8b9d52,
  dirt:0xb59a72, dirtDark:0xa08a68, flag:0x98938c, gravel:0xc0b8a4,
  zenSand:0xe9e2cf, zenLine:0xcfc7ae,
  stone:[0x919296,0x87888c,0x9b9c9e], stoneDark:0x6e7074, stoneLight:0xa9aaac,
  moss:0x4e7a3a, mossLight:0x63914a,
  woodDark:0x4a3322, wood:0x6b4a30, woodLight:0x87603c,
  verm:[0xc8402f,0xd04a35,0xbc3a2c], vermDark:0x8e2c22,
  cream:[0xe9dcc0,0xf0e6cf], paper:0xefe4c8,
  roofEdge:0x2b333d, gold:0xd9b24a, goldDark:0xb08a30,
  cherry:[0xf7c6d7,0xf2a7c3,0xfbd9e5,0xefb6cd], cherryDeep:0xe88db1,
  trunk:0x5a4038, trunkDark:0x48332c,
  pine:[0x33683f,0x3b7346,0x2d5c38], pineLit:0x4d8a52,
  bamboo:[0x7fae4b,0x8cbb58], bambooNode:0x628a38,
  maple:[0xd0562c,0xbc412a,0xe07a33,0xc94e2e], willow:0x8aae55,
  rock:[0x7d7e82,0x8a8b8e,0x74757a],
  glow:0xffd98a, glowWarm:0xffb45e,
};

/* ---------------- voxel store ---------------- */
const V=new Map();               // "x|y|z" -> color
const GLOW=[];                   // emissive voxels
const key=(x,y,z)=>x+'|'+y+'|'+z;
function vox(x,y,z,c,o={}){ if(!(Number.isFinite(x)&&Number.isFinite(y)&&Number.isFinite(z))) return;
  x=Math.round(x);y=Math.round(y);z=Math.round(z);
  if(o.jit) c=jitc(c,o.jit);
  V.set(key(x,y,z),c); }
const setV=vox;
function box(x0,x1,y0,y1,z0,z1,c,o={}){ if(!(Number.isFinite(x0+x1+y0+y1+z0+z1))) return;
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++) vox(x,y,z,c,o); }
function shell(x0,x1,y0,y1,z0,z1,c,o={}){
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)
    if(x===x0||x===x1||z===z0||z===z1||y===y0||y===y1) vox(x,y,z,c,o); }
function ellip(cx,cy,cz,rx,ry,rz,c,o={}){
  cx=Math.round(cx);cy=Math.round(cy);cz=Math.round(cz);
  for(let x=cx-Math.ceil(rx);x<=cx+Math.ceil(rx);x++)
  for(let y=cy-Math.ceil(ry);y<=cy+Math.ceil(ry);y++)
  for(let z=cz-Math.ceil(rz);z<=cz+Math.ceil(rz);z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
    if(d>1.05) continue;
    if(o.gaps&&rnd()<o.gaps&&d<0.85) continue;
    vox(x,y,z,c,o); } }
function cyl(cx,cz,y0,y1,r,c,o={}){
  for(let x=Math.ceil(cx-r);x<=Math.floor(cx+r);x++)
  for(let z=Math.ceil(cz-r);z<=Math.floor(cz+r);z++){
    if(((x-cx)**2+(z-cz)**2)>r*r+0.2) continue;
    for(let y=y0;y<=y1;y++) vox(x,y,z,c,o); } }
function cone(cx,cz,y0,h,r,c){
  for(let i=0;i<h;i++){ const rad=r-i*(r/h);
    cyl(cx,cz,y0+i,y0+i,rad,shade(c,1-0.04*i)); } }
function glowVox(x,y,z,c){ GLOW.push({x,y,z,c}); }

/* ---------------- layout ---------------- */
const FE=52;
const PC={x:-20,z:14};
const rPond=a=>15.5+2.6*Math.sin(3*a+0.7)+1.7*Math.sin(5*a+2.1)+0.9*Math.sin(7*a+4.2);
function pondInfo(x,z){ const dx=x-PC.x,dz=z-PC.z;
  return {d:Math.hypot(dx,dz),a:Math.atan2(dz,dx),r:rPond(Math.atan2(dz,dx))}; }
const WATER_Y=1.15;
const PG={x:16,z:-26};
const TEA={x:34,z:26};
const ZEN={x0:26,x1:46,z0:-8,z1:8};

const wfA=Math.PI, wfR=rPond(wfA)-1.2;
const WF={x:PC.x+Math.cos(wfA)*wfR, z:PC.z+Math.sin(wfA)*wfR};

const FLATTEN=[
  {x:PG.x,z:PG.z,r0:14,r1:22,h:1},
  {x:TEA.x,z:TEA.z,r0:8,r1:15,h:1},
  {x:36,z:0,r0:10,r1:16,h:1},
  {x:1,z:44,r0:6,r1:13,h:1},
];
const PATHS=[
  [[1,52],[2,38],[7,28],[5,20],[7,14],[24,10],[26,0],[26,-10],[16,-12],[16,-13]],
  [[7,14],[-8,14]],
  [[-13,14],[-24,8],[-33,0],[-36,-8]],
  [[24,10],[28,18],[30,22]],
];
function distToSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1e-6;
  let t=((px-ax)*dx+(pz-az)*dz)/l2; t=clamp(t,0,1);
  return Math.hypot(px-(ax+dx*t),pz-(az+dz*t)); }
function pathDist(x,z){ let m=1e9;
  for(const pl of PATHS) for(let i=0;i<pl.length-1;i++)
    m=Math.min(m,distToSeg(x,z,pl[i][0],pl[i][1],pl[i+1][0],pl[i+1][1]));
  return m; }

const CHERRIES=[
  {x:12,z:30,s:1.7,big:true},
  {x:-38,z:36,s:1.5},
  {x:42,z:18,s:1.3},
  {x:-17,z:-2,s:1.9,big:true,pond:true},
  {x:22,z:2,s:1.0},
  {x:-30,z:26,s:1.1},
];
const BAM={x:-40,z:-16};
const SHI={x:-36,z:-8};

function groundTop(x,z){
  let h=1+1.4*vnoise(x*0.018,z*0.018)+0.6*vnoise(x*0.06,z*0.06)-1.0;
  h+=5.5*smooth(20,55,Math.hypot(x+46,z-14));
  for(const f of FLATTEN){ const d=Math.hypot(x-f.x,z-f.z); h=lerp(h,f.h,smooth(f.r1,f.r0,d)); }
  const p=pondInfo(x,z);
  if(p.d<p.r){ const basin=-2.2+3.4*Math.pow(p.d/p.r,1.6); h=Math.min(h,basin); }
  return Math.round(h);
}

/* ================= builders ================= */
function zenColor(x,z){
  let c=C.zenSand;
  for(const b of [[31,-2],[41,3],[35,-6]]){ const d=Math.hypot(x-b[0],z-b[1]);
    if(d<1.7) return jitc(0x8f8f92,0.1); }
  for(const b of [[31,-2],[41,3],[35,-6]]){ const d=Math.hypot(x-b[0],z-b[1]);
    if(d<8.5&&d>1.8&&(d%2.0)<0.9) c=0xafa688; }
  if(c===C.zenSand&&z>ZEN.z0+2&&z<ZEN.z1-2&&(((z%2.6)+2.6)%2.6)<1.0) c=0xafa688;
  return c;
}
function zenCurb(){
  for(let x=ZEN.x0-1;x<=ZEN.x1+1;x++){
    vox(x,1,ZEN.z0-1,ch(C.stone),{jit:.08}); vox(x,1,ZEN.z1+1,ch(C.stone),{jit:.08});
    if(x%4===0){ vox(x,2,ZEN.z0-1,C.stoneLight); vox(x,2,ZEN.z1+1,C.stoneLight); } }
  for(let z=ZEN.z0-1;z<=ZEN.z1+1;z++){
    vox(ZEN.x0-1,1,z,ch(C.stone),{jit:.08}); vox(ZEN.x1+1,1,z,ch(C.stone),{jit:.08});
    if(z%4===0){ vox(ZEN.x0-1,2,z,C.stoneLight); vox(ZEN.x1+1,2,z,C.stoneLight); } }
  for(const b of [[31,-2],[41,3],[35,-6]]){
    ellip(b[0],2,b[1],1.5,1.3,1.5,ch(C.rock),{jit:.12});
    vox(b[0]+ri(-1,1),3,b[1]+ri(-1,1),C.moss); vox(b[0]+ri(-1,1),3,b[1]+ri(-1,1),C.mossLight); }
}
function buildTerrain(){
  for(let x=-88;x<=88;x++)for(let z=-88;z<=88;z++){
    const inside=Math.abs(x)<=FE&&Math.abs(z)<=FE;
    const h=groundTop(x,z);
    const p=pondInfo(x,z);
    const inPond=p.d<p.r&&h<1;
    const n1=vnoise(x*0.11,z*0.11), n2=h2(x*3+7,z*7+1);
    let c;
    if(inPond) c=jitc(p.d<p.r*0.55?0x8a7c55:0xc4b183,0.07);
    else if(inside&&x>ZEN.x0&&x<ZEN.x1&&z>ZEN.z0&&z<ZEN.z1) c=zenColor(x,z);
    else{
      c=C.grass[Math.min(3,Math.floor(vnoise(x*0.22+9,z*0.22+3)*3.99))];
      if(n2<0.07) c=C.grassDry;
      if(n1>0.72) c=jitc(C.moss,0.06);
      if(!inside) c=jitc(shade(C.grass[Math.floor(vnoise(x*0.2,z*0.2)*3.99)],0.78+0.16*n1),0.06);
      const pd=pathDist(x,z);
      if(pd<2.0&&inside) c=(h2(x*11,z*13)<0.13)?ch(C.stone):(pd<1.4?jitc(C.dirt,0.05):jitc(C.dirtDark,0.05));
      else if(pd<2.6&&inside&&n2<0.2) c=ch(C.stone);
      for(const t of CHERRIES){ const d=Math.hypot(x-t.x,z-t.z);
        if(d<4.8*t.s&&h2(x*5+t.x,z*7+t.z)<0.6-d/(9.6*t.s)) c=jitc(0xf0c3d2,0.06); }
    }
    const layers=inPond?1:(inside?3:2);
    for(let y=h;y>h-layers;y--) vox(x,y,z,c);
    if(inPond) for(let y=h-1;y>=-3;y--) vox(x,y,z,jitc(0x77684a,0.08));
  }
  // bamboo perimeter fence
  for(let x=-FE;x<=FE;x++) for(const z of [-FE,FE]){
    if(z===FE&&Math.abs(x-1)<4) continue;
    vox(x,2,z,(x%3===0)?C.bambooNode:C.bamboo); vox(x,3,z,(x%4===1)?C.bambooNode:C.bamboo); }
  for(let z=-FE;z<=FE;z++) for(const x of [-FE,FE]){
    vox(x,2,z,(z%3===0)?C.bambooNode:C.bamboo); vox(x,3,z,(z%4===1)?C.bambooNode:C.bamboo); }
  for(let x=-FE;x<=FE;x+=3) for(const z of [-FE,FE]) if(!(z===FE&&Math.abs(x-1)<4)){ vox(x,4,z,C.woodDark); vox(x,5,z,0x8a7a5a); }
  for(let z=-FE;z<=FE;z+=3) for(const x of [-FE,FE]){ vox(x,4,z,C.woodDark); vox(x,5,z,0x8a7a5a); }
  // flowering hedge inside the front fence
  for(let x=-FE;x<=FE;x++) if(Math.abs(x-1)>4){
    vox(x,1,FE-1,ch(C.grass)); vox(x,2,FE-1,ch(C.pine),{jit:.14}); vox(x,3,FE-1,0x3f7a48);
    if(h2(x,9)<0.5) vox(x,4,FE-1,ch(C.cherry),{jit:.1}); }
}
function roof(cx,cz,y,w,opt={}){
  const {tile=0x3f4c5c,tiers=3,lift=true,gold=true}=opt;
  for(let k=0;k<tiers;k++){
    const hw=w-k; if(hw<1) break;
    for(let x=-hw;x<=hw;x++)for(let z=-hw;z<=hw;z++){
      const ax=Math.abs(x),az=Math.abs(z);
      if(Math.max(ax,az)!==hw&&k<tiers-1) continue;
      let up=0;
      if(lift&&((ax===hw&&az>=hw-1)||(az===hw&&ax>=hw-1))) up=(k===0?1:0)+(k===1&&ax===hw&&az===hw?1:0);
      let c=((z&1)?shade(tile,0.88):shade(tile,1.04));
      if(gold&&up) c=C.gold;
      vox(cx+x,y+k+up,cz+z,c); }
    if(k===0) for(let x=-hw;x<=hw;x++)for(let z=-hw;z<=hw;z++){
      if(Math.max(Math.abs(x),Math.abs(z))!==hw) continue;
      vox(cx+x,y-1,cz+z,C.roofEdge); } }
  for(let z=-2;z<=2;z++) vox(cx,y+tiers,cz+z,C.goldDark);
}
function buildPagoda(){
  const px=PG.x,pz=PG.z;
  box(px-13,px+13,1,2,pz-13,pz+13,ch(C.stone),{jit:.06});
  shell(px-11,px+11,3,4,pz-11,pz+11,ch(C.stone),{jit:.05});
  box(px-9,px+9,5,5,pz-9,pz+9,C.gravel,{jit:.07});
  for(let x=px-11;x<=px+11;x++) for(const z of [pz-11,pz+11]){
    if(z===pz+11&&Math.abs(x-px)<5) continue;
    vox(x,6,z,0xa8a29a); if(((x-px)&3)===0) vox(x,7,z,0xb5afa6); }
  for(let z=pz-11;z<=pz+11;z++) for(const x of [px-11,px+11]){
    vox(x,6,z,0xa8a29a); if(((z-pz)&3)===0) vox(x,7,z,0xb5afa6); }
  for(let i=0;i<5;i++) box(px-4,px+4,1,1+i,pz+12+i,pz+12+i,0x9d9892,{jit:.04});
  box(px-5,px-5,1,5,pz+13,pz+16,0xa5a099); box(px+5,px+5,1,5,pz+13,pz+16,0xa5a099);
  const hws=[5,5,4,4,3];
  let y0=6;
  for(let i=0;i<5;i++){
    const hw=hws[i];
    shell(px-hw,px+hw,y0,y0+3,pz-hw,pz+hw,ch(C.cream),{jit:.03});
    for(const sx of [-1,1]) for(const sz of [-1,1])
      box(px+sx*hw,px+sx*hw,y0,y0+3,pz+sz*hw,pz+sz*hw,ch(C.verm),{jit:.04});
    for(let s=-hw+2;s<=hw-2;s+=4) for(const [fx,fz] of [[s,hw],[s,-hw],[hw,s],[-hw,s]]){
      setV(px+fx,y0,pz+fz,ch(C.verm)); setV(px+fx,y0+1,pz+fz,ch(C.verm)); setV(px+fx,y0+2,pz+fz,ch(C.verm)); }
    box(px-hw-1,px+hw+1,y0,y0,pz-hw-1,pz+hw+1,C.woodDark);
    for(let x=-hw-1;x<=hw+1;x+=2){ setV(px+x,y0+1,pz-hw-1,C.vermDark); setV(px+x,y0+1,pz+hw+1,C.vermDark); }
    for(let z=-hw-1;z<=hw+1;z+=2){ setV(px-hw-1,y0+1,pz+z,C.vermDark); setV(px+hw+1,y0+1,pz+z,C.vermDark); }
    if(i===0){
      box(px-1,px+1,y0,y0+2,pz+hw,pz+hw,0x241a12);
      setV(px-1,y0+1,pz+hw+1,C.paper); setV(px+1,y0+1,pz+hw+1,C.paper);
      glowVox(px,y0+1,pz+hw,0xffc06a); glowVox(px,y0+2,pz+hw,0xffb45e);
      box(px,px,y0,y0+3,pz,pz,0x3c2a1c);
    } else {
      for(const [fx,fz] of [[0,hw],[0,-hw],[hw,0],[-hw,0]])
        for(let yy=y0+1;yy<=y0+2;yy++) setV(px+fx,yy,pz+fz,0x2b2016);
      if(i===1){ setV(px,y0+2,pz+hw,C.gold); setV(px-1,y0+2,pz+hw,C.goldDark); setV(px+1,y0+2,pz+hw,C.goldDark); }
    }

const waterUniforms={uTime:{value:0},uNight:{value:0},uSky:{value:new THREE.Color(0xbfe0f5)},
  uShallow:{value:new THREE.Color(0x6ecbda)},uDeep:{value:new THREE.Color(0x1e7f9c)}};
const waterMat=new THREE.ShaderMaterial({uniforms:waterUniforms,transparent:true,
  vertexShader:`varying vec3 vP; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vP=wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`,
  fragmentShader:`
    varying vec3 vP; uniform float uTime,uNight; uniform vec3 uSky,uShallow,uDeep;
    float rmask(float a){ return 15.5+2.6*sin(3.0*a+0.7)+1.7*sin(5.0*a+2.1)+0.9*sin(7.0*a+4.2); }
    void main(){
      vec2 p=vP.xz-vec2(${PC.x.toFixed(1)},${PC.z.toFixed(1)});
      float d=length(p); if(d>24.0) discard;
      float a=atan(p.y,p.x); float r=rmask(a);
      if(d>r) discard;
      vec2 q=floor(p);
      float w1=sin(uTime*1.6+q.x*0.9+q.y*1.3)*0.5+0.5;
      float w2=sin(uTime*0.75+q.y*0.5-q.x*0.75)*0.5+0.5;
      float dep=clamp((r-d)/6.0,0.0,1.0);
      vec3 col=mix(uShallow,uDeep,dep*0.75+0.25*w2);
      col+=w1*0.05;
      float ring=smoothstep(r-2.2,r-0.2,d);
      col=mix(col,vec3(0.85,0.92,0.90),ring*0.5);
      float sparkle=pow(w1,40.0)*(1.0-uNight)*0.55; col+=sparkle;
      col*=mix(1.0,0.3,uNight);
      col=mix(col,uSky,0.06+0.45*uNight);
      float aa=1.0-smoothstep(r-0.4,r,d);
      gl_FragColor=vec4(col,aa*0.85);
    }`});

dom.addEventListener('contextmenu',e=>e.preventDefault());
dom.addEventListener('pointerdown',e=>{dragging=e.button===2?2:1;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>{dragging=0;});
addEventListener('pointermove',e=>{ if(!dragging)return;
  const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if(dragging===1){ ctl.gTheta-=dx*0.0055; ctl.gPhi=clamp(ctl.gPhi-dy*0.0045,0.12,1.48); }
  else{ const s=ctl.r*0.0012;
    const rx=Math.cos(ctl.theta),rz=Math.sin(ctl.theta);
    ctl.gT.x-=dx*rx*s; ctl.gT.z+=dx*rz*s;
    ctl.gT.y=clamp(ctl.gT.y+dy*s,0,36); } });
dom.addEventListener('wheel',e=>{ e.preventDefault(); ctl.gR=clamp(ctl.gR*Math.exp(e.deltaY*0.001),10,200); },{passive:false});
dom.addEventListener('touchstart',e=>{ if(e.touches.length===2){dragging=0;
  pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);} },{passive:true});
dom.addEventListener('touchmove',e=>{ if(e.touches.length===2){
  const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
  ctl.gR=clamp(ctl.gR*(pinch/d),10,200); pinch=d; } },{passive:true});

  pagoda:{t:[16,24,-26],th:2.25,ph:0.95,r:52},
  pond:{t:[-19,1,13],th:0.12,ph:0.66,r:66},
  falls:{t:[-42,5,8],th:1.0,ph:0.9,r:40},
  tea:{t:[33,5,26],th:4.4,ph:0.85,r:40},
  zen:{t:[36,2,0],th:2.9,ph:0.72,r:40},
  bamboo:{t:[-40,4,-14],th:3.3,ph:0.75,r:42},
};
let camAnim=null;
function goView(v){ camAnim={t0:performance.now(),d:1600,
  f:{t:ctl.gT.clone(),th:ctl.gTheta,ph:ctl.gPhi,r:ctl.gR},
  to:{t:new THREE.Vector3(...v.t),th:v.th,ph:v.ph,r:v.r}}; }
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); goView(VIEWS[b.dataset.view]); }));
addEventListener('keydown',e=>{ const k=Object.keys(VIEWS),i=+e.key;
  if(i>=1&&i<=k.length) goView(VIEWS[k[i-1]]); });

let dayT=0.70,cycling=false,petalRain=true;
document.querySelectorAll('[data-time]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-time]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); dayT=+b.dataset.time; cycling=false;
  document.getElementById('cycleBtn').classList.remove('on'); }));
document.getElementById('cycleBtn').addEventListener('click',e=>{ cycling=!cycling; e.currentTarget.classList.toggle('on',cycling); });
document.getElementById('orbitBtn').addEventListener('click',e=>{ ctl.auto=!ctl.auto; e.currentTarget.classList.toggle('on',ctl.auto); });
document.getElementById('petalBtn').addEventListener('click',e=>{ petalRain=!petalRain; e.currentTarget.classList.toggle('on',petalRain); });

/* ---------------- day / night ---------------- */
const SKY={
  dayTop:new THREE.Color(0x3f78c8),dayHor:new THREE.Color(0xcfe6f2),
  duskTop:new THREE.Color(0x2f3a68),duskHor:new THREE.Color(0xf2a05e),
  nightTop:new THREE.Color(0x0a1030),nightHor:new THREE.Color(0x24315a),
  daySun:new THREE.Color(0xffe3b0),duskSun:new THREE.Color(0xff9a52),
};
const tmpA=new THREE.Color(),tmpB=new THREE.Color();
let sunDir=new THREE.Vector3(),clock=0;
function updateDayNight(){
  const a=dayT*TAU-Math.PI/2;
  const s=Math.sin(a),cs=Math.cos(a);
  sunDir.set(cs*0.8,s,0.36+cs*0.1).normalize();
  const dayF=smooth(-0.02,0.28,s);
  const duskF=Math.exp(-Math.pow((s-0.06)/0.16,2))*(cs>-0.2?1:0.3);
  const nightF=smooth(0.06,-0.22,s);
  tmpA.copy(SKY.nightTop).lerp(SKY.dayTop,dayF);
  skyU.uTop.value.copy(tmpA).lerp(SKY.duskTop,duskF*0.7);
  tmpB.copy(SKY.nightHor).lerp(SKY.dayHor,dayF);
  skyU.uHor.value.copy(tmpB).lerp(SKY.duskHor,duskF*0.9);
  skyU.uSun.value.copy(sunDir); skyU.uSunI.value=clamp(s*4,0,1.5);
  skyU.uSunCol.value.copy(SKY.duskSun).lerp(SKY.daySun,smooth(0.05,0.4,s));
  sun.position.copy(sunDir).multiplyScalar(160);
  sun.intensity=2.5*dayF+0.5*Math.max(s,0);
  sun.color.copy(SKY.duskSun).lerp(SKY.daySun,smooth(0.02,0.4,s));
  hemi.intensity=lerp(0.55,0.8,dayF);
  hemi.color.copy(skyU.uHor.value).multiplyScalar(0.9);
  hemi.groundColor.setHex(0x40472f).multiplyScalar(lerp(0.35,1,dayF));
  amb.intensity=lerp(0.62,0.45,dayF);
  amb.color.setHex(nightF>0.5?0x2a3352:0x50464a);
  moonL.intensity=2.2*nightF;
  moonL.position.set(-sunDir.x*160,-sunDir.y*120+80,-sunDir.z*160);
  scene.fog.color.copy(skyU.uHor.value).multiplyScalar(lerp(0.75,1,dayF));
  waterUniforms.uNight.value=nightF;
  waterUniforms.uSky.value.copy(skyU.uHor.value);
  stars.material.opacity=nightF*0.95;
  fireflies.material.opacity=nightF*(0.55+0.45*Math.sin(clock*2.1)*Math.sin(clock*0.83));
  moonMat.opacity=nightF*0.95;
  moonGroup.userData.haloMat.opacity=nightF*0.22;
  moonGroup.position.set(-sunDir.x*300,-sunDir.y*300,-sunDir.z*300);
  moonGroup.visible=nightF>0.02;
  const glowLevel=(0.3+0.7*nightF)*(0.93+0.05*Math.sin(clock*9)+0.02*Math.sin(clock*23));
  const c=new THREE.Color();
  for(let i=0;i<GLOW.length;i++){ c.copy(glowBase[i]).multiplyScalar(glowLevel); glowMesh.setColorAt(i,c); }
  if(glowMesh.instanceColor) glowMesh.instanceColor.needsUpdate=true;
  lanternLights.forEach((pl,i)=>pl.intensity=nightF*(120+20*Math.sin(clock*7+i*2)));
  birds.forEach(b=>b.g.visible=dayF>0.15);
  dflies.forEach(d=>d.g.visible=dayF>0.25);
}

/* ---------------- main loop ---------------- */
const m4=new THREE.Matrix4(),pv=new THREE.Vector3(),q=new THREE.Quaternion(),eu=new THREE.Euler(),sv=new THREE.Vector3(1,1,1);
let last=performance.now();
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,0.05);
  clock+=dt;
  if(cycling) dayT=(dayT+dt*0.011)%1;
  updateDayNight();

  if(camAnim){ const t=clamp((performance.now()-camAnim.t0)/camAnim.d,0,1);
    const k=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    ctl.gTheta=lerp(camAnim.f.th,camAnim.to.th,k); ctl.gPhi=lerp(camAnim.f.ph,camAnim.to.ph,k);
    ctl.gR=lerp(camAnim.f.r,camAnim.to.r,k); ctl.gT.lerpVectors(camAnim.f.t,camAnim.to.t,k);
    if(t>=1) camAnim=null; }
  if(ctl.auto&&!dragging) ctl.gTheta+=dt*0.06;
  ctl.theta=lerp(ctl.theta,ctl.gTheta,0.12); ctl.phi=lerp(ctl.phi,ctl.gPhi,0.12);
  ctl.r=lerp(ctl.r,ctl.gR,0.1); ctl.target.lerp(ctl.gT,0.1);
  camera.position.set(
    ctl.target.x+ctl.r*Math.sin(ctl.phi)*Math.sin(ctl.theta),
    ctl.target.y+ctl.r*Math.cos(ctl.phi),
    ctl.target.z+ctl.r*Math.sin(ctl.phi)*Math.cos(ctl.theta));
  camera.lookAt(ctl.target);
  waterUniforms.uTime.value=clock;

  // waterfall
  for(let i=0;i<N_FALL;i++){ const p=fallP[i];
    p.y-=dt*p.sp; if(p.y<0) p.y+=1;
    const y=lerp(11,WATER_Y+0.4,p.y);
    const spread=(1-p.y)*0.6;
    m4.makeTranslation(WF.x+p.off*(0.8+spread*Math.sin(clock*7+i)),y,WF.z+p.off2*(0.8+spread*Math.cos(clock*6+i)));
    fallMesh.setMatrixAt(i,m4); }
  fallMesh.instanceMatrix.needsUpdate=true;
  for(let i=0;i<N_SPLASH;i++){ const p=splashP[i];
    const t=(clock*p.sp+i*0.37)%1,ang=p.t+t*2.4;
    m4.makeTranslation(WF.x+Math.cos(ang)*p.r*(1+t*2),WATER_Y+0.3+Math.sin(t*Math.PI)*1.6,WF.z+Math.sin(ang)*p.r*(1+t*2));
    splashMesh.setMatrixAt(i,m4); }
  splashMesh.instanceMatrix.needsUpdate=true;

  // petals
  const fall=petalRain?1:0.12;
  for(let i=0;i<N_PETAL;i++){ const p=petals[i];
    p.y-=dt*p.sp*fall;
    p.x+=Math.sin(clock*1.1+p.ph)*dt*0.9+dt*0.7;
    p.z+=Math.cos(clock*0.9+p.ph*1.3)*dt*0.8+dt*0.5;
    p.rot+=dt*2.4;
    const ppi=pondInfo(p.x,p.z);
    if(p.y<(ppi.d<ppi.r?WATER_Y+0.1:groundTop(p.x,p.z)+1.15)) petalSpawn(p,false);
    eu.set(Math.sin(p.ph+clock)*0.6,p.rot,Math.cos(p.ph*2+clock*0.8)*0.5);
    q.setFromEuler(eu); pv.set(p.x,p.y,p.z);
    m4.compose(pv,q,sv); petalMesh.setMatrixAt(i,m4); }
  petalMesh.instanceMatrix.needsUpdate=true;
  // water petals
  for(let i=0;i<N_WP;i++){ const w=wp[i];
    w.x+=Math.sin(clock*0.4+w.ph)*dt*0.25+dt*0.06; w.z+=Math.cos(clock*0.3+w.ph)*dt*0.25;
    const pi=pondInfo(w.x,w.z);
    if(pi.d>rPond(pi.a)*0.9){ const w2={}; wpSpawn(w2); w.x=w2.x; w.z=w2.z; }
    const bob=Math.sin(clock*1.7+w.ph)*0.04;
    m4.makeTranslation(w.x,WATER_Y+0.14+bob,w.z); wpMesh.setMatrixAt(i,m4); }
  wpMesh.instanceMatrix.needsUpdate=true;

  // koi
  kois.forEach((k,i)=>{
    const t=clock*k.sp+k.ph;
    const wob=Math.sin(t*3+i)*1.1;
    const nx=PC.x+Math.cos(t)*15*k.ax+wob*0.35, nz=PC.z+Math.sin(t*1.3)*13*k.az+wob*0.45;
    const dx=nx-k.g.position.x,dz=nz-k.g.position.z;
    k.g.position.set(nx,0.42+Math.sin(clock*2+i)*0.05,nz);
    k.g.rotation.y=Math.atan2(-dz,dx);
    k.tail.rotation.y=Math.sin(clock*6+i*2)*0.55;
    const rs=1.7+0.5*Math.sin(clock*2+i);
    m4.makeTranslation(nx,WATER_Y+0.07,nz); sv.set(rs,1,rs); m4.scale(sv);
    ripMesh.setMatrixAt(i,m4); });
  ripMesh.instanceMatrix.needsUpdate=true;
  sv.set(1,1,1);

  // shishi-odoshi
  { const u=(clock*0.6)%6.4;
    let rot=0.12;
    if(u>=3.4&&u<3.9) rot=lerp(0.12,-0.72,(u-3.4)/0.5);
    else if(u>=3.9&&u<4.15) rot=lerp(-0.72,0.55,(u-3.9)/0.25);
    else if(u>=4.15) rot=0.55*Math.exp(-(u-4.15)*2.0)+0.12;
    shishi.tube.rotation.x=rot; }

  // wildlife, sky traffic
  turtle.position.y=2.4+Math.sin(clock*0.7)*0.05;
  birds.forEach(b=>{ b.a+=dt*b.sp;
    b.g.position.set(PG.x+Math.cos(b.a)*b.r,b.y+Math.sin(clock*0.6+b.ph)*2,PG.z+Math.sin(b.a)*b.r);
    b.g.rotation.y=-b.a+Math.PI/2;
    const flap=Math.sin(clock*9+b.ph)*0.6; b.wl.rotation.x=flap; b.wr.rotation.x=-flap; });
  dflies.forEach(d=>{ d.a+=dt*d.sp;
    d.g.position.set(PC.x+Math.cos(d.a)*d.r,WATER_Y+1.2+Math.sin(clock*2+d.ph)*0.3,PC.z+Math.sin(d.a*1.2)*d.r);
    d.g.rotation.y=-d.a; });
  clouds.forEach(c=>{ c.position.x+=dt*c.userData.v; if(c.position.x>150) c.position.x=-150; });
  { const pos=ffGeo.attributes.position.array;
    for(let i=0;i<N_FF;i++){ const b=ffBase[i];
      pos[i*3]=b.x+Math.sin(clock*b.sp+b.ph)*1.2;
      pos[i*3+1]=b.y+Math.sin(clock*b.sp*0.7+b.ph*2)*0.7;
      pos[i*3+2]=b.z+Math.cos(clock*b.sp*0.9+b.ph)*1.2; }
    ffGeo.attributes.position.needsUpdate=true; }
  stars.material.size=1.7+Math.sin(clock*3)*0.25;

  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); });

const H=(location.hash||'').replace('#','').toLowerCase();
if(VIEWS[H]){ const v=VIEWS[H];
  ctl.target.set(...v.t); ctl.gT.copy(ctl.target);
  ctl.theta=ctl.gTheta=v.th; ctl.phi=ctl.gPhi=v.ph; ctl.r=ctl.gR=v.r; }
if(VIEWS[H]){ document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===H)); }
if(H==='night') dayT=0.86; else if(H==='morning') dayT=0.27; else if(H==='cycle') cycling=true;
if(H==='night'||H==='morning')document.querySelectorAll('[data-time]').forEach(b=>b.classList.toggle('on',b.dataset.time===(H==='night'?'0.86':'0.27')));
updateDayNight();
tick();
document.getElementById('loading').style.display='none';
</script>
</body>
