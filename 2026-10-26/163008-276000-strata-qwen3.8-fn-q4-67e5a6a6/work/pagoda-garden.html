<script type="importmap">
{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ══════════════════════════════ utilities ══════════════════════════════ */
let seed = 20261026;
const rand = () => { seed = (seed*1664525 + 1013904223)>>>0; return seed/4294967296; };
const h2 = (x,y)=>{ let n=(x*374761393 + y*668265263)|0; n=Math.imul(n^(n>>>13),1274126177); return ((n^(n>>>16))>>>0)/4294967296; };
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=smooth(x-xi),yf=smooth(y-yi);
  const a=h2(xi,yi),b=h2(xi+1,yi),c=h2(xi,yi+1),d=h2(xi+1,yi+1);
  return lerp(lerp(a,b,xf),lerp(c,d,xf),yf);}
const C = s=>parseInt(s.slice(1),16);
function shade(c,f){const r=(c>>16&255),g=(c>>8&255),b=(c&255);
  return (Math.min(255,r*f|0)<<16)|(Math.min(255,g*f|0)<<8)|Math.min(255,b*f|0);}
function mix(c1,c2,t){const r1=c1>>16&255,g1=c1>>8&255,b1=c1&255,r2=c2>>16&255,g2=c2>>8&255,b2=c2&255;
  return (r1+(r2-r1)*t|0)<<16|(g1+(g2-g1)*t|0)<<8|(b1+(b2-b1)*t|0);}
const pick = a=>a[(rand()*a.length)|0];

/* ══════════════════════════════ palette ══════════════════════════════ */
const PAL = {
  grass:[C('#5da247'),C('#67ae52'),C('#539740'),C('#71b95c'),C('#4c8c3c')],
  moss :C('#3f7a35'), dirt:C('#8a6f4d'), dirtDark:C('#6e573b'),
  stone:[C('#9aa0a6'),C('#878d94'),C('#adb3b9'),C('#767c83')],
  stoneDark:C('#5c6167'), granite:C('#b9bec4'),
  sand :C('#efe6cf'), sandGroove:C('#d3c6a3'),
  red  :C('#c93a2b'), redDk:C('#9c2a1e'), redLt:C('#dd4c33'),
  white:C('#f2ead9'), cream:C('#e9dfc8'),
  tile :C('#33455f'), tileDk:C('#26364e'), tileLt:C('#425877'),
  gold :C('#f0c24a'), goldDk:C('#c99a2e'),
  wood :C('#7a5230'), woodDk:C('#5d3d22'), woodLt:C('#93683f'),
  bamboo:C('#7fae3e'), bambooDk:C('#5c8330'), bambooLt:C('#9cc55c'), bambooJt:C('#48682a'),
  sakP:['#ffdcea','#ffc4dd','#f7a8cb','#ee93bd','#ffe9f3'].map(C),
  momi :['#d94f2b','#c23a20','#e07a3a','#b23322','#e89a3c'].map(C),
  pine :['#2f6b3f','#3c7d4c','#28583a','#458a57'].map(C),
  azalP:C('#e1679b'), azalV:C('#b565d6'), azalG:C('#5ea44f'),
  bambooLeaf:C('#4e7f33'), lotusP:C('#f3a5c8'), lotusW:C('#fdf3f6'),
  water:C('#4fa8c9'), waterDk:C('#2f7fa8'), shoji:C('#efe6c8'),
};

/* ══════════════════════════ voxel stores ══════════════════════════════ */
const OM = new Map();   // opaque  key x|y|z -> color
const GM = new Map();   // emissive glow
const WM = new Map();   // animated water
const SM = new Map();   // static thin deco (lily pads, lotus)  -> {c,sy}
const K = (x,y,z)=>x+'|'+y+'|'+z;
function put(x,y,z,c){x=Math.round(x);y=Math.round(y);z=Math.round(z);
  if(Math.abs(x)>66||Math.abs(z)>66||y<-6||y>70)return;
  OM.set(K(x,y,z),shade(c, .93+.14*rand()));}
function putG(x,y,z,c){GM.set(K(Math.round(x),Math.round(y),Math.round(z)),c);}
function putW(x,y,z,c){x=Math.round(x);z=Math.round(z);OM.delete(K(x,0,z));WM.set(K(x,y,z),c);}
function putS(x,y,z,c,sy){SM.set(K(Math.round(x),Math.round(y),Math.round(z)),{c,sy:sy||0.22});}
function box(x0,y0,z0,x1,y1,z1,c){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)put(x,y,z,c);}
function ell(cx,cy,cz,rx,ry,rz,c,rough=true){
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
  for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
    if(d<=1 && (!rough || d<0.66 || rand()<(1.18-d)*2.1)) put(x,y,z,c);}}
function line(ax,ay,az,bx,by,bz,c,thick=0){const n=Math.ceil(Math.hypot(bx-ax,by-ay,bz-az)*2);
  for(let i=0;i<=n;i++){const t=i/n;const x=Math.round(lerp(ax,bx,t)),y=Math.round(lerp(ay,by,t)),z=Math.round(lerp(az,bz,t));
    put(x,y,z,c); if(thick>0)for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++) if(dx*dx+dz*dz<=thick*thick&&rand()<.8)put(x+dx,y,z+dz,c);}}

/* layout anchors */
const PG = {x:-30, z:-24};
const POND = [{x:22,z:12,rx:16.5,rz:10.5},{x:15,z:24,rx:7,rz:5}];
const inPond=(x,z)=>POND.some(p=>(((x-p.x)/p.rx)**2+((z-p.z)/p.rz)**2)<1);
const SAKURA=[{x:-6,z:5,r:5.2},{x:35,z:27,r:4},{x:-42,z:2,r:4.6},{x:16,z:42,r:3.4},{x:-16,z:-42,r:4.2},{x:44,z:20,r:3}];
const pathPts=[{x:26,z:58},{x:29,z:46},{x:27,z:38},{x:20,z:31},{x:11,z:28},{x:4,z:22},{x:1,z:13},{x:-3,z:3},{x:-9,z:-4},{x:-16,z:-8},{x:-23,z:-9},{x:-30,z:-9}];
function distPath(x,z){let m=1e9;for(let i=0;i<pathPts.length-1;i++){const a=pathPts[i],b=pathPts[i+1];
  const dx=b.x-a.x,dz=b.z-a.z;const t=Math.max(0,Math.min(1,((x-a.x)*dx+(z-a.z)*dz)/(dx*dx+dz*dz)));
  m=Math.min(m,Math.hypot(x-(a.x+dx*t),z-(a.z+dz*t)));}return m;}
const ZEN={x0:-19,x1:0,z0:37,z1:50};
const inZen=(x,z)=>x>=ZEN.x0&&x<=ZEN.x1&&z>=ZEN.z0&&z<=ZEN.z1;
const GROVE={x0:42,x1:60,z0:32,z1:52};
const inGrove=(x,z)=>x>=GROVE.x0&&x<=GROVE.x1&&z>=GROVE.z0&&z<=GROVE.z1;
const HILL={x:52,z:-6,r:10};
function hillH(x,z){const d=Math.hypot(x-HILL.x,z-HILL.z);return Math.max(0,HILL.r-d)*0.95;}
const FALL={x:35,z:9};
const glowSpots=[];
function buildGround(){
  for(let x=-64;x<=64;x++)for(let z=-64;z<=64;z++){
    if(inPond(x,z)){ put(x,-1,z, mix(PAL.dirtDark,PAL.stoneDark, vnoise(x*.3,z*.3)));
      if(vnoise(x*.5+9,z*.5)<0.42) put(x,-1,z, shade(PAL.moss,.8)); continue; }
    let c = PAL.grass[(vnoise(x*.22+3,z*.22+7)*PAL.grass.length)|0];
    if(vnoise(x*.07,z*.07)>0.72) c = mix(c,PAL.moss,0.6);
    const dp=distPath(x,z);
    if(dp<1.7) c = mix(c,C('#a0885f'),0.55); else if(dp<2.6) c = mix(c,PAL.dirt,0.3);
    for(const s of SAKURA){const d=Math.hypot(x-s.x,z-s.z);
      if(d<s.r+3.5 && rand()<Math.max(0,0.5*(1-(d-2)/s.r))) c=mix(c,PAL.sakP[1],0.55);}
    if(inZen(x,z)) continue;
    if(inGrove(x,z)&&rand()<0.7) c=mix(c,PAL.bambooDk,0.5);
    put(x,0,z,c);
    put(x,-1,z,PAL.dirt);
    if(rand()<0.3)put(x,-2,z,PAL.dirtDark);
  }
  // pond water
  for(let x=-64;x<=64;x++)for(let z=-64;z<=64;z++){ if(!inPond(x,z))continue;
    const p=POND[0]; const dc=Math.hypot((x-p.x)/p.rx,(z-p.z)/p.rz);
    putW(x,0,z, mix(PAL.water,PAL.waterDk, Math.min(1,dc*1.4))); }
  // zen sand: circles around rocks + wavy parallel rake
  const rocks=[[-14,42],[-6,46],[-2,40]];
  for(let x=ZEN.x0;x<=ZEN.x1;x++)for(let z=ZEN.z0;z<=ZEN.z1;z++){
    const nearR=rocks.map(r=>Math.hypot(x-r[0],z-r[1])).sort((a,b)=>a-b)[0];
    const groove = nearR<6.2 ? (((nearR*1.25)|0)%2===0) : (Math.sin(z*0.8+vnoise(x*.15,z*.15)*6)>0.55);
    put(x,0,z, groove?PAL.sandGroove:shade(PAL.sand,.96+.06*rand()));
    put(x,-1,z,PAL.dirt);
  }
  for(let x=ZEN.x0-1;x<=ZEN.x1+1;x++){put(x,1,ZEN.z0-1,PAL.stoneDark);put(x,1,ZEN.z1+1,PAL.moss);}
  for(let z=ZEN.z0-1;z<=ZEN.z1+1;z++){put(ZEN.x0-1,1,z,PAL.stoneDark);put(ZEN.x1+1,1,z,PAL.moss);}
  // zen rocks
  ell(-14,1.9,42,1.9,1.7,1.4,PAL.stoneDark);ell(-13,2.9,42,0.9,0.7,0.7,PAL.stone[1]);
  ell(-6,1.8,46.2,1.3,1.4,1.1,PAL.stone[2]);ell(-7.5,1.4,45.5,0.8,0.7,0.6,PAL.stoneDark);
  ell(-1.6,1.5,40,1,1,0.9,PAL.stone[0]);
  ell(-15,1.4,44,1.1,0.6,1,PAL.moss);ell(-4,1.3,44.5,1.3,0.6,0.9,PAL.moss);
  // stepping stones along the path
  for(let i=0;i<pathPts.length-1;i++){const a=pathPts[i],b=pathPts[i+1];const L=Math.hypot(b.x-a.x,b.z-a.z);const n=Math.ceil(L/2.1);
    for(let j=0;j<n;j++){const t=j/n,x=Math.round(lerp(a.x,b.x,t)),z=Math.round(lerp(a.z,b.z,t));
      const off=(j%2)?0.9:-0.9;const px=Math.round(x+ (-(b.z-a.z)/L)*off), pz=Math.round(z+((b.x-a.x)/L)*off);
      put(px,1,pz, pick(PAL.stone)); put(px+1,1,pz, mix(PAL.stone[0],PAL.stoneDark,.4));
      if(rand()<.4)put(px,1,pz+1,PAL.stone[2]); if(rand()<.15)put(px,1,pz,PAL.moss);}}
}

/* ══════════════════════════════ pond furniture ══════════════════════════════ */
function buildPond(){
  // rim rocks around shoreline
  for(let x=-64;x<=64;x++)for(let z=-64;z<=64;z++){ if(!inPond(x,z))continue;
    let land=0;for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]) if(!inPond(x+dx,z+dz)) land++;
    if(land>0 && h2(x*3+1,z*3+7)<0.16){ put(x,1,z,pick(PAL.stone)); if(rand()<.4)put(x,2,z,pick(PAL.stone));
      if(rand()<.3)put(x,1,z+ (rand()<.5?1:-1),PAL.moss); } }
  // island
  const ix=24,iz=10;
  for(let x=ix-3;x<=ix+3;x++)for(let z=iz-2;z<=iz+2;z++)
    if(((x-ix)/3.2)**2+((z-iz)/2.4)**2<1){WM.delete(K(x,0,z));put(x,0,z,pick(PAL.stone));}
  for(let x=ix-2;x<=ix+2;x++)for(let z=iz-2;z<=iz+2;z++)
    if(((x-ix)/2.4)**2+((z-iz)/1.8)**2<1)put(x,1,z,PAL.grass[1]);
  pineTree(ix+0.5,iz,2.6,true,2);
  ell(ix-2,1.6,iz+1,0.9,0.7,0.9,PAL.stone[0]);
  // lily pads + lotus blossoms
  for(let i=0;i<26;i++){const a=rand()*6.28, r0=4+rand()*8;
    const x=Math.round(22+Math.cos(a)*r0*1.4), z=Math.round(12+Math.sin(a)*r0);
    if(inPond(x,z)){putS(x,1,z,PAL.moss,0.2);
      if(rand()<.35){putS(x,1,z,PAL.lotusP,0.5); if(rand()<.5)putS(x+1,1,z+1,PAL.lotusW,0.5);}}}
  // rocky spout where the stream leaves
  box(34,1,17,35,1,18,PAL.stoneDark);
  // stream: pond -> tsukubai basin
  const stream=[[34,19],[35,21],[36,23],[37,25],[38,27],[38,29],[37,31],[35,32],[33,33]];
  for(const [x,z] of stream){putW(x,0,z,PAL.water);put(x,-1,z,PAL.stoneDark);
    if(rand()<.5)put(x+ (rand()<.5?1:-1),1,z,PAL.stone[(rand()*4)|0]);}
}

/* ══════════════════════════════ pagoda ══════════════════════════════ */
function roof(cx,cz,y,hw,over){
  const rh=hw+over; let topY=y;
  for(let k=0;k<=4;k++){
    const hh=rh-k*2, yy=y+k; if(hh<1)break;
    for(let dx=-hh;dx<=hh;dx++)for(let dz=-hh;dz<=hh;dz++){
      const edge=Math.max(Math.abs(dx),Math.abs(dz))===hh;
      const corner=Math.abs(dx)>=hh-1&&Math.abs(dz)>=hh-1;
      if(!edge&&!corner)continue;
      put(cx+dx,yy,cz+dz,(corner||((dx+dz+k)%3===0))?PAL.tileLt:PAL.tile);
      if(corner&&edge){put(cx+dx,yy+1,cz+dz,PAL.tileLt);if(k===0)put(cx+dx,yy+2,cz+dz,PAL.gold);}
    }
    if(hh<=2){for(let dx=-hh;dx<=hh;dx++)for(let dz=-hh;dz<=hh;dz++)put(cx+dx,yy,cz+dz,PAL.tile);topY=yy;}
  }
  put(cx,topY+1,cz,PAL.gold);put(cx,topY+2,cz,PAL.gold);
  for(let dx=-rh;dx<=rh;dx++){put(cx+dx,y-1,cz-rh,PAL.tileDk);put(cx+dx,y-1,cz+rh,PAL.tileDk);}
  for(let dz=-rh;dz<=rh;dz++){put(cx-rh,y-1,cz+dz,PAL.tileDk);put(cx+rh,y-1,cz+dz,PAL.tileDk);}
}
function storyWalls(cx,cz,y,hw,h,door=false){
  for(let dy=0;dy<h;dy++){const yy=y+dy;
    for(let dx=-hw;dx<=hw;dx++)for(let dz=-hw;dz<=hw;dz++){
      if(Math.max(Math.abs(dx),Math.abs(dz))!==hw)continue;
      const corner=Math.abs(dx)===hw&&Math.abs(dz)===hw;
      const mid=(dx===0||dz===0)&&hw>=5&&!corner;
      const win=(dy>=1&&dy<=h-3)&&(((Math.abs(dx)===hw&&Math.abs(dz)===2)||(Math.abs(dz)===hw&&Math.abs(dx)===2)));
      if(win){ if(dy===h-3) putG(cx+dx,yy,cz+dz,0xffcf8a);   else put(cx+dx,yy,cz+dz,PAL.shoji); continue; }
      if(door&&dy<h-1&&Math.abs(dx+0.5)<=1.5&&dz===hw){ continue; }   // opening handled below
      let c=(corner||mid||dy===0)?((dy===h-1)?PAL.redDk:PAL.red):PAL.white;
      put(cx+dx,yy,cz+dz,c);
    }}
  // tokyō bracket band
  const by=y+h;
  for(let dx=-hw-1;dx<=hw+1;dx++)for(let dz=-hw-1;dz<=hw+1;dz++){
    if(Math.max(Math.abs(dx),Math.abs(dz))!==hw+1)continue;
    put(cx+dx,by,cz+dz,(Math.abs(dx)===hw+1&&Math.abs(dz)===hw+1)?PAL.redDk:PAL.red);}
  if(door){
    for(let dy=0;dy<h-1;dy++){putG(cx-1,y+dy,cz+hw,0xffb46a);putG(cx,y+dy,cz+hw,0xffc07a);
      if(dy!==h-3){put(cx-2,y+dy,cz+hw,PAL.red);put(cx+1,y+dy,cz+hw,PAL.red);}}
    for(let dx=-2;dx<=1;dx++)put(cx+dx,y+h-1,cz+hw,PAL.wood);
  }
}
function railing(cx,cz,y,hw){
  for(let dx=-hw-1;dx<=hw+1;dx++)for(let dz=-hw-1;dz<=hw+1;dz++){
    if(Math.max(Math.abs(dx),Math.abs(dz))!==hw+1)continue;
    const corner=Math.abs(dx)===hw+1&&Math.abs(dz)===hw+1;
    if(corner||((dx+97)*(dz+97))%2===0){put(cx+dx,y,cz+dz,PAL.redDk);put(cx+dx,y+1,cz+dz,PAL.red);}
    else put(cx+dx,y+1,cz+dz,PAL.redLt);}
}
function buildPagoda(){
  const cx=PG.x, cz=PG.z;
  box(cx-9,1,cz-11, cx+9,2,cz+9, PAL.granite);
  box(cx-8,3,cz-10, cx+8,3,cz+8, PAL.stone[0]);
  for(let x=cx-3;x<=cx+3;x++){put(x,1,cz+10,PAL.granite);put(x,2,cz+10,PAL.granite);}
  for(let x=cx-2;x<=cx+2;x++)put(x,1,cz+11,PAL.stone[1]);

/* ══════════════════════════════ fences & scattered details ══════════════════════════════ */
function buildFences(){
  const R=60;
  const n2=(a,b,c,d)=>Math.max(Math.abs(c-a),Math.abs(d-b));
  const edge=(x0,z0,x1,z1)=>{const N=n2(x0,z0,x1,z1);
    for(let i=0;i<=N;i+=3){const x=Math.round(lerp(x0,x1,i/N)), z=Math.round(lerp(z0,z1,i/N));
      if(z>=R-1&&x>=21&&x<=31)continue;                       // gate opening for the torii
      if(inPond(x,z)||inGrove(x,z)||hillH(x,z)>1)continue;
      put(x,1,z,PAL.bambooDk);put(x,2,z,PAL.bamboo);put(x,3,z,PAL.bambooLt);}
    for(let i=0;i<=N;i+=1){const x=Math.round(lerp(x0,x1,i/N)), z=Math.round(lerp(z0,z1,i/N));
      if(z>=R-1&&x>=21&&x<=31)continue;
      if(inPond(x,z)||inGrove(x,z)||hillH(x,z)>1)continue;
      put(x,3,z,PAL.bambooLt);}};
  edge(-R,-R,R,-R);edge(R,-R,R,R);edge(R,R,-R,R);edge(-R,R,-R,-R);
  for(let x=ZEN.x0;x<=ZEN.x1;x+=2){put(x,1,ZEN.z1+3,PAL.woodDk);put(x,2,ZEN.z1+3,PAL.bamboo);put(x,3,ZEN.z1+3,PAL.woodDk);}
}

}

const deco   = buildInstanced(SM,new THREE.MeshLambertMaterial(),false,e=>e.sy);

const wKeys=[...WM.keys()].map(k=>k.split('|').map(Number));

/* koi */
const KOI=[{a:0.0,r:6.5,sp:0.16,off:0,cols:[0xf07a2a,0xffffff,0xe0442a]},{a:2.1,r:9,sp:0.12,off:3,cols:[0xffffff,0xf07a2a,0xffffff]},
 {a:4.0,r:5,sp:0.2,off:1,cols:[0xe0442a,0xffffff,0xe0442a]},{a:1.2,r:11,sp:0.1,off:5,cols:[0xf07a2a,0xf07a2a,0xffffff]},
 {a:5.3,r:7.8,sp:0.14,off:2,cols:[0xffffff,0xe0442a,0xf07a2a]}];
const koiBody=[[0,0],[0.8,0.15],[1.7,0.1],[2.5,0.35],[3.2,-0.1]];
const koiMesh=new THREE.InstancedMesh(unit,new THREE.MeshLambertMaterial(),koiBody.length*KOI.length);
scene.add(koiMesh);

/* waterfall */
const FALL_STEPS=6, fallN=Math.max(1,fallCells.length*FALL_STEPS);
const fallMesh=new THREE.InstancedMesh(unit,new THREE.MeshLambertMaterial({transparent:true,opacity:0.85}),fallN);
scene.add(fallMesh);
{const c=new THREE.Color();for(let i=0;i<fallN;i++){c.setHex(mix(0xbfe6f2,0xffffff,((i%FALL_STEPS)/FALL_STEPS)*0.9));fallMesh.setColorAt(i,c);}}

/* petals */
const PET_N=650, PETS=[];
const petalMesh=new THREE.InstancedMesh(new THREE.PlaneGeometry(0.62,0.46),
  new THREE.MeshLambertMaterial({side:THREE.DoubleSide,transparent:true,opacity:0.95}),PET_N);
scene.add(petalMesh);
const petalCols=[0xffdcea,0xffc4dd,0xf7a8cb];
function respawnPetal(p){const s=SAKURA[(rand()*SAKURA.length)|0];
  p.x=s.x+(rand()*2-1)*s.r; p.z=s.z+(rand()*2-1)*s.r; p.y=9+rand()*15;
  p.vy=-(0.5+rand()*0.9); p.sw=rand()*6.28; p.swr=0.7+rand()*1.6; p.rx=rand()*6.28; p.rz=rand()*6.28; p.life=0;}
{const c=new THREE.Color();for(let i=0;i<PET_N;i++){const p={};respawnPetal(p);p.y=rand()*24;PETS.push(p);
  c.setHex(pick(petalCols));petalMesh.setColorAt(i,c);}}

/* clouds */
const CLOUDS=[];const cloudMesh=new THREE.InstancedMesh(unit,new THREE.MeshLambertMaterial({transparent:true,opacity:0.96,emissive:0xcdd9ea,emissiveIntensity:0.5}),180);
scene.add(cloudMesh);{let i=0;for(let g=0;g<12;g++){const cx=(rand()*2-1)*160, cy=88+rand()*22, cz=(rand()*2-1)*160, n=15;
  const blobs=[];for(let k=0;k<n;k++)blobs.push([(rand()*2-1)*9,(rand()*2-1)*1.1,(rand()*2-1)*6,3.5+rand()*4.5]);
  blobs[0][3]+=4;
  CLOUDS.push({i0:i,cx,cy,cz,sp:0.5+rand()*0.7,blobs});i+=n;}}

/* fireflies + stars */
const ffGeo=new THREE.BufferGeometry(); const FFN=70; const ffPos=new Float32Array(FFN*3); const ffBase=[];
for(let i=0;i<FFN;i++){const s=SAKURA[i%SAKURA.length];const x=s.x+(rand()*2-1)*7,y=1.5+rand()*4,z=s.z+(rand()*2-1)*7;
  ffBase.push([x,y,z,rand()*6.28,rand()*6.28]);ffPos.set([x,y,z],i*3);}
ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const fireflies=new THREE.Points(ffGeo,new THREE.PointsMaterial({color:0xffe08a,size:0.7,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
scene.add(fireflies);
const stGeo=new THREE.BufferGeometry();const STN=380;const stPos=new Float32Array(STN*3);
for(let i=0;i<STN;i++){const a=rand()*6.28,e=rand()*1.25,r=520;
  stPos.set([Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r+30, Math.sin(a)*Math.cos(e)*r],i*3);}
stGeo.setAttribute('position',new THREE.BufferAttribute(stPos,3));
const stars=new THREE.Points(stGeo,new THREE.PointsMaterial({color:0xffffff,size:2.2,transparent:true,opacity:0,depthWrite:false}));scene.add(stars);

/* sun & moon orbs */
const sunOrb=new THREE.Mesh(new THREE.SphereGeometry(8,12,12),new THREE.MeshBasicMaterial({color:0xfff3c4,toneMapped:false,fog:false}));
sunOrb.position.copy(sun.position).multiplyScalar(3.6);scene.add(sunOrb);
const moonOrb=new THREE.Mesh(new THREE.SphereGeometry(6,12,12),new THREE.MeshBasicMaterial({color:0xcfd8ff,toneMapped:false,fog:false,transparent:true}));
moonOrb.position.set(-200,250,-160);moonOrb.visible=false;scene.add(moonOrb);

/* chōchin */
const chochins=[];
function chochin(x,y,z){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,1.5,8),new THREE.MeshBasicMaterial({color:0xffb46a,toneMapped:false}));
  const cap=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.18,0.5),new THREE.MeshLambertMaterial({color:0x9c2a1e}));cap.position.y=0.85;
  const stick=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.8,0.08),new THREE.MeshLambertMaterial({color:0x5d3d22}));stick.position.y=1.2;
  const kanji=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.8,0.66),new THREE.MeshBasicMaterial({color:0x7a2818,toneMapped:false}));kanji.position.set(0.62,0,0);
  g.add(body,cap,stick,kanji);g.position.set(x,y,z);scene.add(g);
  const L=new THREE.PointLight(0xffa246,0,14,1.8);L.position.set(x,y,z);scene.add(L);
  chochins.push({g,L,ph:rand()*6});}
chochin(PG.x-4,10,PG.z+9);chochin(PG.x+4,10,PG.z+9);
chochin(24,6.6,56);chochin(28,6.6,56);
chochin(2,4,-11);

/* shishi-odoshi + bell (animated groups) */
const shishi=new THREE.Group();
{const tube=new THREE.Mesh(new THREE.BoxGeometry(0.34,3.4,0.34),new THREE.MeshLambertMaterial({color:0x7fae3e}));tube.position.y=0.6;
 const notch=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.3,0.42),new THREE.MeshLambertMaterial({color:0x48682a}));notch.position.y=2.15;
 shishi.add(tube,notch); shishi.position.set(34,3,31); scene.add(shishi);}
const bell=new THREE.Group();
{const b=new THREE.Mesh(new THREE.CylinderGeometry(0.9,1.05,2.2,8),new THREE.MeshLambertMaterial({color:0x8d6e3f}));b.position.y=-1.3;
 const ring=new THREE.Mesh(new THREE.TorusGeometry(0.5,0.09,6,10),new THREE.MeshLambertMaterial({color:0x6e5427}));
 ring.rotation.x=Math.PI/2;ring.position.y=-0.25; bell.add(b,ring); bell.position.set(-46,5.1,-14); scene.add(bell);
 const beam=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.25,0.25),new THREE.MeshLambertMaterial({color:0x5d3d22}));
 beam.position.set(-44.8,3,-14); scene.add(beam);}

/* composer */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.3,0.6,0.82);
composer.addPass(bloom);

/* ══════════════════════════════ day / night ══════════════════════════════ */
const DAY={sunI:2.6,sunC:C('#fff1d6'),hemiI:0.85,top:C('#66b6ea'),bot:C('#e8f3f6'),fog:C('#d8eef8'),bloom:0.28};
const NGT={sunI:0.22,sunC:C('#93a9e8'),hemiI:0.3,top:C('#070b26'),bot:C('#28305c'),fog:C('#141a38'),bloom:0.95};
let night=false, dayT=1, dayTarget=1;
const tmpA=new THREE.Color(),tmpB=new THREE.Color();
function setDayNight(t){
  const n=smooth(Math.min(1,Math.max(0,1-t)));
  sun.intensity=lerp(DAY.sunI,NGT.sunI,n); sun.color.setHex(mix(DAY.sunC,NGT.sunC,n));
  hemi.intensity=lerp(DAY.hemiI,NGT.hemiI,n);
  skyUni.top.value.lerpColors(tmpA.setHex(DAY.top),tmpB.setHex(NGT.top),n);
  skyUni.bot.value.lerpColors(tmpA.setHex(DAY.bot),tmpB.setHex(NGT.bot),n);
  scene.fog.color.lerpColors(tmpA.setHex(DAY.fog),tmpB.setHex(NGT.fog),n);
  bloom.strength=lerp(DAY.bloom,NGT.bloom,n);
  for(const L of plights)L.intensity=16*n;
  stars.material.opacity=Math.max(0,(n-0.35))*1.5;
  moonOrb.visible=n>0.1; sunOrb.visible=n<0.7;
  fireflies.material.opacity=n;
  document.getElementById('fade').classList.toggle('night',n>0.5);
}

/* ══════════════════════════════ interaction ══════════════════════════════ */
const VIEWS=[[96,74,118,-2,16,4],[-4,26,42,-30,24,-24],[64,34,38, 16,3,13],[38,12,96,26,7,56],[6,44,96,-10,1,43]];
let tween=null, tour=false, tourIdx=0, tourT=0, idle=99;
function flyTo(i,dur=1.8){const v=VIEWS[i];tween={t:0,dur,
  p0:camera.position.clone(),p1:new THREE.Vector3(v[0],v[1],v[2]),
  g0:controls.target.clone(),g1:new THREE.Vector3(v[3],v[4],v[5])};}
controls.addEventListener('start',()=>{tween=null;idle=0;tour=false;tourT=0;document.getElementById('bTour').classList.remove('on');});
const bn=document.getElementById('bNight');
bn.onclick=()=>{night=!night;dayTarget=night?0:1;bn.textContent=night?'☀ DAY':'☾ NIGHT';bn.classList.toggle('on',night);};
document.getElementById('bTour').onclick=e=>{tour=!tour;idle=99;e.target.classList.toggle('on',tour);if(tour){tourT=0;flyTo(tourIdx=(tourIdx+1)%VIEWS.length);}};
document.getElementById('bReset').onclick=()=>{tour=false;document.getElementById('bTour').classList.remove('on');flyTo(0);};
let petalsOn=true;
document.getElementById('bPetal').onclick=e=>{petalsOn=!petalsOn;e.target.classList.toggle('on',petalsOn);};
document.querySelectorAll('.view').forEach(b=>b.onclick=()=>{tour=false;document.getElementById('bTour').classList.remove('on');flyTo(+b.dataset.v);});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='n')bn.click(); else if(k==='t')document.getElementById('bTour').click();
  else if(k==='p')document.getElementById('bPetal').click();
  else if('12345'.includes(k)){tour=false;flyTo(+k-1);}
  else if(k==='r')document.getElementById('bReset').click();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

/* ══════════════════════════════ animation loop ══════════════════════════════ */
const dummy=new THREE.Object3D(), dummyC=new THREE.Color();
const clock=new THREE.Clock();
setDayNight(1);
requestAnimationFrame(()=>{const l=document.getElementById('loader');l.style.opacity=0;setTimeout(()=>l.remove(),1100);});

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(0.05,clock.getDelta()), T=clock.elapsedTime;
  if(Math.abs(dayT-dayTarget)>0.001){dayT+=(dayTarget-dayT)*Math.min(1,dt*1.5);setDayNight(dayT);}
  if(tween){tween.t+=dt/tween.dur;const s=smooth(Math.min(1,tween.t));
    camera.position.lerpVectors(tween.p0,tween.p1,s);controls.target.lerpVectors(tween.g0,tween.g1,s);
    if(tween.t>=1){tween=null;tourT=0;}}
  if(tour&&!tween){tourT+=dt;if(tourT>4.4){tourT=0;flyTo(tourIdx=(tourIdx+1)%VIEWS.length);}}
  controls.autoRotate=!tour&&!tween&&idle>6; if(controls.autoRotate)idle=99;
  controls.update();

  /* water ripples */
  for(let i=0;i<wKeys.length;i++){const p=wKeys[i];
    const y=Math.sin(T*1.7+p[0]*0.55+p[2]*0.4)*0.07+Math.sin(T*0.9+p[2]*0.8)*0.05;
    dummy.position.set(p[0],p[1]+0.5+y,p[2]);
    const s=0.985+Math.sin(T*1.3+i*0.7)*0.015;dummy.scale.set(s,1,s);dummy.rotation.set(0,0,0);
    dummy.updateMatrix();water.setMatrixAt(i,dummy.matrix);}
  water.instanceMatrix.needsUpdate=true;

  /* koi circling the pond */
  let ki=0;
  for(const f of KOI){f.a+=dt*f.sp;
    const wob=Math.sin(T*1.6+f.off)*0.12;
    const px=22+Math.cos(f.a)*f.r*1.3, pz=12+Math.sin(f.a)*f.r*0.85, py=0.62+wob, hd=f.a+Math.PI/2;
    for(const [lx] of koiBody){
      const dirx=-Math.sin(f.a), dirz=Math.cos(f.a);
      const wag=Math.sin(T*7+ki*0.9)*0.18*Math.max(0,lx-1.2);
      dummy.position.set(px-dirx*lx-dirz*wag,py,pz-dirz*lx+dirx*wag);
      dummy.scale.set(0.75,0.38,0.55);dummy.rotation.set(0,0,0);dummy.updateMatrix();
      koiMesh.setMatrixAt(ki,dummy.matrix);
      dummyC.setHex(f.cols[ki%3]);koiMesh.setColorAt(ki,dummyC);ki++;}}
  koiMesh.instanceMatrix.needsUpdate=true;koiMesh.instanceColor.needsUpdate=true;

  /* waterfall */
  let fi=0;
  for(const [fx,fz] of fallCells){for(let c=0;c<FALL_STEPS&&fi<fallN;c++){
    const y=5.6-((T*5.2+c*0.92+fz*0.3)% 5.1);
    dummy.position.set(fx+Math.sin(T*6+c)*0.12, y, fz+Math.cos(T*5+c)*0.12);
    dummy.scale.set(1,1.2,1);dummy.rotation.set(0,0,0);dummy.updateMatrix();fallMesh.setMatrixAt(fi++,dummy.matrix);}}
  for(;fi<fallN;fi++){dummy.position.set(0,-50,0);dummy.scale.set(1,1,1);dummy.updateMatrix();fallMesh.setMatrixAt(fi,dummy.matrix);}
  fallMesh.instanceMatrix.needsUpdate=true;

  /* petals */
  petalMesh.visible=petalsOn;
  if(petalsOn){for(let i=0;i<PET_N;i++){const p=PETS[i];
    p.life+=dt;p.sw+=p.swr*dt;
    p.y+=p.vy*dt;p.x+=(Math.sin(p.sw)*0.9+(night?2.2:0.5))*dt;p.z+=Math.cos(p.sw*0.8)*0.8*dt;
    if(p.y<0.9||p.life>45)respawnPetal(p);
    dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.rx+T*1.4,p.sw,p.rz+T*0.9);dummy.scale.set(1,1,1);
    dummy.updateMatrix();petalMesh.setMatrixAt(i,dummy.matrix);}
    petalMesh.instanceMatrix.needsUpdate=true;}

  /* clouds drift */
  let ci=0;
  for(const g of CLOUDS){g.cx+=dt*g.sp;if(g.cx>200)g.cx=-200;
    for(const b of g.blobs){dummy.position.set(g.cx+b[0],g.cy+b[1]+Math.sin(T*0.4+b[2])*0.6,g.cz+b[2]);
      dummy.scale.set(b[3],b[3]*0.42,b[3]*0.75);dummy.rotation.set(0,0,0);dummy.updateMatrix();cloudMesh.setMatrixAt(ci++,dummy.matrix);}}
  cloudMesh.instanceMatrix.needsUpdate=true;

  /* fireflies wander */
  if(dayT<0.999){const pos=ffGeo.attributes.position.array;
    for(let i=0;i<FFN;i++){const b=ffBase[i];
      pos[i*3]=b[0]+Math.sin(T*0.7+b[3])*1.6;pos[i*3+1]=b[1]+Math.sin(T*1.3+b[4])*0.7;pos[i*3+2]=b[2]+Math.cos(T*0.8+b[3])*1.6;}
    ffGeo.attributes.position.needsUpdate=true;
    fireflies.material.opacity=(1-smooth(dayT))*(0.55+0.45*Math.sin(T*2.7));}

  /* shishi-odoshi: fill, tip, knock */
  const cyc=T%6.2;
  let ang=0.1*Math.sin(cyc*2.2);
  if(cyc>=4.6&&cyc<5.2)ang=lerp(0.1,-1.7,(cyc-4.6)/0.6);
  else if(cyc>=5.2)ang=lerp(-1.7,0.1,smooth((cyc-5.2)/1.0));
  shishi.rotation.z=ang;
  /* bell strike every 14s */
  const rc=T%14; bell.rotation.x= rc<2.4 ? Math.sin(rc*10)*0.16*(1-rc/2.4) : 0;
  /* chōchin sway + flicker */
  for(const c of chochins){c.g.rotation.z=Math.sin(T*1.1+c.ph)*0.06;
    c.L.intensity=(night?11:0)*(0.85+0.15*Math.sin(T*9+c.ph));}
  /* glow shimmer */
  glow.material.color.setScalar(lerp(0.5,1.4,1-smooth(dayT))*(0.96+0.04*Math.sin(T*7)));

  composer.render();
}
animate();
console.log('voxels — opaque:',OM.size,'water:',WM.size,'glow:',GM.size,'deco:',SM.size);
</script>
