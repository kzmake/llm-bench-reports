<div class="hud" id="title"><h1>五重塔の庭 &nbsp;·&nbsp; PAGODA GARDEN</h1><p>五重塔 · sakura · koi pond · stone lanterns · a whole world of little cubes</p></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================================================================
   SEEDED RNG — the whole garden replants itself identically
   ================================================================ */
let seed = 20261019;
function R(){ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; }
function pick(a){ return a[(R()*a.length)|0]; }

/* ================================================================
   PALETTE
   ================================================================ */
const P = {
  stone:0x9b9ea3, stoneD:0x767b81, stoneL:0xb4b8bc,
  tile:0x35425c,  tileD:0x27324a,  gold:0xe2a63e, goldD:0xb97f2a,
  vermilion:0xcf4436, vermilionD:0xa53229, plaster:0xf3ecda,
  wood:0x5d3f2c, woodD:0x3a281c, woodL:0x7a5638,
  water:0x3e7fae, waterD:0x2f5f86, ocean:0x35678f, foam:0xe8f1ef,
  sand:0xc8b47e, sandD:0xad9a68, shell:0xf4e7d8,
  gravel:0xd8d3c4, gravelD:0xbdb6a4,
  grass:0x56884f, grassD:0x456f3e, grassL:0x6d9c5c, clover:0x8fbf74,
  dirt:0x7c5f3e,
  pink1:0xf9cfd9, pink2:0xf3aec7, pink3:0xeb8fb1, pink4:0xfce4ec, pinkDeep:0xd96f97,
  maple:0xb23a2a, mapleO:0xd66a2b, mapleR:0x8e2f26, mapleY:0xc98f2e,
  pine:0x2e5b3c, pineL:0x3b7148,
  bamboo:0x86a85e, bambooD:0x6b8c48, bambooY:0xc8d46f,
  willow:0x9dbb6a, willowD:0x7ea356,
  flowers:[0xe34e6b,0xf2f0e6,0xf0c53c,0xe07fb8,0xf7f4ea,0xf4813f,0xa855c8],
  white:0xffffff, dark:0x1c1c22, snow:0xf3f6f8,
  mtn:0x51637a, mtnD:0x41526a,
};

const _c = new THREE.Color();
function mul(hex,f){ _c.setHex(hex); _c.multiplyScalar(f); return _c.getHex(); }
function j(hex,amt){ return mul(hex, 1-amt*0.5 + R()*amt); }

/* ================================================================
   VOXEL BUFFERS  (dedup by coordinate; later write wins)
   ================================================================ */
const wIdx=new Map(), wPos=[], wCol=[];      // static opaque
const vIdx=new Map(), vPos=[], vCol=[];      // water (transparent)
const E=[];                                   // emissive glow cubes
const lights=[];                              // flicker point lights {x,y,z,color,intensity,dist}
const cherrySpots=[];                         // petal fall sources

const K=(x,y,z)=>x+','+y+','+z;
function S(x,y,z,c){ const k=K(x,y,z); const i=wIdx.get(k); if(i!==undefined) wCol[i]=c; else { wIdx.set(k,wPos.length/3); wPos.push(x,y,z); wCol.push(c); } }
function SW(x,y,z,c){ const k=K(x,y,z); const i=vIdx.get(k); if(i!==undefined) vCol[i]=c; else { vIdx.set(k,vPos.length/3); vPos.push(x,y,z); vCol.push(c); } }
function del(x,y,z){ wIdx.delete(K(x,y,z)); }

function box(x1,x2,y1,y2,z1,z2,c,ja=0){
  if(z2>300||x2>300||y2>300||Math.abs(c)>0xffffff) throw new Error(`box() malformed bounds: ${x1},${x2},${y1},${y2},${z1},${z2}`);
  for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)for(let z=z1;z<=z2;z++)
    S(x,y,z, ja? j(c,ja): c);
}
function ringSq(half,y,c,ja=0.06){
  for(let x=-half;x<=half;x++)for(let z=-half;z<=half;z++)
    if(Math.max(Math.abs(x),Math.abs(z))===half) S(x,y,z, j(c,ja));
}
function ellipsoid(cx,cy,cz,rx,ry,rz,cols,gap=0.18){
  for(let x=Math.ceil(cx-rx);x<=Math.floor(cx+rx);x++)
  for(let y=Math.ceil(cy-ry);y<=Math.floor(cy+ry);y++)
  for(let z=Math.ceil(cz-rz);z<=Math.floor(cz+rz);z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
    if(d<=1 && R()>gap) S(x,y,z, j(pick(cols),0.07));
  }
}

/* ================================================================
   LAND, BEACH, OCEAN, POND
   ================================================================ */
const R_ISLE=74, R_OCEAN=118;
const inPond     = (x,z)=> ((x-30)/12.5)**2+((z-15)/8.5)**2<=1 || ((x-38)/7.5)**2+((z-22)/6.5)**2<=1;
const inPondEdge = (x,z)=> ((x-30)/14.4)**2+((z-15)/10.4)**2<=1 || ((x-38)/9.4)**2+((z-22)/8.4)**2<=1;

function land(){
  for(let x=-R_OCEAN;x<=R_OCEAN;x++)for(let z=-R_OCEAN;z<=R_OCEAN;z++){
    const d=Math.hypot(x,z);
    if(d>R_OCEAN) continue;
    if(d>R_ISLE){                                   // ocean
      if(d<R_ISLE+1.7) SW(x,0,z, j(P.foam,0.05));
      else SW(x,0,z, j(mul(P.ocean,0.88+0.22*Math.abs(Math.sin(x*0.24+z*0.19))),0.05));
      continue;
    }
    if(inPond(x,z)){
      del(x,0,z); del(x,-1,z);
      S(x,-1,z, j(mul(P.waterD,0.62),0.1));         // muddy bottom
      SW(x,0,z, j(R()<0.22?P.waterD:P.water,0.08));
      continue;
    }
    if(d>R_ISLE-6){                                 // beach
      S(x,0,z, j(R()<0.25?P.sandD:P.sand,0.05));
      if(R()<0.012) S(x,1,z, j(pick([P.shell,P.stoneL,mul(P.sandD,1.2)]),0.04));
      continue;
    }
    if(d>R_ISLE-8) S(x,-1,z, j(P.dirt,0.1));        // soil under grass near cliffs
    let c = R()<0.16?P.grassD : R()<0.36?P.grassL : P.grass;
    if(R()<0.012) c=P.clover;
    S(x,0,z, j(c,0.06));
    if(R()<0.006){ S(x,1,z,P.grassL); if(R()<0.5) S(x,2,z,pick([0xd9d3f2,0xf6e9a0,0xffffff])); }
    if(R()<0.0016){ S(x,1,z,P.mapleY); S(x,1,z+1,mul(P.stoneL,0.9)); }   // pebble + dried leaf
  }
  // grass top for pond-edge stones (drawn after)
  for(let x=8;x<=52;x++)for(let z=-4;z<=36;z++)
    if(inPondEdge(x,z)&&!inPond(x,z)){ del(x,0,z); S(x,0,z, R()<0.5? j(P.stone,0.1) : (R()<0.5? j(P.stoneD,0.1): j(P.grassD,0.1))); }
  // cliff rim
  for(let x=-R_ISLE;x<=R_ISLE;x++)for(let z=-R_ISLE;z<=R_ISLE;z++){
    const d=Math.hypot(x,z);
    if(d>R_ISLE-1.1&&d<=R_ISLE){ S(x,-1,z,j(P.stoneD,0.08)); S(x,-2,z,j(P.dirt,0.1)); }
  }
  // stepping stones
  [[19,24],[23,26],[27,27],[31,26]].forEach(([x,z])=>{ S(x,1,z,j(P.stoneL,0.05)); S(x+1,1,z,j(P.stone,0.05)); });
}

function lilies(){
  for(const [x,z] of [[24,11],[27,19],[33,11],[36,25],[21,17],[31,19],[41,20]]){
    for(let dx=0;dx<2;dx++)for(let dz=0;dz<2;dz++)
      if(!(dx===1&&dz===1)) S(x+dx,1,z+dz, j(R()<0.7?P.pineL:P.grassD,0.08));
    S(x+(R()<0.5?0:1),2,z+(R()<0.5?0:1), pick([P.pink1,P.pink3,P.white]));
  }
}

/* ================================================================
   THE FIVE-STORY PAGODA  五重塔
   ================================================================ */
const SWd=[8,7,6,5,4], SHd=[6,5,5,4,4], SYd=[3,13,22,30,38], RYd=[9,18,26,34,42];
function pagoda(){
  /* platform */
  box(-13,13,1,1,-13,13,P.stoneD,0.05);
  box(-12,12,1,2,-12,12,P.stone,0.06);
  ringSq(12,2,P.stoneD,0.08);
  box(-3,3,1,1,13,13,P.stoneL,0.04); box(-3,3,1,1,14,14,P.stone,0.04);   // front stair
  box(-4,4,0,0,15,15,P.stoneL,0.04);
  for(const sx of[-11,11])for(const sz of[-11,11]){                      // corner posts + lantern orbs
    S(sx,3,sz,P.woodD); S(sx,4,sz,P.gold);
    S(sx,5,sz,0xffcf8a); E.push({x:sx,y:5,z:sz,c:0xffcf8a});
    S(sx,6,sz,mul(P.goldD,1.15));
  }
  lights.push({x:11,y:5,z:11,color:0xffc878,intensity:7,dist:18});
  lights.push({x:-11,y:5,z:11,color:0xffc878,intensity:7,dist:18});
  /* stories + roofs */
  box(0,0,SYd[0],RYd[4]+SWd[4]+3+1,0,0,P.wood,0.04);                     // central pillar 心柱
  for(let i=0;i<5;i++){ story(i); roof(SWd[i], RYd[i]); }
  /* sorin 相輪 */
  const top = RYd[4]+SWd[4]+3+2;
  box(0,0,top,top+11,0,0,P.gold,0.03);
  for(const [dx,dz] of[[1,0],[-1,0],[0,1],[0,-1]]) S(dx,top,dz,P.gold);
  let rr=3;
  for(let l=0;l<5;l++,rr=Math.max(1,rr-1)){
    const y=top+2+l*2;
    for(let x=-rr;x<=rr;x++)for(let z=-rr;z<=rr;z++)
      if(Math.max(Math.abs(x),Math.abs(z))===rr) S(x,y,z,j(P.gold,0.05));
  }
  ringSq(2,top-3,mul(P.goldD,1.05));                                     // lotus base of the sorin
  ringSq(1,top-2,P.gold); S(0,top-2,0,P.gold); S(0,top-1,0,P.gold);
  const fy=top+12;
  S(0,fy,0,P.white); E.push({x:0,y:fy,z:0,c:0xfff2c0});
  S(1,fy-1,0,P.gold); S(-1,fy-1,0,P.gold); S(0,fy-1,1,P.gold); S(0,fy-1,-1,P.gold);
  S(0,fy+1,0,mul(P.gold,1.25));
  lights.push({x:0,y:fy,z:0,color:0xffe6b0,intensity:16,dist:44});
}
function story(i){
  const s=SWd[i],h=SHd[i],by=SYd[i];
  for(let y=by;y<by+h;y++)
  for(let x=-s;x<=s;x++)for(let z=-s;z<=s;z++){
    const ax=Math.abs(x),az=Math.abs(z);
    if(ax!==s&&az!==s) continue;
    let c;
    if(ax===s&&az===s) c=P.vermilion;
    else if((az===s&&ax%3===0&&ax>0&&ax<s)||(ax===s&&az%3===0&&az>0&&az<s)) c=P.vermilion;
    else if(y===by||y===by+h-1) c=P.woodD;
    else c=P.plaster;
    S(x,y,z,c);
  }
  if(i===0){                                            // entrance
    for(let x=-1;x<=1;x++)for(let y=by;y<=by+2;y++) S(x,y,s, (x===0)?0x241710:P.woodD);
    S(-1,by+1,s,P.gold); S(1,by+1,s,P.gold);
    box(-2,2,by+3,by+3,s,s,P.wood,0);
    for(let x=-1;x<=1;x++)for(let y=by+4;y<=by+5;y++) S(x,y,s,P.woodD);   // plaque
    S(0,by+5,s,P.gold); S(-1,by+4,s,P.gold); S(0,by+4,s,P.gold); S(1,by+4,s,P.gold);
    lights.push({x:0,y:by+1,z:s-1,color:0xffb46a,intensity:10,dist:16});
  }
  for(const [fx,fz] of[[0,s],[0,-s],[s,0],[-s,0]]){     // lattice windows
    if(i===0&&fz===s) continue;
    for(let a=-1;a<=1;a++)
      S(fx===0?a:fx, by+2, fz===0?a:fz, Math.abs(a)===1?P.gold:P.woodD);
    S(fx,by+3,fz,P.gold);
  }
  if(i===0){                                            // veranda railing
    const b=s+1;
    for(let x=-b;x<=b;x++)for(let z=-b;z<=b;z++){
      const ax=Math.abs(x),az=Math.abs(z);
      if(Math.max(ax,az)!==b) continue;
      if((ax+az)%2===0) S(x,by,z,P.woodL);
      if((az===b&&ax%2===0)||(ax===b&&az%2===0)){ S(x,by+1,z,P.vermilion); S(x,by+2,z,P.gold); }
    }
  }
}
function roof(s,y){
  const Rh=s+3;
  for(let l=0;l<=Rh;l++){
    const half=Rh-l, yy=y+l;
    for(let x=-half;x<=half;x++)for(let z=-half;z<=half;z++){
      const ax=Math.abs(x),az=Math.abs(z);
      if(Math.max(ax,az)!==half) continue;
      S(x,yy,z, (ax===half&&az===half)? P.gold : (l%2? P.tile : P.tileD));
      if(l<=3&&ax>=half-1&&az>=half-1) S(x,yy+1,z,j(P.tile,0.06));       // upturned eaves
    }
    if(half===0){ S(0,yy,0,P.gold); S(0,yy+1,0,mul(P.goldD,1.2)); }
  }
  for(const cx of[-Rh,Rh])for(const cz of[-Rh,Rh]) S(cx,y+2,cz,P.gold);  // eave-tip finials
  for(let x=-Rh;x<=Rh;x++)for(let z=-Rh;z<=Rh;z++){
    const m=Math.max(Math.abs(x),Math.abs(z));
    if(m===Rh) S(x,y-1,z,P.woodD);                                       // soffit
    if(m===s+1) S(x,y-2,z, ((x+z)&1)? P.vermilion : P.goldD);            // dougong brackets
  }
}

/* ================================================================
   TORII GATE
   ================================================================ */
function torii(x0,z0,w=6){
  for(const sx of[-w,w]){
    box(x0+sx-1,x0+sx+1,2,9,z0-1,z0+1,P.vermilion,0.04);
    box(x0+sx-1,x0+sx+1,1,1,z0-1,z0+1,P.stoneD,0.05);
    S(x0+sx,10,z0,P.gold);
  }
  for(let x=x0-w-2;x<=x0+w+2;x++){                       // curved kasagi
    const lift=Math.abs(x-x0)>=w+1?1:0;
    S(x,10+lift,z0,P.dark); S(x,9+lift,z0,P.vermilionD);
  }
  box(x0-w,x0+w,7,7,z0,z0,P.vermilion,0.03);            // nuki
  box(x0-1,x0+1,8,9,z0,z0,P.vermilion,0.03);            // gaku strut
  S(x0,8,z0+1,P.gold);
  stoneLantern(x0-w-4,z0,1); stoneLantern(x0+w+4,z0,1);
}

/* ================================================================
   STONE LANTERN 石灯籠
   ================================================================ */
function stoneLantern(x,z,tall=1){
  box(x-1,x+1,0,0,z-1,z+1,P.stoneD,0.06);
  box(x,x,1,2,z,z,P.stone,0.06);
  box(x-1,x+1,3,3,z-1,z+1,P.stoneD,0.05);
  const fy=4+tall;
  box(x-1,x+1,fy,fy+1,z-1,z+1,P.stone,0.04);
  for(const dx of[-1,1]){ S(x+dx,fy,z,P.woodD); S(x,fy,z+dx,P.woodD); }
  for(const dy of[fy,fy+1]){ S(x,dy,z,0xffcf8a); E.push({x,y:dy,z,c:0xffcf8a}); }
  box(x-2,x+2,fy+2,fy+2,z-2,z+2,P.stoneD,0.06);          // roof lip
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++) if(Math.abs(a)+Math.abs(b)<=1) S(x+a,fy+3+b===fy+3?fy+3:fy+3,z+b,P.stone);
  S(x,fy+4,z,P.stoneL); S(x,fy+5,z,mul(P.stone,0.9));    // jewel finial
  lights.push({x,y:fy+0.5,z,color:0xffb46a,intensity:9,dist:15});
}

/* ================================================================
   ARCHED BRIDGE 太鼓橋
   ================================================================ */
function bridge(){
  const zC=15, x1=17, x2=44, L=x2-x1;
  for(let x=x1;x<=x2;x++){
    const t=(x-x1)/L, y=2+Math.round(2.6*Math.sin(Math.PI*t));
    box(x,x,y,y,zC-2,zC+2,P.vermilion,0.03);             // deck
    S(x,y-1,zC,mul(P.wood,0.9));                          // keel
    for(const dz of[-2,2]){                               // railings
      S(x,y+1,zC+dz,P.vermilionD); S(x,y+2,zC+dz,P.gold);
      if((x-x1)%3===0) S(x,y+1,zC+dz,P.vermilion);
    }
  }
  box(x1-1,x1,0,1,zC-2,zC+2,P.stone,0.05); box(x2,x2+1,0,1,zC-2,zC+2,P.stone,0.05); // abutments
}

/* ================================================================
   TREES
   ================================================================ */
function branch(x,y,z,dx,dy,dz,c){
  const n=Math.max(Math.abs(dx),Math.abs(dy),Math.abs(dz));
  for(let i=1;i<=n;i++) S(x+Math.round(dx*i/n),y+Math.round(dy*i/n),z+Math.round(dz*i/n), j(c,0.08));
}
function cherry(x,z,sc=1){
  const hgt=Math.round((15+R()*5)*sc);
  let px=x,pz=z;
  for(let y=1;y<=hgt;y++){
    if(R()<0.45){ px+=R()<0.5?-1:1; if(Math.abs(px-x)>2)px-=Math.sign(px-x); }
    if(R()<0.35){ pz+=R()<0.5?-1:1; if(Math.abs(pz-z)>2)pz-=Math.sign(pz-z); }
    const w=y<4?2:1;
    for(let dx=0;dx<=w;dx++)for(let dz=0;dz<=w;dz++) S(px+dx,y,pz+dz, mul(R()<0.75?P.woodD:P.wood,0.85+R()*0.3));
    if(y>4&&R()<0.35) S(px+2,y,pz,mul(P.woodD,1.1));                    // burl
  }
  const cx=px,cz=pz;
  const blobs=[[0,hgt+4,0,6.2],[6,hgt+2,3,5],[-5,hgt+2,-5,5.2],[3,hgt+1,-7,4.4],[-7,hgt+4,4,4.2],[7,hgt+5,-4,4],[-2,hgt+7,6,3.6],[4,hgt+6,-2,3.8]];
  for(const[ox,oy,oz,r]of blobs){
    branch(cx,hgt,cz,ox,oy-hgt,oz,P.wood);
    ellipsoid(cx+ox,oy,cz+oz, r*0.85*sc,r*0.62*sc,r*0.85*sc, [P.pink1,P.pink2,P.pink3,P.pink4,P.pink1,P.pink2], 0.09);
  }
  ellipsoid(cx,hgt+4,cz,4.4*sc,3*sc,4.4*sc,[P.pink2,P.pink3,P.pinkDeep],0.26);
  for(let i=0;i<14;i++){                                                  // dangling blossom clusters
    const a=R()*6.283,r2=(2.5+R()*2.2)*sc;
    S(Math.round(cx+Math.cos(a)*r2),hgt-2+((R()*5)|0),Math.round(cz+Math.sin(a)*r2),pick([P.pinkDeep,P.pink3]));
  }
  for(let i=0;i<46;i++){                                                  // petal fall on the ground
    const a=R()*6.283,r2=3+R()*6;
    const gx=Math.round(cx+Math.cos(a)*r2), gz=Math.round(cz+Math.sin(a)*r2);
    if(!inPondEdge(gx,gz)&&Math.hypot(gx,gz)>15) S(gx,1,gz, j(pick([P.pink1,P.pink4,P.pink2]),0.05));
  }
  cherrySpots.push({x:cx,z:cz,r:8*sc});
}
function maple(x,z,sc=1){
  const hgt=Math.round((9+R()*3)*sc);
  for(let y=1;y<=hgt;y++){
    S(x,y,z,P.woodD);
    if(R()<0.4)S(x+1,y,z,mul(P.woodD,0.9));
    if(R()<0.25)S(x,y,z-1,mul(P.woodD,1.08));
  }

/* ---- static instanced mesh ---- */
function buildInstanced(pos,col,mat){
  const g=new THREE.BoxGeometry(1,1,1);
  const m=new THREE.InstancedMesh(g,mat,col.length/3);
  const mtx=new THREE.Matrix4();
  for(let i=0;i<col.length/3;i++){
    mtx.setPosition(pos[i*3],pos[i*3+1],pos[i*3+2]);
    m.setMatrixAt(i,mtx);
    m.setColorAt(i,_c.setHex(col[i]));
  }
  m.instanceMatrix.needsUpdate=true;
  if(m.instanceColor) m.instanceColor.needsUpdate=true;
  return m;
}

    petals[o+1]-=petals[o+7]*(1+0.4*Math.sin(t+petals[o+4]));
    petals[o]  +=Math.sin(t*petals[o+3]+petals[o+4])*0.016;
    petals[o+2]+=Math.cos(t*petals[o+3]*0.8+petals[o+4])*0.014;
    petals[o+6]+=0.05+petals[o+3]*0.02;
    if(petals[o+1]<1.0) respawnPetal(i);
    dummy.position.set(petals[o],petals[o+1],petals[o+2]);
    dummy.rotation.set(petals[o+6],petals[o+6]*0.7,petals[o+6]*0.4);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i,dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;

  /* koi */
  let ci=0;
  for(const k of kois){
    const a=k.ph+t*k.spd;
    const hx=k.cx+Math.cos(a)*k.r, hz=k.cy+Math.sin(a)*k.r;
    for(let seg=0;seg<3;seg++){
      const aa=a-seg*0.38;
      dummy.position.set(k.cx+Math.cos(aa)*(k.r-seg*0.15), 0.35+Math.sin(t*2+seg*1.3)*0.05, k.cy+Math.sin(aa)*(k.r-seg*0.15));
      dummy.rotation.set(0,-aa,0);
      dummy.updateMatrix();
      koiMesh.setMatrixAt(ci++,dummy.matrix);
    }
    dummy.position.set(hx,0.35+Math.sin(t*3)*0.06,hz); dummy.rotation.set(0,-a,Math.sin(t*4)*0.25);
    dummy.updateMatrix(); koiMesh.setMatrixAt(ci++,dummy.matrix);
  }
  koiMesh.instanceMatrix.needsUpdate=true;

  /* fireflies */
  for(let i=0;i<NF;i++){
    const o=i*5;
    const a=flies[o+3]+t*0.7;
    dummy.position.set(flies[o]+Math.cos(a)*flies[o+4], flies[o+1]+Math.sin(t*2+flies[o+3])*1.6, flies[o+2]+Math.sin(a*0.8)*flies[o+4]);
    const s=0.5+0.5*Math.max(0,Math.sin(t*5+flies[o+3]*9));
    dummy.scale.setScalar(s); dummy.updateMatrix();
    flyMesh.setMatrixAt(i,dummy.matrix);
  }
  flyMesh.instanceMatrix.needsUpdate=true;

  /* birds */
  for(const b of birds){
    const a=b.ph+t*b.spd;
    const flap=Math.sin(t*9+b.ph)*0.5;
    const bx=Math.cos(a)*b.r, bz=Math.sin(a)*b.r, by=b.y+Math.sin(t*0.8+b.tilt)*3;
    b.m.matrixAutoUpdate=false;
    for(let s=0;s<3;s++){
      const off=s-1;
      dummy.position.set(0,0,0);
      dummy.rotation.set(0,-a,0);
      dummy.updateMatrix();
      const wm=new THREE.Matrix4().makeTranslation(0, flap*Math.abs(off), off*1.2).premultiply(dummy.matrix);
      wm.setPosition(bx+wm.elements[12], by+wm.elements[13], bz+wm.elements[14]);
      b.m.setMatrixAt(s,wm);
    }
    b.m.instanceMatrix.needsUpdate=true;
  }

  /* water shimmer on pond + lily reflections */
  if(pondIdx.length)for(let n=0;n<140;n++){
    const i=pondIdx[(n+((t*30)|0))%pondIdx.length];
    const x=vPos[i*3], z=vPos[i*3+2];
    const l=0.05*Math.sin(t*3.1+x*0.7+z*1.15);
    waterMesh.setColorAt(i,_c.setHex(P.water).offsetHSL(0,0,l));
  }
  waterMesh.instanceColor.needsUpdate=true;

  /* cloud drift */
  cloudMesh.position.x=((t*0.9)%300)-150;
  cloudMesh.position.z=Math.sin(t*0.05)*4;

  /* lantern flicker */
  scene.children.forEach(o=>{
    if(o.isPointLight) o.intensity=o.baseI*(0.82+0.18*Math.sin(t*7+o.ph)+0.06*Math.sin(t*23+o.ph*3));
  });

  /* ripple pulse */
  const rs=1+ (t%4)*0.55;
  rip1.scale.set(rs,rs,1);
  rip1.material.opacity=Math.max(0,0.5-0.125*(t%4));

  ctl.update();
  renderer.render(scene,cam);
}
frame();

addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
