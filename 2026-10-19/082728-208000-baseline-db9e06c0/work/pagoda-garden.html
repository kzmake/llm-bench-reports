<body>
<div id="c"></div>
<div class="panel" id="title"><h1>桜の庭 &nbsp;·&nbsp; Pagoda Garden</h1><p>a hand-placed voxel garden — five-story pagoda · koi pond · cherry blossoms</p></div>
<div class="panel" id="hud"></div>
<button id="btn">☀ &nbsp;Day</button>
<div id="fade"><span>building the garden, voxel by voxel…</span></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. UTILITIES
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R = mulberry32(20261019);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=arr=>arr[Math.floor(R()*arr.length)];
const col = arr => pick(arr);
const lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,z){const s=Math.sin(x*127.1+z*311.7)*43758.5453;return s-Math.floor(s)}
function vnoise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return lerp(lerp(hash2(xi,zi),hash2(xi+1,zi),u),lerp(hash2(xi,zi+1),hash2(xi+1,zi+1),u),v)}

/* ============================================================
   1. PALETTE
   ============================================================ */
const C = {
  grass:[0x5f9e4c,0x67a854,0x6fb05c,0x5c9448,0x72b560], grassDark:[0x4c8340,0x547f3e],
  moss:[0x4a7a3a,0x557f3d], dirt:[0x8a6a4a,0x7d6043], dirtDark:[0x6e553c],
  stone:[0xb9bcbe,0xa9adb0,0xc4c7ca,0x9ea2a6], stoneDark:[0x7d8286,0x70767a], stoneWarm:[0xc8bfae,0xbdb4a3],
  sand:[0xe6dcc2,0xded3b8], sandLine:[0xc4b189],
  waterBed:[0x274a52,0x2d555e,0x234350],
  tileDeep:[0x232b4d,0x2b3560], tileLite:[0x3a4a7d,0x455a92],
  woodDark:[0x4a3324,0x3f2c1f], wood:[0x6b4a30,0x7a5638], woodLite:[0x8f6a45],
  vermilion:[0xb83a2a,0xa83224,0xc74b33], vermilionDeep:[0x93291d],
  plaster:[0xe9e2d0,0xdfd8c5,0xf0eadd],
  gold:[0xe6b93c,0xf2ca55,0xd4a52e], goldDeep:[0xb98d2b],
  pink1:[0xf7c8d8,0xf2b8cc,0xfad1de], pink2:[0xef9dbb,0xe88fb0], pink3:[0xfce3ea,0xf9d8e4],
  trunk:[0x59402e,0x4e3826,0x63482f], trunkLite:[0x6e5236],
  pine:[0x2f5d34,0x38693d,0x2a5430,0x417545],
  maple:[0xd14f21,0xe07a2b,0xb93617,0xc85f1e,0xe8a13a],
  bamboo:[0x5d9c48,0x6cae52,0x4f8c3e], bambooLite:[0x8fc47e], leaf:[0x4f8c3e,0x5fa04a],
  stoneLite:[0xf4f1ea], ink:[0x2c2c34,0x26262e], rope:[0xa08442,0xb59a58],
  koiOrange:[0xf2622a,0xff7a3c], koiRed:[0xd92b2b], koiWhite:[0xf5f0e8], koiBlack:[0x2a2a30], koiGold:[0xf2b632],
  thatch:[0xb08d4f,0xa37f43,0xc2a05e],
  petal:[0xf6b9cd,0xfbd0dd,0xef9dbb],
  cloud:[0xffffff,0xf4f8ff,0xe9eef8],
};

/* ============================================================
   2. VOXEL STORES + PRIMITIVES
   ============================================================ */
const solid = new Map();
const glow  = new Map();
const cloudVox = new Map();
const moonVox = new Map();
const waterVox = [];
const key=(x,y,z)=>x+','+y+','+z;
function S(x,y,z,c){ solid.set(key(x,y,z), c); }
function G(x,y,z,c){ glow.set(key(x,y,z), c); }
function CL(x,y,z,c){ cloudVox.set(key(x,y,z), c); }
function W(x,y,z,c){ waterVox.push({x,y,z,c}); }
function box(x0,y0,z0,nx,ny,nz,c,fn){
  for(let dx=0;dx<nx;dx++)for(let dy=0;dy<ny;dy++)for(let dz=0;dz<nz;dz++){
    const x=x0+dx,y=y0+dy,z=z0+dz;
    S(x,y,z, fn?fn(x,y,z,c)||c:c);
  }
}
function shell(x0,y0,z0,nx,ny,nz,c,fn){
  for(let dx=0;dx<nx;dx++)for(let dy=0;dy<ny;dy++)for(let dz=0;dz<nz;dz++){
    if(!(dx===0||dx===nx-1||dy===0||dy===ny-1||dz===0||dz===nz-1)) continue;
    const x=x0+dx,y=y0+dy,z=z0+dz; S(x,y,z, fn?fn(x,y,z,c)||c:c);
  }
}
function ring(cx,cz,half,y,c,fn){
  for(let x=cx-half;x<=cx+half;x++)for(let z=cz-half;z<=cz+half;z++){
    if(Math.abs(x-cx)!==half && Math.abs(z-cz)!==half) continue;
    S(x,y,z, fn?fn(x,z,c)||c:c);
  }
}
function ellipsoid(cx,cy,cz,rx,ry,rz,c,fn){
  for(let x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++)
  for(let y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++)
  for(let z=Math.floor(cz-rz);z<=Math.ceil(cz+rz);z++){
    const d=((x-cx+.5)/rx)**2+((y-cy+.5)/ry)**2+((z-cz+.5)/rz)**2;
    if(d<=1.05) S(x,y,z, fn?fn(x,y,z,d)||c:c);
  }
}
function disc(cx,cz,r,y,c){
  for(let x=cx-r;x<=cx+r;x++)for(let z=cz-r;z<=cz+r;z++){
    if((x-cx+.5)**2+(z-cz+.5)**2<=(r+.5)**2) S(x,y,z,c);
  }
}

/* ============================================================
   3. WORLD LAYOUT
   ============================================================ */
const POND={cx:36,cz:22,rx:15,rz:10};
function streamCX(z){ return 36+6.5*Math.sin((z-30)/15); }
function inPond(x,z){ return ((x-POND.cx)/POND.rx)**2+((z-POND.cz)/POND.rz)**2 < 1; }
function inStream(x,z){ return z>31 && z<75 && Math.abs(x-streamCX(z))<2.6; }
function water(x,z){ return inPond(x,z)||inStream(x,z); }
function inPlaza(x,z){ return Math.max(Math.abs(x),Math.abs(z))<23; }
function inZen(x,z){ return x>=-52&&x<=-24&&z>=16&&z<=34; }
function inHouse(x,z){ return x>=-51&&x<=-35&&z>=41&&z<=55; }
function onPath(x,z){
  if(Math.abs(x)<4 && z>17 && z<58) return true;                       // main south approach
  if(Math.abs(z-40)<2.5 && x>12 && x<52) return true;                   // east spur → bridge → shrine
  if(Math.abs(z+x-8)<2.2 && x<-6 && z>24 && z<53) return true;          // diagonal → tea house
  return false;
}
function reserved(x,z){ return water(x,z)||inPlaza(x,z)||inZen(x,z)||inHouse(x,z)||onPath(x,z); }
function hillH(x,z){
  let h=0;
  h=Math.max(h, 3.2-0.09*Math.hypot(x+12,z+52));
  h=Math.max(h, 3.6-0.085*Math.hypot(x+60,z+14));
  h=Math.max(h, 3.0-0.10*Math.hypot(x-58,z-56));
  h=Math.max(h, 2.2-0.10*Math.hypot(x+56,z+52));
  if(h<0) h=0;
  h += (vnoise(x*0.11+40,z*0.11+40)-0.5)*0.9;
  return Math.max(0,Math.round(h));
}
function terrainTop(x,z){
  if(water(x,z)) return -1;
  if(inPlaza(x,z)) return 1;
  return 1 + hillH(x,z);
}

/* ============================================================
   4. GROUND, PLAZA, PATHS
   ============================================================ */
function buildGround(){
  for(let x=-75;x<=75;x++)for(let z=-75;z<=75;z++){
    const top=terrainTop(x,z);
    if(top===-1){ S(x,-1,z,col(C.waterBed)); continue; }
    for(let y=0;y<=top;y++){
      if(y===top){
        const patch=vnoise(x*.07,z*.07);
        let c = patch>.66?col(C.grassDark) : patch<.28?col(C.grass) : col([0x6aa454,0x649e50,0x6fab5c]);
        if(vnoise(x*.3+7,z*.3-3)>.8) c=col(C.moss);
        S(x,y,z,c);
      } else S(x,y,z, y<top-1?col(C.dirtDark):col(C.dirt));
    }
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      if(water(x+dx,z+dz)){ S(x,top,z,0x8d7f66); break; }
    }
  }
  for(let x=-23;x<=23;x++)for(let z=-23;z<=23;z++){
    const d=Math.max(Math.abs(x),Math.abs(z));
    let c=((x+z)%4===0)?col(C.stone):(((x-z)%4+4)%4===0)?col(C.stoneWarm):col(C.stone);
    if(d===22) c=col(C.stoneDark);
    if(hash2(x*3.7,z*7.1)>.965) c=col(C.moss);
    S(x,1,z,c);
  }
  for(let x=-75;x<=75;x++)for(let z=-75;z<=75;z++){
    if(!onPath(x,z)||water(x,z)||inPlaza(x,z)) continue;
    let c=((x+z)%3===0)?col(C.stoneWarm):col(C.stone);
    if(hash2(x*5.3,z*2.9)>.94) c=col(C.moss);
    S(x,terrainTop(x,z),z,c);
  }
  // stepping stones into the pond shallows
  for(let z=26;z<=31;z+=2) if(inPond(27,z)) S(27,1,z,col(C.stoneDark));
  // island with lone pine
  for(let x=29;x<=39;x++)for(let z=11;z<=19;z++){
    const e=((x-34)/4.5)**2+((z-15)/3.6)**2;
    if(e<1) S(x,1,z, e<.5?0x6a9e52:col(C.stone));
    if(e>=.8&&e<1) S(x,1,z,col(C.stoneDark));
  }
}

/* ============================================================
   5. WATER + LILIES
   ============================================================ */
const lilyCells=new Set();
function buildWater(){
  const padSpots=[[24,26],[28,29],[44,26],[48,22],[42,30],[50,17],[45,13]];
  for(const [lx,lz] of padSpots){
    for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
      if(Math.abs(dx)+Math.abs(dz)===2&&R()>.5) continue;
      lilyCells.add(key(lx+dx,0,lz+dz));
      S(lx+dx,0,lz+dz,(dx===0&&dz===0)?0x3f7a37:col([0x4c8c40,0x55984a,0x468a3c]));
    }
    if(R()>.4){ S(lx,1,lz,col([0xf7c8d8,0xffffff,0xf2b8cc])); if(R()>.5) S(lx,2,lz,0xffe08a); }
  }
  for(let x=-75;x<=75;x++)for(let z=-75;z<=75;z++){
    if(!water(x,z)||lilyCells.has(key(x,0,z))) continue;
    const deep = inPond(x,z) ? 1-(((x-POND.cx)/POND.rx)**2+((z-POND.cz)/POND.rz)**2) : .4;
    W(x,0,z, deep>.55?0x1d6f8f : deep>.28?0x2a86ab : 0x46a8c9);
  }
}

/* ============================================================
   6. FIVE-STORY PAGODA
   ============================================================ */
function tileColor(x,y,z){ return ((x+z+y)%2===0)?col(C.tileDeep):(((x*3+z)%5===0)?col(C.tileLite):col(C.tileDeep)); }
function buildPagoda(){
  const cx=0, cz=0, gy=2;
  box(cx-11,gy,cz-11,23,1,23,col(C.stoneDark));
  box(cx-10,gy+1,cz-10,21,1,21,col(C.stone));
  box(cx-9,gy+2,cz-9,19,1,19,col(C.stoneWarm));            // platform top surface y=4
  box(cx-3,gy+2,cz+10,7,1,1,col(C.stoneWarm));
  box(cx-3,gy+1,cz+11,7,1,2,col(C.stone));                 // stair
  box(cx-3,gy,cz+13,7,1,2,col(C.stone));
  // water basins flanking the stair
  for(const s of[-1,1]){ box(cx+s*6,gy,cz+12,2,1,2,col(C.stone)); S(cx+s*6,gy+1,cz+12,0x9aa0a4); W(cx+s*6+1,gy+1,cz+12,0x46a8c9); }
  let y=gy+3, half=8;
  const tiers=[{bh:6,eave:13},{bh:5,eave:11},{bh:5,eave:9},{bh:5,eave:8},{bh:5,eave:7}];
  const halves=[7,6,5,4];
  for(let t=0;t<tiers.length;t++){
    const {bh,eave}=tiers[t];
    box(cx-half+1,y,cz-half+1,half*2-1,1,half*2-1,col(C.woodDark));   // interior floor
    shell(cx-half,y,cz-half,half*2+1,bh,half*2+1,0,(x,yy,z)=>{
      const onWallX=Math.abs(x-cx)===half, onWallZ=Math.abs(z-cz)===half;
      const lvl=yy-y;
      if(onWallX&&onWallZ) return col(C.vermilion);                    // corner pillars
      if(lvl===0||lvl===bh-1) return (x+z)%2===0?col(C.woodDark):col(C.wood);
      const along=onWallX?Math.abs(z-cz):Math.abs(x-cx);
      if(along%3===0) return col(C.vermilion);                          // studs / posts
      if(t===0&&onWallZ&&lvl>=1&&lvl<=4&&Math.abs(x-cx)<=1)
        return Math.abs(x-cx)===1?col(C.goldDeep):lvl===4?col(C.woodDark):col([0x3a2718,0x33220f]);
      const winFace=(onWallX&&Math.abs(z-cz)<=1)||(onWallZ&&Math.abs(x-cx)<=1);
      if(t>0&&lvl>=2&&lvl<=bh-2&&winFace){
        const a=onWallX?Math.abs(z-cz):Math.abs(x-cx);
        if(a===0) return ((x+z+lvl)%2===0)?col(C.gold):col(C.plaster);
        if(a===1) return (lvl%2===0)?col(C.woodDark):0xefe6cf;
        return col(C.plaster);
      }
      return col(C.plaster);
    });
    if(t===0){ for(const dx of[-1,1]) for(const lv of[1,2,3]) S(cx+dx,y+lv,cz+half,0xc9a13c);   // door studs
      G(cx,y+2,cz+half-2,0xffc76b); }                                                                // lamp in doorway
    if(t===0){ // Buddha + candlelight inside
      box(cx-1,y+1,cz-2,3,1,3,col(C.wood));
      S(cx,y+2,cz-1,col(C.gold)); S(cx,y+3,cz-1,col(C.gold)); S(cx,y+4,cz-1,0xffe9a8);
      G(cx-2,y+3,cz,0xffb347); G(cx+2,y+3,cz,0xffb347); G(cx,y+3,cz+3,0xffc76b);
    }
    const bY=y+bh;                                        // balcony level
    for(let x=cx-eave;x<=cx+eave;x++)for(let z=cz-eave;z<=cz+eave;z++){
      const inBody=Math.abs(x-cx)<=half&&Math.abs(z-cz)<=half;
      const edge=Math.abs(x-cx)===eave||Math.abs(z-cz)===eave;
      if(!inBody&&(edge||(!inBody&&(Math.abs(x-cx)===eave-1&&Math.abs(z-cz)>=eave-2)))) S(x,bY,z,col(C.wood));
    }
    for(let x=cx-eave;x<=cx+eave;x++)for(const zz of[cz-eave,cz+eave]) if(x%2===0){ S(x,bY+1,zz,col(C.vermilionDeep)); S(x,bY+2,zz,col(C.gold)); }
    for(let z=cz-eave;z<=cz+eave;z++)for(const xx of[cx-eave,cx+eave]) if(z%2===0){ S(xx,bY+1,z,col(C.vermilionDeep)); S(xx,bY+2,z,col(C.gold)); }
    for(let x=cx-half;x<=cx+half;x++)for(const zz of[cz-eave,cz+eave]) if((x-cx)%3===0) S(x,bY-1,zz,col(C.vermilion));
    for(let z=cz-half;z<=cz+half;z++)for(const xx of[cx-eave,cx+eave]) if((z-cz)%3===0) S(xx,bY-1,z,col(C.vermilion));
    const rb=bY+1;
    for(let i=0;i<4;i++){ const h=eave-i; ring(cx,cz,h,rb+i,0,(x,z)=>tileColor(x,rb+i,z)); }
    for(const sx of[-1,1])for(const sz of[-1,1]){
      S(cx+sx*(eave+1),rb,cz+sz*eave,col(C.tileDeep));
      S(cx+sx*eave,rb,cz+sz*(eave+1),col(C.tileDeep));
      S(cx+sx*(eave+1),rb+1,cz+sz*(eave+1),col(C.tileDeep));
      S(cx+sx*(eave+1),rb+2,cz+sz*(eave+1),col(C.gold));
      if(t<2) G(cx+sx*(eave+1),rb,cz+sz*(eave+1),0xffd875); else S(cx+sx*(eave+1),rb,cz+sz*(eave+1),col(C.gold));
    }
    const hTop=eave-3;
    for(const sx of[-1,1])for(const sz of[-1,1]) S(cx+sx*hTop,rb+4,cz+sz*hTop,col(C.goldDeep));
    y=rb+4; half=halves[t]??4;
  }
  const fy=y;
  box(cx-1,fy,cz-1,3,1,3,col(C.goldDeep));
  for(let i=0;i<7;i++){ const r=i%2===0?2:1; box(cx-r,fy+1+i,cz-r,r*2+1,1,r*2+1,col(C.gold)); }
  box(cx,fy+8,cz,1,4,1,col(C.gold));
  ellipsoid(cx,fy+13,cz,1,1.3,1,col(C.gold));
  G(cx,fy+15,cz,0xfff2b0);                                  // finial jewel
}

/* ============================================================
   7. TORII
   ============================================================ */
function buildTorii(cx,cz,scale=1){
  const h=Math.round(9*scale), pW=scale>1?2:1, spread=Math.round(5*scale);
  for(let i=0;i<h;i++){
    const lean=Math.floor(i/5);
    for(const s of[-1,1]){
      const xx=cx+s*spread-lean*s+(pW===2?(s>0?0:-1):0), zz=cz+(pW===2?-1:0);
      box(xx,2+i,zz,pW,1,pW, i===0?col(C.stoneDark):col(C.vermilion));
    }
  }
  const topY=2+h;
  for(const s of[-1,1]) box(cx+s*spread-1,2,cz-1,3,1,3,col(C.stone));   // collars
  box(cx-spread-1,topY-3,cz,(spread+1)*2+1,2,1,col(C.vermilionDeep));   // nuki
  box(cx-1,topY-1,cz-2,3,2,1,col(C.ink)); S(cx,topY-2,cz-2,col(C.gold)); // plaque
  box(cx-spread-3,topY,cz-1,(spread+3)*2+1,1,3,col(C.ink));             // shimagi
  box(cx-spread-2,topY+1,cz-1,(spread+2)*2+1,1,3,col(C.ink));           // kasagi
  for(const s of[-1,1]){
    box(cx+s*(spread+3)+(s>0?1:-2),topY+1,cz-1,2,1,3,col(C.ink));
    box(cx+s*(spread+4)+(s>0?1:-2),topY+2,cz-1,1,1,3,col(C.ink));
    S(cx+s*(spread+4),topY+3,cz,col(C.gold));
  }
}
function buildToriiMini(cx,cz){
  for(const s of[-1,1]){ const y0=terrainTop(cx+s*2,cz)+1; box(cx+s*2,y0,cz,1,5,1,col(C.vermilion)); }
  const yT=terrainTop(cx,cz)+6;
  box(cx-3,yT,cz,7,1,1,col(C.ink)); S(cx-3,yT+1,cz,col(C.ink)); S(cx+3,yT+1,cz,col(C.ink));
}

/* ============================================================
   8. ARCHED BRIDGE
   ============================================================ */
function buildBridge(cx,cz,len){
  const hw=len/2|0;

const skyUni={top:{value:new THREE.Color(0x77b5e8)},bot:{value:new THREE.Color(0xdceefc)},
  sun:{value:new THREE.Color(0xffe9c9)},sunDir:{value:new THREE.Vector3(1,1,1)}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(420,24,14), new THREE.ShaderMaterial({
  side:THREE.BackSide, uniforms:skyUni, depthWrite:false,
  vertexShader:`varying vec3 vP; void main(){vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vP; uniform vec3 top,bot,sun,sunDir;
   void main(){ vec3 d=normalize(vP); float h=pow(max(d.y,0.),.55);
     vec3 c=mix(bot,top,h); float s=max(dot(d,normalize(sunDir)),0.);
     c+=sun*pow(s,12.)*.45; gl_FragColor=vec4(c,1.);}`
}));
scene.add(sky);
scene.fog=new THREE.Fog(0xdceefc,170,420);

const hemi=new THREE.HemisphereLight(0xbfd9ff,0x4b5a3a,.9); scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,.25); scene.add(amb);
const sun=new THREE.DirectionalLight(0xfff1d0,1.6);
sun.position.set(80,90,60); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const scc=sun.shadow.camera; scc.left=-120;scc.right=120;scc.top=120;scc.bottom=-120;scc.near=1;scc.far=400;
sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);
const sunSprite=new THREE.Sprite(new THREE.SpriteMaterial({color:0xfff3d8,transparent:true,opacity:.95,depthWrite:false}));
sunSprite.scale.set(18,18,1); scene.add(sunSprite);

function makeMesh(map, material, cast=true){
  const items=[...map.entries()];
  const m=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), material, items.length);
  const d=new THREE.Object3D();
  items.forEach((e,i)=>{
    const [k,c]=e; const [x,y,z]=k.split(',').map(Number);
    d.position.set(x+.5,y+.5,z+.5); d.updateMatrix();
    m.setMatrixAt(i,d.matrix);
    m.setColorAt(i,new THREE.Color(c??0xff00ff));
  });
  m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true;
  m.castShadow=cast; m.receiveShadow=true;
  m.computeBoundingSphere();
  scene.add(m);
  return m;
}
const solidMesh = makeMesh(solid,new THREE.MeshLambertMaterial({color:0xffffff}));
const glowMesh  = makeMesh(glow,new THREE.MeshBasicMaterial({color:0xffffff,toneMapped:false}),false);
const cloudMesh = makeMesh(cloudVox,new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.95}),false);
const moonMesh=makeMesh(moonVox,new THREE.MeshBasicMaterial({color:0xf2f0e2,fog:true,toneMapped:false,transparent:true}),false);
const starPos=new Float32Array(520*3);
for(let i=0;i<520;i++){ const u=R()*1.15-.1, th=R()*Math.PI*2, rr2=Math.sqrt(Math.max(0,1-u*u));
  starPos[i*3]=Math.cos(th)*rr2*360; starPos[i*3+1]=Math.abs(u)*360; starPos[i*3+2]=Math.sin(th)*rr2*360; }
const starsGeo=new THREE.BufferGeometry(); starsGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const starsMat=new THREE.PointsMaterial({color:0xdfe8ff,size:1.9,sizeAttenuation:false,transparent:true,opacity:0,fog:false,depthWrite:false});
const stars=new THREE.Points(starsGeo,starsMat); scene.add(stars);

const dm=new THREE.Object3D();
const waterMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),
  new THREE.MeshPhongMaterial({color:0xffffff,transparent:true,opacity:.55,specular:0x9fd8ee,shininess:110,depthWrite:false}),
  waterVox.length);
waterVox.forEach((w,i)=>{
  dm.position.set(w.x+.5,w.y+.5,w.z+.5); dm.updateMatrix();
  waterMesh.setMatrixAt(i,dm.matrix); waterMesh.setColorAt(i,new THREE.Color(w.c));
});
waterMesh.instanceMatrix.needsUpdate=true; scene.add(waterMesh);

const foam=[];
if(waterfall) for(let x=waterfall.x0;x<=waterfall.x1;x++)for(let j=0;j<6;j++) foam.push({x,fall:true,ph:j/6});
for(const [bx,bz] of[[29,16],[36,17],[33,18],[31,17],[34,16],[32,15]]) foam.push({x:bx,z:bz,fall:false});
const foamMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,.9,1),
  new THREE.MeshLambertMaterial({color:0xeaf7ff,transparent:true,opacity:.9}),foam.length);
foam.forEach((f,i)=>{ dm.position.set(f.x+.5,f.fall?5:f.z===undefined?0:.55,f.z??waterfall.z+.45); dm.updateMatrix(); foamMesh.setMatrixAt(i,dm.matrix); });
foamMesh.instanceMatrix.needsUpdate=true; scene.add(foamMesh);

/* ----- koi ----- */
const fishDefs=[
  {c1:0xff6a2a,c2:0xfdf3e4, rx:11,  rz:6.5, ph:0, sp:.5 },
  {c1:0xfdf3e4,c2:0xe33131, rx:8,   rz:5,   ph:2, sp:.62},
  {c1:0x2b2b33,c2:0xf2b632, rx:5.5, rz:7.5, ph:4, sp:.45},
  {c1:0xff6a2a,c2:0xfdf3e4, rx:12.5,rz:4,   ph:1, sp:.58},
];
const fishMeshes=[];
for(const fd of fishDefs){
  const vox=[{x:0,y:0,z:1,c:0x1d1d24},{x:0,y:0,z:-1,c:0x1d1d24}];   // eyes
  for(let i=0;i<7;i++){
    vox.push({x:-i,y:0,z:0,c: i%2===0?fd.c1:fd.c2});
    if(i>0&&i<5){ vox.push({x:-i,y:0,z:1,c:fd.c1}); vox.push({x:-i,y:0,z:-1,c:fd.c1}); }
    if(i===2) vox.push({x:-i,y:1,z:0,c:fd.c2});                      // dorsal patch
    if(i===5){ vox.push({x:-i-1,y:0,z:2,c:fd.c2}); vox.push({x:-i-1,y:0,z:-2,c:fd.c2}); vox.push({x:-i-1,y:0,z:0,c:fd.c1}); }
  }
  const m=new THREE.InstancedMesh(new THREE.BoxGeometry(.7,.5,.62),
    new THREE.MeshLambertMaterial({color:0xffffff}),vox.length);
  vox.forEach((v,i)=>m.setColorAt(i,new THREE.Color(v.c)));
  m.userData={vox,fd}; scene.add(m); fishMeshes.push(m);
}

/* ----- petals ----- */
const N_PETAL=760, petals=[];
const petalMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.46,.12,.34),
  new THREE.MeshLambertMaterial({color:0xffffff}),N_PETAL);
petalMesh.castShadow=false; scene.add(petalMesh);
function spawnPetal(p,init){
  const c=pick(cherryCanopies.length?cherryCanopies:[[0,45,0,12]]);
  p.x=c[0]+(R()*2-1)*c[3]; p.y=c[1]+R()*6; p.z=c[2]+(R()*2-1)*c[3];
  p.ph=R()*6.28; p.sp=.4+R()*.8; p.rot=R()*6.28; p.rotSp=(R()-.5)*2; p.t=init?R()*40:0;
}
for(let i=0;i<N_PETAL;i++){ const p={}; spawnPetal(p,true); petals.push(p);
  petalMesh.setColorAt(i,new THREE.Color(col(C.petal))); }
petalMesh.instanceColor.needsUpdate=true;

/* ----- fireflies ----- */
const N_FF=42, ff=[];
for(let i=0;i<N_FF;i++) ff.push({x:ri(-60,60),y:3+ri(0,4),z:ri(-60,60),ph:R()*6.28});
const ffMesh=new THREE.InstancedMesh(new THREE.SphereGeometry(.17,6,5),
  new THREE.MeshBasicMaterial({color:0xd8ff9a,transparent:true,opacity:0,toneMapped:false}),N_FF);
scene.add(ffMesh);

/* ----- birds ----- */
const birdMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.9,.25,.25),
  new THREE.MeshLambertMaterial({color:0x2b2f38}),15);
scene.add(birdMesh);

/* ============================================================
   18. DAY / NIGHT
   ============================================================ */
const PRESETS=[
  {name:'Day',    skyT:0x77b5e8, skyB:0xdceefc, fog:0xdceefc, sun:0xfff1d0, sunI:1.7, hemiSky:0xbfd9ff, hemiG:0x55663d, hemiI:.95, amb:.28, dir:[80,90,60],  night:0,  disc:0xfff3d8},
  {name:'Golden', skyT:0x4a6fb5, skyB:0xffb47e, fog:0xf8b98c, sun:0xffb066, sunI:1.5, hemiSky:0xa7b8e8, hemiG:0x6b4a3a, hemiI:.7,  amb:.2,  dir:[-115,24,42], night:.3, disc:0xffa860},
  {name:'Night',  skyT:0x0a1030, skyB:0x1b2a52, fog:0x141f3d, sun:0x9fb4ff, sunI:.35, hemiSky:0x31406e, hemiG:0x141a2a, hemiI:.5,  amb:.08, dir:[-60,85,-80], night:1,  disc:0xe8eeff},
];
let pFrom={...PRESETS[0], dir:[...PRESETS[0].dir]}, pTo=PRESETS[0], pT=1;
const cur={night:0};
function snapshot(){ return {skyT:skyUni.top.value.getHex(), skyB:skyUni.bot.value.getHex(), fog:scene.fog.color.getHex(),
  sun:sun.color.getHex(), sunI:sun.intensity, hemiSky:hemi.color.getHex(), hemiG:hemi.groundColor.getHex(), hemiI:hemi.intensity,
  amb:amb.intensity, dir:[sun.position.x,sun.position.y,sun.position.z], night:cur.night, disc:sunSprite.material.color.getHex()}; }
const _ca=new THREE.Color(), _cb=new THREE.Color();
function lerpC(t,a,b){ _ca.setHex(a); _cb.setHex(b); _ca.lerp(_cb,t); return _ca; }
function applyBlend(t){
  skyUni.top.value.copy(lerpC(t,pFrom.skyT,pTo.skyT));
  skyUni.bot.value.copy(lerpC(t,pFrom.skyB,pTo.skyB));
  scene.fog.color.copy(lerpC(t,pFrom.fog,pTo.fog));
  sun.color.copy(lerpC(t,pFrom.sun,pTo.sun));
  sun.intensity=lerp(pFrom.sunI,pTo.sunI,t);
  hemi.color.copy(lerpC(t,pFrom.hemiSky,pTo.hemiSky));
  hemi.groundColor.copy(lerpC(t,pFrom.hemiG,pTo.hemiG));
  hemi.intensity=lerp(pFrom.hemiI,pTo.hemiI,t);
  amb.intensity=lerp(pFrom.amb,pTo.amb,t);
  sun.position.set(lerp(pFrom.dir[0],pTo.dir[0],t),lerp(pFrom.dir[1],pTo.dir[1],t),lerp(pFrom.dir[2],pTo.dir[2],t));
  sunSprite.material.color.copy(lerpC(t,pFrom.disc,pTo.disc));
  cur.night=lerp(pFrom.night,pTo.night,t);
}
let presetIdx=0;
const btn=document.getElementById('btn');
function cyclePreset(){
  presetIdx=(presetIdx+1)%3;
  pFrom=snapshot(); pTo=PRESETS[presetIdx]; pT=0;
  btn.innerHTML=(presetIdx===0?'☀':presetIdx===1?'🌇':'🌙')+'&nbsp; '+pTo.name;
}
btn.addEventListener('click',cyclePreset);
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); cyclePreset(); } });

/* ============================================================
   19. LOOP
   ============================================================ */
const clock=new THREE.Clock();
let lastInteract=-10;
controls.addEventListener('start',()=>lastInteract=clock.elapsedTime);
const hud=document.getElementById('hud');
const totalVoxels=solid.size+glow.size+waterVox.length+cloudVox.size+moonVox.size+foam.length;
function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(pT<1){ pT=Math.min(1,pT+dt*.7); applyBlend(pT); }
  const night=cur.night;
  if(t-lastInteract>5){ const a=t*.045;
    camera.position.set(Math.cos(a)*122, 54+Math.sin(t*.08)*10, Math.sin(a)*122);
    controls.target.set(0,24,0); }
  controls.update();
  skyUni.sunDir.value.copy(sun.position).normalize();
  sunSprite.position.copy(sun.position).normalize().multiplyScalar(380);

  for(let i=0;i<waterVox.length;i++){
    const w=waterVox[i];
    dm.position.set(w.x+.5, w.y+.5+Math.sin(t*1.7+w.x*.35+w.z*.5)*.07, w.z+.5);
    dm.rotation.set(0,0,0); dm.scale.set(1,1,1); dm.updateMatrix();
    waterMesh.setMatrixAt(i,dm.matrix);
  }
  waterMesh.instanceMatrix.needsUpdate=true;

  foam.forEach((f,i)=>{
    if(f.fall){ const cyc=(t*1.4+f.ph)%1; dm.position.set(f.x+.5, 8-cyc*7.6, waterfall.z+.45); }
    else dm.position.set(f.x+.5, .6+Math.sin(t*7+f.x+f.z)*.1, f.z+.5);
    dm.rotation.set(0,0,0); dm.scale.set(1,1,1); dm.updateMatrix(); foamMesh.setMatrixAt(i,dm.matrix);
  });
  foamMesh.instanceMatrix.needsUpdate=true;

  for(const m of fishMeshes){
    const fd=m.userData.fd, tt=t*fd.sp+fd.ph;
    const fx=POND.cx+Math.cos(tt)*fd.rx, fz=POND.cz+Math.sin(tt*1.13)*fd.rz;
    const dx=-Math.sin(tt)*fd.rx, dz=Math.cos(tt*1.13)*fd.rz*1.13;
    const L=Math.hypot(dx,dz)||1, th=Math.atan2(-dz/L,dx/L);
    const ct=Math.cos(th), st=Math.sin(th);
    m.userData.vox.forEach((v,i)=>{
      const wig=Math.sin(t*5-v.x*.9+fd.ph)*.12*Math.max(0,-v.x-1);
      const a=th+wig, ca=Math.cos(a), sa=Math.sin(a);
      const lx=v.x*.62, lz=v.z*.62;
      dm.position.set(fx+lx*ca+lz*sa, .66+v.y*.5, fz-lx*sa+lz*ca);
      dm.rotation.set(0,a,0); dm.scale.set(1,1,1); dm.updateMatrix();
      m.setMatrixAt(i,dm.matrix);
    });
    m.instanceMatrix.needsUpdate=true;
  }

  for(let i=0;i<N_PETAL;i++){
    const p=petals[i];
    p.y-=p.sp*dt*2.2;
    p.x+=Math.sin(t*.9+p.ph)*dt*1.1+dt*.8;
    p.z+=Math.cos(t*.7+p.ph)*dt*.7+dt*.5;
    p.rot+=p.rotSp*dt;
    if(p.y<.3||p.x>82||p.z>82){ spawnPetal(p,false); }
    dm.position.set(p.x,p.y,p.z);
    dm.rotation.set(p.rot*.7,p.rot,p.rot*.4); dm.scale.set(1,1,1); dm.updateMatrix();
    petalMesh.setMatrixAt(i,dm.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;

  ffMesh.visible=night>.2;
  ffMesh.material.opacity=Math.max(0,(night-.2))*1.4;
  if(ffMesh.visible){
    ff.forEach((f,i)=>{
      dm.position.set(f.x+Math.sin(t*.8+f.ph)*2.2, f.y+Math.sin(t*1.3+f.ph*2)*1.1, f.z+Math.cos(t*.6+f.ph)*2.2);
      const s=.4+Math.max(0,Math.sin(t*4+f.ph*7));
      dm.scale.set(s,s,s); dm.rotation.set(0,0,0); dm.updateMatrix(); ffMesh.setMatrixAt(i,dm.matrix);
    });
    ffMesh.instanceMatrix.needsUpdate=true;
  }
  glowMesh.material.color.copy(new THREE.Color(0xffb347).lerp(new THREE.Color(0xffffff),1-night));
  starsMat.opacity=Math.max(0,(night-.3))*1.1;
  stars.rotation.y=t*.004;
  moonMesh.visible=night>.1;
  moonMesh.material.opacity=THREE.MathUtils.clamp((night-.1)*1.6,0,1);

  birdMesh.visible=night<.5;
  if(birdMesh.visible){
    for(let i=0;i<15;i++){
      const grp=i%3, a=t*.25+grp*2.1;
      dm.position.set(Math.cos(a)*(34+grp*5)-(i%3===1?1.6:0), 46+grp*4+Math.sin(t*2+i)*1.2-(i%3===1?.3:0), Math.sin(a)*(30+grp*6)-10);
      dm.rotation.set(0,-a+Math.PI/2,(i===grp*3?0:Math.sin(t*9+i)*.35));
      dm.scale.set(1,1,1); dm.updateMatrix(); birdMesh.setMatrixAt(i,dm.matrix);
    }
    birdMesh.instanceMatrix.needsUpdate=true;
  }
  cloudMesh.position.x=Math.sin(t*.02)*16;

  hud.innerHTML=`<b>voxels</b> ${totalVoxels.toLocaleString()} &nbsp;·&nbsp; <b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>space</b> time of day<br><b>auto-cinematic</b> resumes after 5s idle`;
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
tick();
setTimeout(()=>{ const f=document.getElementById('fade'); f.style.opacity=0; setTimeout(()=>f.remove(),2400); },250);
</script>
</body>
