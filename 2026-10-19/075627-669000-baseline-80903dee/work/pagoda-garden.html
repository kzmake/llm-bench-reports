<!DOCTYPE html>

<body>
<div id="hud">
  <h1>五重塔 <span>VOXEL PAGODA GARDEN</span></h1>
  <div class="row"><input id="hour" type="range" min="0" max="24" step="0.1" value="8.8"><div id="clock">08:48</div></div>
  <div class="btns">
    <button data-h="5.7">Dawn</button><button data-h="12.2">Noon</button>
    <button data-h="17.6">Dusk</button><button data-h="22.5">Night</button>
    <button id="rot">Auto-orbit</button>
  </div>
  <div id="stats">building voxels…</div>
</div>
<div id="tip">drag to orbit &nbsp;·&nbsp; scroll to zoom &nbsp;·&nbsp; right-drag to pan &nbsp;·&nbsp; H hides panel</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ============ seeded rng + noise ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=mulberry32(20261019);
const R=(a=1,b)=>b===undefined?rng()*a:a+rng()*(b-a);
const RI=(a,b)=>Math.floor(R(a,b+0.999999));
const pick=arr=>arr[Math.floor(rng()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function hash2(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)}
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  return hash2(xi,zi)*(1-u)*(1-v)+hash2(xi+1,zi)*u*(1-v)+hash2(xi,zi+1)*(1-u)*v+hash2(xi+1,zi+1)*u*v;
}
const C=h=>new THREE.Color(h);

/* ============ voxel buffers ============ */
const SOLID=[],GLOW=[];   // {x,y,z,c:Color}
function solid(x,y,z,c){SOLID.push({x:Math.round(x),y:Math.round(y),z:Math.round(z),c:c instanceof THREE.Color?c:C(c)})}
function glow(x,y,z,c){GLOW.push({x:Math.round(x),y:Math.round(y),z:Math.round(z),c:c instanceof THREE.Color?c:C(c)})}
function box(x0,y0,z0,x1,y1,z1,c){const a=[x0,x1].sort((p,q)=>p-q),b=[y0,y1].sort((p,q)=>p-q),d=[z0,z1].sort((p,q)=>p-q);
  for(let x=a[0];x<=a[1];x++)for(let y=b[0];y<=b[1];y++)for(let z=d[0];z<=d[1];z++)solid(x,y,z,c)}
function boxG(x0,y0,z0,x1,y1,z1,c){const a=[x0,x1].sort((p,q)=>p-q),b=[y0,y1].sort((p,q)=>p-q),d=[z0,z1].sort((p,q)=>p-q);
  for(let x=a[0];x<=a[1];x++)for(let y=b[0];y<=b[1];y++)for(let z=d[0];z<=d[1];z++)glow(x,y,z,c)}
function blob(x,y,z,r,pal,hollow=false,holes=0.16){
  const r2=r*r;
  for(let dx=-Math.ceil(r);dx<=Math.ceil(r);dx++)for(let dy=-Math.ceil(r);dy<=Math.ceil(r);dy++)for(let dz=-Math.ceil(r);dz<=Math.ceil(r);dz++){
    const dd=dx*dx+dy*dy+dz*dz; if(dd>r2)continue;
    if(hollow&&dd<(r-1.4)*(r-1.4))continue;
    if(hash2(x*3.7+dx*11.3+dz*0.9,z*5.1+dy*7.7)<holes)continue;
    solid(x+dx,y+dy,z+dz,pick(pal));
  }
}
function ellipsoid(cx,cy,cz,rx,ry,rz,pal,holes=0.12){
  for(let dx=-Math.ceil(rx);dx<=Math.ceil(rx);dx++)for(let dy=-Math.ceil(ry);dy<=Math.ceil(ry);dy++)for(let dz=-Math.ceil(rz);dz<=Math.ceil(rz);dz++){
    const dd=(dx*dx)/(rx*rx)+(dy*dy)/(ry*ry)+(dz*dz)/(rz*rz); if(dd>1)continue;
    if(hash2(cx+dx*3.1+dy,cz+dz*2.7+dy)<holes)continue;
    solid(cx+dx,cy+dy,cz+dz, dy>ry*0.55? pick(pal.slice(0,2)) : pick(pal));
  }
}

/* ============ palettes ============ */
const PAL={
  wood:C('#96633f'),woodDark:C('#6b452e'),woodRich:C('#a9713f'),woodPale:C('#c9a56b'),
  beam:C('#3f2a1c'),red:C('#a33b2b'),redDark:C('#8f3123'),vermilion:C('#c14a30'),
  tile:C('#2e3f66'),tileDark:C('#253355'),tileEdge:C('#1b2540'),
  gold:C('#d9a441'),goldPale:C('#ecc66a'),
  stone:C('#8d8f92'),stoneDark:C('#6f7174'),stoneLight:C('#a7a9a9'),mossStone:C('#7d8b6a'),
  sand:C('#cbb98f'),gravel:C('#ded8c6'),gravelDark:C('#b9b3a1'),dirt:C('#5b4632'),dirtDark:C('#46362a'),
  mud:C('#3f3b26'),
  grass:[C('#5a8f3c'),C('#689a44'),C('#71a64c'),C('#548437'),C('#4c7a34'),C('#7fae57')],
  moss:[C('#3f6b30'),C('#4f7a35'),C('#5d8a40')],
  pinkCanopy:[C('#f7c8d8'),C('#f2aec6'),C('#fbc9dd'),C('#eea0bc'),C('#fff5f7'),C('#f5bcd2'),C('#d988a8')],
  pinkDeep:[C('#c96f95'),C('#d97fa5'),C('#b95f88')],
  maple:[C('#c8402a'),C('#e06a35'),C('#d94f2e'),C('#b23822'),C('#e88a3c'),C('#9c2f1f')],
  pine:[C('#2f5d3a'),C('#3c6e46'),C('#274d31'),C('#437a4e')],
  bamboo:[C('#7fae57'),C('#6f9e4a'),C('#8ebd63'),C('#5c8a3f')],
  bambooLeaf:[C('#9cc06a'),C('#85b055'),C('#aad07a')],
  thatch:[C('#9a7d48'),C('#ad8f57'),C('#8a6f3f'),C('#c0a26a')],
  water:C('#2e7d9c'),
  koiO:[C('#ff7f2a'),C('#f2f2ec')],
  rockG:[C('#82837e'),C('#94968e'),C('#6f7168'),C('#7d8b6a')],
  white:C('#f5f5f5'),shoji:C('#ffe9c0'),fire:C('#ffcf85'),
  petalGround:[C('#f3c0d2'),C('#efb0c8'),C('#f8d4e0')],
};

/* ============ layout ============ */
const POND={x:20,z:-6,rx:20,ry:13}, WATER_Y=1.6;
const INLET={x0:38,x1:52,z0:-9,z1:-3};
const MAIN=[[68,68],[60,58],[52,46],[40,38],[26,36],[10,38],[-6,34],[-14,22],[-18,8],[-22,-6],[-24,-13],[-31,-16]];
const BR_A=[[40,38],[44,32],[48,31]];
const BR_B=[[10,38],[20,30],[24,20],[24,8],[30,2],[38,0],[44,-5],[50,-3],[54,-1]];
const FLAT=[[-59,-55,-17,-13],[39,13,59,31],[-3,49,19,67]]; // pagoda, teahouse, zen rect
const pondD=(x,z)=>{const dx=(x-POND.x)/POND.rx,dz=(z-POND.z)/POND.ry;return Math.sqrt(dx*dx+dz*dz)};
function segDist(px,pz,ax,az,bx,bz){const dx=bx-ax,dz=bz-az;const L=dx*dx+dz*dz;
  const t=L?clamp(((px-ax)*dx+(pz-az)*dz)/L,0,1):0;return Math.hypot(px-(ax+dx*t),pz-(az+dz*t))}
function pathDist(x,z){let m=1e9;
  for(const p of[MAIN,BR_A,BR_B])for(let i=0;i<p.length-1;i++)m=Math.min(m,segDist(x,z,p[i][0],p[i][1],p[i+1][0],p[i+1][1]));
  return m}
function inFlat(x,z){for(const f of FLAT)if(x>=f[0]&&x<=f[2]&&z>=f[1]&&z<=f[3])return true;return false}
function rectEdge(x,z,r,ex0,ez0,ex1,ez1){
  const cx=clamp(x,ex0,ex1),cz=clamp(z,ez0,ez1);return Math.hypot(x-cx,z-cz)<r}

const H_HALF=76;
const hmap=new Float32Array((2*H_HALF+1)*(2*H_HALF+1));
const hAt=(x,z)=>hmap[(z+H_HALF)*(2*H_HALF+1)+(x+H_HALF)];
function buildHeight(){
  for(let x=-H_HALF;x<=H_HALF;x++)for(let z=-H_HALF;z<=H_HALF;z++){
    let h=2+2.1*vnoise(x*0.035,z*0.035)+1.1*vnoise(x*0.11+7,z*0.11+3)+0.5*vnoise(x*0.23+11,z*0.23+21);
    // entrance plaza flattens toward corner
    if(x>58&&z>56)h=lerp(h,2,0.6);
    // waterfall hill
    const dh=Math.hypot(x-57,z+7); if(dh<8)h+=Math.cos(clamp(dh/8,0,1)*Math.PI/2)*7;
    // pond + inlet dig
    const d=pondD(x,z);
    if(d<1.25)h=lerp(h,-4.2,clamp((1.25-d)/0.28,0,1));
    const ie=rectEdge(x,z,0,INLET.x0,INLET.z0,INLET.x1,INLET.z1);
    const di=rectEdge(x,z,5,INLET.x0,INLET.z0,INLET.x1,INLET.z1)-0;
    const diRaw=Math.hypot(x-clamp(x,INLET.x0,INLET.x1),z-clamp(z,INLET.z0,INLET.z1));
    if(diRaw<6.5)h=lerp(h,-4.2,clamp((6.5-diRaw)/2.2,0,1));
    // flatten feature rects
    for(const f of FLAT){if(x>=f[0]&&x<=f[2]&&z>=f[1]&&z<=f[3]){h=2}}
    // path grading
    const pd=pathDist(x,z);
    if(pd<5)h=lerp(h,2,clamp((5-pd)/2.4,0,1)*0.85);
    // board border drop (world edge skirt)
    hmap[(z+H_HALF)*(2*H_HALF+1)+(x+H_HALF)]=h;
  }
}
buildHeight();

/* ============ terrain fill ============ */
function buildTerrain(){
  for(let x=-H_HALF;x<=H_HALF;x++)for(let z=-H_HALF;z<=H_HALF;z++){
    const h=hAt(x,z),y=Math.floor(h);
    const d=pondD(x,z),di=Math.hypot(x-clamp(x,INLET.x0,INLET.x1),z-clamp(z,INLET.z0,INLET.z1));
    const underwater=(d<1.06&&h<1)||(di<3.4&&h<1);
    let c;
    if(underwater){ c=h<-1.5?PAL.mud:PAL.dirt; }
    else{
      const n=vnoise(x*0.16,z*0.16);
      const sandy=pathDist(x,z)<2.6+n*0.7;
      const shore=(d>1.0&&d<1.22)||(di>3&&di<5);
      const zen=(x>=-3&&x<=19&&z>=49&&z<=67);
      if(zen){ c=(Math.sin((z-49)*1.9+vnoise(x*0.4,z*0.4)*1.6)>0.55)?PAL.gravel:PAL.gravelDark; }
      else if(sandy){ c=(vnoise(x*0.5+3,z*0.5)>0.62)?PAL.stoneLight:((hash2(x*9.7,z*3.3)>0.9)?PAL.stone:PAL.sand); }
      else if(shore){ c=hash2(x*5.3,z*7.7)>0.5?C('#b09468'):C('#c2a87e'); }
      else if(y>=5&&h>4.6){ c=PAL.rockG?pick(PAL.rockG):PAL.stone; }
      else{ c=n>0.66?pick(PAL.moss):pick(PAL.grass); if(hash2(x*13.1,z*17.3)>0.965)c=hash2(x*2.2,z*8.8)>0.5?C('#f2e6c8'):C('#e7a0b5'); }
    }
    solid(x,y,z,c);
    // skirt: fill down to lowest neighbour
    let low=y-1;
    for(const[nx,nz]of[[x+1,z],[x-1,z],[x,z+1],[x,z-1]]){
      if(Math.abs(nx)>H_HALF||Math.abs(nz)>H_HALF)continue;
      low=Math.min(low,Math.floor(hAt(nx,nz)));
    }
    low=Math.max(low,y-4);
    for(let yy=y-1;yy>=low;yy--)solid(x,yy,z,underwater?PAL.dirtDark:(y-yy>1?PAL.dirtDark:PAL.dirt));
  }
}

/* ============ tree generators ============ */
function branch(x,y,z,dx,dy,dz,len,rad,depth,tips){
  let px=x,py=y,pz=z,vx=dx,vy=dy,vz=dz;
  for(let i=0;i<len;i++){
    px+=vx;py+=vy;pz+=vz;
    vx=clamp(vx+R(-0.14,0.14),-0.55,0.55);vz=clamp(vz+R(-0.14,0.14),-0.55,0.55);vy=clamp(vy+R(-0.04,0.02),0.5,1);
    const c=depth>1?PAL.wood:(hash2(px,pz)>0.5?PAL.wood:PAL.woodDark);
    for(let a=-Math.floor(rad/1.01);a<=Math.floor(rad/1.01);a++)
      for(let b=-Math.floor(rad/1.01);b<=Math.floor(rad/1.01);b++)
        solid(Math.round(px+a),Math.round(py),Math.round(pz+b),c);
    if(rad>1&&i%3===0)solid(Math.round(px+(rng()<.5?rad: -rad)),Math.round(py),Math.round(pz),PAL.woodDark);
    if(depth>0&&i>2&&i<len*0.65&&rng()<0.22){
      const nt=[];branch(px,py,pz,vx+R(-0.7,0.7),R(0.6,0.95),vz+R(-0.7,0.7),len*0.5,Math.max(1,rad-1),depth-1,nt);
      for(const t of nt)tips.push(t);
    }
  }
  tips.push([px,py,pz]);
  return tips;
}
const PETAL_EMITTERS=[];
function canopyBlobs(cx,cy,cz,spread,count,rMin,rMax,pal,deepPal){
  for(let i=0;i<count;i++){
    const bx=Math.round(cx+R(-spread,spread)),by=Math.round(cy+R(-spread*0.55,spread*0.5)),bz=Math.round(cz+R(-spread,spread));
    const r=rMin+R(0,rMax-rMin);
    const palUse=(rng()<0.22&&deepPal)?deepPal:pal;
    blob(bx,by,bz,r,palUse,false,0.2);
    if(i<3)PETAL_EMITTERS.push([bx,by,bz]);
  }
}
function cherryTree(x,z,s=1,weeping=false){
  const y=hAt(x,z);
  const leanX=weeping?R(-1.4,-0.5):R(-0.3,0.3),leanZ=weeping?R(-1.2,0.2):R(-0.3,0.3);
  const tips=branch(x,y+1,z,leanX*0.25,1,leanZ*0.25,Math.round(9*s),Math.round(1.8*s)+ (s>1?1:0),2,[]);
  const top=[x+leanX*3,y+9*s+R(0,2),z+leanZ*3];
  canopyBlobs(top[0],top[1],top[2],5.5*s,RI(6,9),2.6*s,4.6*s,PAL.pinkCanopy,PAL.pinkDeep);
  if(weeping){
    for(let k=0;k<26;k++){
      const a=R(0,Math.PI*2),rr=R(2,7.5);
      const dx=Math.round(top[0]+Math.cos(a)*rr),dz=Math.round(top[2]+Math.sin(a)*rr),dy=Math.round(top[1]+R(-2,-0.5));
      const L=RI(4,9);
      for(let i=0;i<L;i++){
        const c=i<2?PAL.pinkCanopy[0]:pick([PAL.pinkCanopy[1],PAL.pinkCanopy[4],PAL.pinkDeep[0],PAL.pinkDeep[1]]);
        solid(dx+R(-0.001,0.001)|0,dy-i,dz,c);
      }
    }
  }
  for(const t of tips)PETAL_EMITTERS.push(t);
  // fallen-petal ground cover
  const gy=Math.floor(hAt(x,z));
  for(let k=0;k<70*k0(s);k++){
    const a=R(0,Math.PI*2),rr=R(1,8*s);
    const px=Math.round(x+Math.cos(a)*rr),pz=Math.round(z+Math.sin(a)*rr);
    if(px<-H_HALF||px>H_HALF||pz<-H_HALF||pz>H_HALF)continue;
    const h=hAt(px,pz);if(h<1.2||pathDist(px,pz)<2)continue;
    if(hash2(px*4.7,pz*2.9)<0.55)continue;
    solid(px,Math.floor(h)+1,pz,pick(PAL.petalGround));
  }
}
const k0=s=>s;
function mapleTree(x,z,s=1){
  const y=hAt(x,z);
  const tips=branch(x,y+1,z,R(-0.4,0.4),1,R(-0.4,0.4),Math.round(8*s),1+ (s>1?1:0),2,[]);
  const top=[x+R(-2,2),y+8*s,z+R(-2,2)];
  canopyBlobs(top[0],top[1],top[2],4.5*s,RI(5,7),2.2*s,4*s,PAL.maple,C('#9c2f1f')?[PAL.maple[3],PAL.maple[5]]:null);
}
function pineTree(x,z,s=1){
  const y=hAt(x,z);
  const tips=branch(x,y+1,z,R(-0.15,0.15),1,R(-0.15,0.15),Math.round(9*s),2,0,[]);
  let py=y+Math.round(4*s);
  const n=RI(3,5);
  for(let k=0;k<n;k++){
    const px=Math.round(x+R(-2.5,2.5)),pz=Math.round(z+R(-2.5,2.5));
    ellipsoid(px,py,pz,Math.round((4.4-k*0.7)*s),Math.max(1,Math.round(1.4*s)),Math.round((4.4-k*0.7)*s),PAL.pine,0.14);
    py+=Math.round(2.6*s);
  }
}
function bambooStalk(x,z){
  const y=hAt(x,z),hgt=RI(13,20);
  const lean=R(-0.08,0.08),lz=R(-0.05,0.05);
  let px=x,pz=z;
  for(let i=1;i<=hgt;i++){
    px+=lean;pz+=lz;
    const node=(i%4===0);
    solid(Math.round(px),y+i,Math.round(pz),node?PAL.bamboo[3]:pick(PAL.bamboo.slice(0,3)));
    if(node&&rng()<0.9){const a=RI(0,3);const off=[[1,0],[-1,0],[0,1],[0,-1]][a];
      solid(Math.round(px)+off[0],y+i,Math.round(pz)+off[1],pick(PAL.bambooLeaf));
      if(rng()<0.4)solid(Math.round(px)+off[0],y+i+1,Math.round(pz)+off[1],pick(PAL.bambooLeaf));}
    if(i===hgt){solid(Math.round(px),y+i+1,Math.round(pz),PAL.bambooLeaf);solid(Math.round(px)+1,y+i,Math.round(pz),PAL.bambooLeaf);solid(Math.round(px)-1,y+i,Math.round(pz),PAL.bamboo[2]);}
  }
}
function rockPile(x,z,r,n=RI(2,4)){
  const y=hAt(x,z);
  for(let i=0;i<n;i++)blob(Math.round(x+R(-1.5,1.5)),Math.round(y+r*0.4+i*0.6+R(0,1)),Math.round(z+R(-1.5,1.5)),R(r*0.55,r),PAL.rockG,false,0.25);
  // moss cap
  if(rng()<0.7)blob(Math.round(x+R(-1,1)),Math.round(y+r+R(0,2)),Math.round(z+R(-1,1)),R(0.9,1.6),[PAL.moss[1],PAL.mossStone],false,0.3);
}

/* ============ structures ============ */
function buildPlatform(cx,cz){ // pagoda stone base
  const y=2;
  box(cx-18,y,cz-18,cx+18,y,cz+18,PAL.stoneLight);
  box(cx-17,y+1,cz-17,cx+17,y+1,cz+17,PAL.stone);
  box(cx-16,y+2,cz-16,cx+16,y+2,cz+16,PAL.stoneLight);
  box(cx-15,y+3,cz-15,cx+15,y+3,cz+15,PAL.stone);
  for(let sx=cx-12;sx<=cx+12;sx++)solid(sx,y+1,cz+18,PAL.stone);

/* ============ instanced voxel meshes ============ */
function buildInstanced(list,mat,shadow){
  const mesh=new THREE.InstancedMesh(BOX,mat,list.length);
  mesh.frustumCulled=false;mesh.castShadow=shadow;mesh.receiveShadow=true;
  const d=new THREE.Object3D();
  for(let i=0;i<list.length;i++){const v=list[i];
    d.position.set(v.x,v.y,v.z);d.updateMatrix();
    mesh.setMatrixAt(i,d.matrix);
    const j=(hash2(v.x*3.1+v.y*0.7,v.z*2.3+v.y*1.9)-0.5)*0.045;
    const c=v.c.clone();c.offsetHSL(0,0,j);
    mesh.setColorAt(i,c);
  }
  mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
  scene.add(mesh);return mesh;
}
const solidMesh=buildInstanced(SOLID,new THREE.MeshLambertMaterial(),true);
const glowMesh=buildInstanced(GLOW,new THREE.MeshBasicMaterial(),false);
document.getElementById('stats').textContent=
  `${SOLID.length.toLocaleString()} surface voxels · ${GLOW.length} emissive · ${(SOLID.length+GLOW.length).toLocaleString()} instanced, 2 draw calls for the world`;

/* ============ petals ============ */
const PET_N=760;

petalMesh.frustumCulled=false;scene.add(petalMesh);
const petalCols=[C('#f7c8d8'),C('#f2aec6'),C('#eea0bc'),C('#fff5f7'),C('#e79fbc')];
const petals=[];
function resetPetal(p,randY){
  const e=pick(PETAL_EMITTERS.length?PETAL_EMITTERS:[[6,24,26]]);
  p.x=e[0]+R(-7,7);p.y=(randY?R(2,26):e[1]+R(-3,4));p.z=e[2]+R(-7,7);
  p.vx=R(-0.02,0.02);p.vz=R(-0.02,0.02);p.ry=R(0,6.28);p.rx=R(0,6.28);p.wy=R(1.5,3.5);p.wr=R(2,5);p.ph=R(0,6.28);
  petalMesh.setColorAt(p.i,pick(petalCols));
}
for(let i=0;i<PET_N;i++){const p={i};resetPetal(p,true);petals.push(p);}
if(petalMesh.instanceColor)petalMesh.instanceColor.needsUpdate=true;

/* ============ fireflies ============ */
const FF_N=110;
const ffGeo=new THREE.BufferGeometry();const ffPos=new Float32Array(FF_N*3);
const ffSeed=[];
for(let i=0;i<FF_N;i++){const x=POND.x+R(-30,34),z=POND.z+R(-22,26);ffSeed.push({x,y:R(2.6,8),z,ph:R(0,6.28),sp:R(0.3,0.9)});
  ffPos.set([x,ffSeed[i].y,z],i*3);}
ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const ffMat=new THREE.PointsMaterial({color:'#e8ff9e',size:1.15,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(ffGeo,ffMat));

/* ============ lantern point lights (subset) ============ */
const lanternLights=LIGHTS.slice(0,7).map((p,i)=>{
  const l=new THREE.PointLight(0xffa65c,0,26,2);l.position.set(p[0],p[1],p[2]);scene.add(l);return l;});
const bellLight=new THREE.PointLight(0xffd98a,0,34,2);bellLight.position.set(-38,66,-34);scene.add(bellLight);

/* ============ day/night ============ */
const SKY={
  nightTop:C('#070b1e'),dayTop:C('#5f9fe8'),
  nightHor:C('#101a33'),dayHor:C('#cfe3ee'),
  duskHor:C('#ff9a5c'),duskTop:C('#54427e'),
  fogNight:C('#0d1428'),fogDay:C('#c9dfe8'),fogDusk:C('#e8a06a'),
  waterNight:C('#152a3f'),
};
let hour=8.8,autoRot=false;
const hourEl=document.getElementById('hour'),clockEl=document.getElementById('clock');
function fmt(h){const hh=Math.floor(h),mm=Math.floor((h-hh)*60);return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`}
hourEl.addEventListener('input',()=>hour=parseFloat(hourEl.value));
document.querySelectorAll('.btns button[data-h]').forEach(b=>b.addEventListener('click',()=>{hour=parseFloat(b.dataset.h);hourEl.value=hour;}));
document.getElementById('rot').addEventListener('click',e=>{autoRot=!autoRot;controls.autoRotate=autoRot;e.target.style.background=autoRot?'rgba(255,160,110,.4)':'';});
window.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H')document.getElementById('hud').classList.toggle('hidden');});

const tmpC=new THREE.Color(),tmpC2=new THREE.Color();
// gradient sky via canvas texture
const skyCanvas=document.createElement('canvas');skyCanvas.width=4;skyCanvas.height=512;
const skyCtx=skyCanvas.getContext('2d');
const skyTex=new THREE.CanvasTexture(skyCanvas);skyTex.colorSpace=THREE.SRGBColorSpace;
scene.background=skyTex;
function drawSky(top,hor){
  const g=skyCtx.createLinearGradient(0,0,0,512);
  g.addColorStop(0,'#'+top.getHexString());
  g.addColorStop(0.6,'#'+hor.getHexString());
  g.addColorStop(1,'#'+hor.clone().multiplyScalar(0.8).getHexString());
  skyCtx.fillStyle=g;skyCtx.fillRect(0,0,4,512);
  skyTex.needsUpdate=true;
}
function updateSky(t){
  const th=(hour-6)/12*Math.PI;
  const elev=Math.sin(th), cosT=Math.cos(th);
  const day=clamp(elev*1.6+0.12,0,1);
  const dusk=clamp(1-Math.abs(elev)*3.4,0,1);
  const isNight=elev<0;
  const sx=cosT*140,sy=elev*190,sz=cosT*-45;
  if(isNight)sun.position.set(-sx,Math.abs(sy)*0.9+36,-sz);
  else sun.position.set(sx,Math.max(sy,6),sz);
  sun.target.position.set(0,10,0);
  if(!isNight){sun.intensity=day*1.75;sun.color.copy(tmpC.set('#fff2dc')).lerp(C('#ff9a54'),dusk*0.85);}
  else{sun.intensity=0.34;sun.color.set('#9db3e8');}
  hemi.intensity=day*0.72+0.3;
  hemi.color.copy(tmpC.copy(SKY.dayTop)).lerp(SKY.nightTop,1-day);
  hemi.groundColor.copy(C('#4a4432')).lerp(C('#141126'),1-day);
  amb.intensity=0.26+(1-day)*0.12;
  const top=tmpC2.copy(SKY.dayTop).lerp(SKY.nightTop,1-day).lerp(SKY.duskTop,dusk*0.8);
  const hor=new THREE.Color().copy(SKY.dayHor).lerp(SKY.nightHor,1-day).lerp(SKY.duskHor,dusk*0.9);
  const fogC=new THREE.Color().copy(SKY.fogDay).lerp(SKY.fogNight,1-day).lerp(SKY.fogDusk,dusk*0.8);
  drawSky(top,hor);scene.fog.color.copy(fogC);
  sunDisc.position.set(sx*2.4,sy*2.4+8,sz*2.4);sunDisc.visible=elev>-0.06;
  sunDisc.material.color.copy(C('#ffdf91')).lerp(C('#ff7a45'),dusk);
  moonDisc.position.set(-sx*2.4,Math.abs(sy)*2.2+50,-sz*2.4);moonDisc.visible=isNight;
  stars.material.opacity=clamp((1-day)*1.4-0.3,0,0.95);
  waterMat.color.copy(PAL.water).lerp(SKY.waterNight,1-day);
  waterMat.opacity=0.78+0.1*day;
  petalMesh.material.color.setScalar(0.42+0.58*day);
  const g=0.5+0.5*(1-day);
  glowMesh.material.color.setScalar(g);
  for(let i=0;i<lanternLights.length;i++){
    const flick=1+0.28*Math.sin(t*7.3+i*2.1)+0.16*Math.sin(t*13.7+i*5.3);
    lanternLights[i].intensity=(1-day)*2.8*flick;
  }
  bellLight.intensity=(1-day)*2.4*(1+0.1*Math.sin(t*3));
  ffMat.opacity=clamp((1-day)*1.3-0.45,0,0.95);
  controls.target.y=14;
  clockEl.textContent=fmt(hour);
}

/* ============ animate ============ */
const clock=new THREE.Clock();
const oa=new THREE.Object3D();
function tick(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  updateSky(t);
  hour+=dt*0.002; if(hour>24)hour-=24; // slow drift
  hourEl.value=hour;
  // koi
  for(const k of actors.koi){
    const a=t*k.speed+k.phase;
    const x=POND.x+Math.cos(a)*k.a,z=POND.z+Math.sin(a*1.0+ k.phase*0.3)*k.b;
    if(pondD(Math.round(x),Math.round(z))>0.94)continue;
    const wob=Math.sin(a*2)*0.25;
    k.g.position.set(x,WATER_Y-0.45+Math.sin(t*1.2+k.phase)*0.08,z);
    k.g.rotation.y=-a+Math.PI/2+wob;
    k.tail.rotation.y=Math.sin(t*9+k.phase)*0.6;
  }
  // clouds
  for(const c of actors.clouds){c.g.position.x+=c.speed*dt;if(c.g.position.x>150)c.g.position.x=-150;if(c.g.position.x<-150)c.g.position.x=150;}
  // birds
  for(const b of actors.birds){
    const a=t*b.sp+b.ph;
    b.g.position.set(b.cx+Math.cos(a)*b.r, b.y+Math.sin(a*3)*1.2, b.cz+Math.sin(a)*b.r);
    b.g.rotation.y=-a;
    const flap=Math.sin(t*10+b.ph)*0.6+0.3;b.wl.rotation.z=flap;b.wr.rotation.z=-flap;
  }
  // petals
  for(let i=0;i<PET_N;i++){const p=petals[i];
    p.vy=(p.vy||0)+dt*1.1;p.vy=Math.min(p.vy,1.7);
    p.x+=(p.vx+Math.sin(t*p.wy+p.ph)*0.55)*dt*6;p.z+=(p.vz+Math.cos(t*p.wy*0.8+p.ph)*0.5)*dt*6;p.y-=p.vy*dt*2.4;
    p.rx+=dt*p.wr;p.ry+=dt*p.wr*0.7;
    const gy=hAt(clamp(Math.round(p.x),-H_HALF,H_HALF),clamp(Math.round(p.z),-H_HALF,H_HALF));
    if(p.y<gy+0.6||p.y<0){resetPetal(p,false);}
    oa.position.set(p.x,p.y,p.z);oa.rotation.set(p.rx,p.ry,0);oa.scale.setScalar(1);oa.updateMatrix();
    petalMesh.setMatrixAt(i,oa.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate=true;
  if(petalMesh.instanceColor)petalMesh.instanceColor.needsUpdate=true;
  // fireflies
  const arr=ffGeo.attributes.position.array;
  for(let i=0;i<FF_N;i++){const s=ffSeed[i];
    arr[i*3]=s.x+Math.sin(t*s.sp+s.ph)*2.2;
    arr[i*3+1]=s.y+Math.sin(t*s.sp*1.7+s.ph*2)*1.1;
    arr[i*3+2]=s.z+Math.cos(t*s.sp*0.8+s.ph)*2.2;}
  ffGeo.attributes.position.needsUpdate=true;
  // ripples
  for(const r of ripples){
    const ph=((t+r.t0)%4)/4;
    r.m.scale.setScalar(0.5+ph*7);
    r.m.material.opacity=(1-ph)*0.5;
  }
  // shishi-odoshi tip cycle
  if(SHISHI){SHISHI.rotation.z=Math.sin(t*0.55)*0.5-(Math.sin(t*0.55)>0.93?-0.9:0);SHISHI.rotation.x=0;}
  // water bob
  pondMesh.position.y=WATER_Y+Math.sin(t*1.1)*0.05;inletMesh.position.y=WATER_Y+Math.sin(t*1.1+1.5)*0.05;
  controls.update();
  renderer.render(scene,camera);
}
renderer.setAnimationLoop(tick);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* debug handle */
window.__garden={scene,setHour:h=>hour=h};
window.__setCam=(x,y,z,tx=0,ty=14,tz=0)=>{camera.position.set(x,y,z);controls.target.set(tx,ty,tz);controls.update();};
